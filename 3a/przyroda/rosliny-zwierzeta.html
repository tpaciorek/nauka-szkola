    const MAX_STARS = LEVELS.length * 3;
    const REWARDS = [
      { frac: 0.15, id: 'glasses', name: 'okulary', icon: '👓' },
      { frac: 0.35, id: 'scarf', name: 'szalik', icon: '🧣' },
      { frac: 0.6, id: 'hat', name: 'słomkowy kapelusz', icon: '🎓' },
      { frac: 0.85, id: 'crown', name: 'złota korona', icon: '👑' }
    ].map(r => ({ ...r, at: Math.max(1, Math.round(r.frac * MAX_STARS)) }));
    const PRAISE = ['Super!', 'Brawo!', 'Hu hu! Świetnie!', 'Ekstra!', 'Tak jest! 🎉', 'Prawdziwa przyrodniczka! 🌾', 'Wow, pięknie!', 'Doskonale!'];


    /* ---------- Stan i zapis ---------- */
    function defaultState() { return { stars: {}, found: {}, seen: {}, streak: { last: null, count: 0 }, sfx: true, read: true }; }
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(CONFIG.storageKey));
        if (s) return Object.assign(defaultState(), s);
      } catch (e) {}
      return defaultState();
    }
    function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {} }
    const state = loadState();

    const totalStars = () => LEVELS.reduce((s, l) => s + (state.stars[l.id] || 0), 0);
    const accessories = () => REWARDS.filter(r => totalStars() >= r.at).map(r => r.id);
    const unlocked = i => i === 0 || !!state.stars[LEVELS[i - 1].id];

    function dayStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); }
    function bumpStreak() {
      const t = dayStr(new Date()), s = state.streak;
      if (s.last === t) return;
      s.count = s.last === yesterdayStr() ? s.count + 1 : 1;
      s.last = t;
    }
    const currentStreak = () => state.streak.last === dayStr(new Date()) || state.streak.last === yesterdayStr() ? state.streak.count : 0;


    /* ---------- Dźwięki ---------- */
    let actx = null;
    function tone(freqs, dur = 0.1, type = 'sine', vol = 0.15) {
      if (!state.sfx) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = actx.currentTime;
        freqs.forEach((f, i) => {
          const o = actx.createOscillator(), g = actx.createGain(), st = t0 + i * dur;
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0, st);
          g.gain.linearRampToValueAtTime(vol, st + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, st + dur * 1.6);
          o.connect(g).connect(actx.destination);
          o.start(st); o.stop(st + dur * 1.7);
        });
      } catch (e) {}
    }
    const sfx = { good: () => tone([660, 990], 0.09), bad: () => tone([240, 180], 0.12, 'triangle'), tap: () => tone([520], 0.04, 'sine', 0.07), flip: () => tone([440, 660], 0.06, 'sine', 0.08), win: () => tone([523, 659, 784, 1047], 0.12), lose: () => tone([392, 330, 262], 0.16, 'triangle') };

    /* ---------- Czytanie na głos ----------
       Tempo jak u ucznia 3 klasy: wolniej (CONFIG.rate) i przerwa po każdym
       zdaniu (CONFIG.pauseMs). Tekst dzielimy na zdania i czytamy po kolei. */
    let plVoice = null, sayBtn = null, sayToken = 0, sayTimer = null;
    function pickVoice() {
      if (!window.speechSynthesis) return;
      const pl = speechSynthesis.getVoices().filter(v => /^pl/i.test(v.lang));
      plVoice = pl.find(v => /Google|Natural|Online|Neural|Siri|Zosia|Ewa/i.test(v.name)) || pl.find(v => /Paulina|Zofia|Marek/i.test(v.name)) || pl[0] || null;
    }
    if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
    function plain(html) {
      const d = document.createElement('div');
      d.innerHTML = String(html).replace(/___/g, ' … ');
      d.querySelectorAll('.no-read, .say-mini, .letter, .fb, .ff').forEach(e => e.remove());
      d.querySelectorAll('.blank:not(.filled)').forEach(e => { e.textContent = ' … '; });
      d.querySelectorAll('h2, h3, p, li, .th-tip, .th-rule, .quiz-opt, .q-text, .q-num').forEach(e => e.append(/[.!?:…]\s*$/.test(e.textContent) ? ' ' : '. '));
      return d.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu, ' ')
        .replace(/→|←|↓|↑|✕|✓|„|”/g, ' ').replace(/(\s*\.\s*){2,}/g, '. ').replace(/\s+/g, ' ').trim();
    }
    // dzielimy tylko na prawdziwe zdania: po . ! ? … i gdy dalej jest wielka litera
    // („kto? co?” i dwukropki zostają w jednym kawałku); krótkie kawałki doklejamy do następnego
    function sentences(t) {
      const raw = t.split(/(?<=[.!?…])\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ0-9])/u).map(s => s.trim()).filter(s => /[\p{L}\d]/u.test(s));
      const out = [];
      for (const s of raw) { if (out.length && out[out.length - 1].length < 28) out[out.length - 1] += ' ' + s; else out.push(s); }
      return out;
    }
    function markSaying(btn) { if (sayBtn) sayBtn.classList.remove('on'); sayBtn = btn || null; if (sayBtn) sayBtn.classList.add('on'); }
    let sayQueue = [];
    function stopSpeak() { sayToken++; sayQueue = []; clearTimeout(sayTimer); try { speechSynthesis.cancel(); } catch (e) {} markSaying(null); }
    // append = true: nie przerywaj tego, co Sówka czyta – dopisz na koniec (np. odwrócona karta)
    function speak(text, btn, append) {
      if (!window.speechSynthesis || !text) return;
      if (append && sayQueue.length + (sayBtn || speechSynthesis.speaking ? 1 : 0) > 0) { sayQueue.push(...sentences(text)); return; }
      stopSpeak();
      const my = sayToken;
      sayQueue = sentences(text);
      markSaying(btn);
      const next = () => {
        if (my !== sayToken) return;
        if (!sayQueue.length) { markSaying(null); return; }
        const u = new SpeechSynthesisUtterance(sayQueue.shift());
        u.lang = 'pl-PL'; if (plVoice) u.voice = plVoice;
        u.rate = CONFIG.rate; u.pitch = 1.05;
        let done = false;
        const go = () => { if (done || my !== sayToken) return; done = true; sayTimer = setTimeout(next, CONFIG.pauseMs); };
        u.onend = u.onerror = go;
        try { speechSynthesis.speak(u); } catch (e) { go(); }
      };
      next();
    }
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-say]');
      if (!b) return;
      if (sayBtn === b) { stopSpeak(); return; }
      const el = document.querySelector(b.dataset.say);
      const ex = b.dataset.extra ? document.querySelector(b.dataset.extra) : null;
      if (el) speak(plain(el.innerHTML + (ex ? '. ' + ex.innerHTML : '')), b);
    });
    const sayMini = (sel, extra) => `<button class="say-mini" data-say="${sel}" ${extra ? `data-extra="${extra}"` : ''} aria-label="Przeczytaj na głos">🔊</button>`;

    /* ---------- Sówka Lulu (leśna, brązowa) ---------- */
    function owlSVG(mood) {
      const acc = accessories();
      const eyes = mood === 'happy'
        ? `<path d="M31 64 q13 -13 26 0 M63 64 q13 -13 26 0" stroke="#1e1b4b" stroke-width="5" fill="none" stroke-linecap="round"/>`
        : `<circle cx="44" cy="62" r="14" fill="#fff"/><circle cx="76" cy="62" r="14" fill="#fff"/>
           <circle cx="46" cy="63" r="7" fill="#1e1b4b"/><circle cx="78" cy="63" r="7" fill="#1e1b4b"/>
           <circle cx="48.5" cy="60" r="2.3" fill="#fff"/><circle cx="80.5" cy="60" r="2.3" fill="#fff"/>
           ${mood === 'sad' ? '<path d="M32 44 l20 5 M88 44 l-20 5" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>' : ''}`;
      const scarf = acc.includes('scarf')
        ? `<rect x="24" y="84" width="72" height="12" rx="6" fill="#16a34a"/><rect x="70" y="90" width="12" height="28" rx="4" fill="#15803d"/>
           <path d="M70 104 h12 M70 110 h12" stroke="#86efac" stroke-width="2"/>` : '';
      const glasses = acc.includes('glasses')
        ? `<circle cx="44" cy="62" r="16" fill="rgba(255,255,255,0.12)" stroke="#1e1b4b" stroke-width="3.5"/>
           <circle cx="76" cy="62" r="16" fill="rgba(255,255,255,0.12)" stroke="#1e1b4b" stroke-width="3.5"/>
           <path d="M58 60 q2 -3 4 0" stroke="#1e1b4b" stroke-width="3.5" fill="none"/>` : '';
      const crown = acc.includes('crown')
        ? `<polygon points="36,40 37,12 49,27 60,5 71,27 83,12 84,40" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round"/>
           <circle cx="60" cy="30" r="4" fill="#ef4444"/><circle cx="45" cy="33" r="3" fill="#3b82f6"/><circle cx="75" cy="33" r="3" fill="#22c55e"/>` : '';
      const hat = acc.includes('hat') && !acc.includes('crown')
        ? `<path d="M44 34 v10 q16 7 32 0 v-10z" fill="#3f6212"/>
           <polygon points="26,30 60,16 94,30 60,44" fill="#365314"/>
           <path d="M60 30 L90 33 V48" stroke="#facc15" stroke-width="3" fill="none"/><circle cx="90" cy="50" r="4" fill="#facc15"/>` : '';
      return `<svg class="owl-svg" viewBox="0 0 120 135" aria-hidden="true">
        <ellipse cx="60" cy="131" rx="34" ry="4" fill="rgba(20,50,31,0.14)"/>
        <polygon points="26,46 19,14 47,32" fill="#78350f"/>
        <polygon points="94,46 101,14 73,32" fill="#78350f"/>
        <ellipse cx="60" cy="80" rx="42" ry="46" fill="#b45309"/>
        <ellipse cx="21" cy="92" rx="11" ry="24" fill="#78350f" transform="rotate(14 21 92)"/>
        <ellipse cx="99" cy="92" rx="11" ry="24" fill="#78350f" transform="rotate(-14 99 92)"/>
        <ellipse cx="60" cy="98" rx="26" ry="27" fill="#fef3c7"/>
        <path d="M48 96 q5 5 10 0 M62 96 q5 5 10 0 M55 107 q5 5 10 0" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        ${eyes}
        <polygon points="54,73 66,73 60,84" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
        <ellipse cx="47" cy="126" rx="8" ry="4.5" fill="#f59e0b"/><ellipse cx="73" cy="126" rx="8" ry="4.5" fill="#f59e0b"/>
        ${scarf}${glasses}${hat}${crown}
      </svg>`;
    }

    function owlSay(html, mood) {
      const b = $('#bubble');
      if (b) { b.innerHTML = html; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
      const o = $('#owl');
      if (o) {
        o.innerHTML = owlSVG(mood);
        o.classList.remove('jump', 'shake'); void o.offsetWidth;
        if (mood === 'happy') o.classList.add('jump');
        if (mood === 'sad') o.classList.add('shake');
      }
    }

    function confetti() {
      const colors = ['#16a34a', '#facc15', '#ea580c', '#d6a06a', '#4ade80', '#a16207'];
      for (let i = 0; i < 45; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = pick(colors);
        c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
        c.style.animationDelay = Math.random() * 0.4 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3800);
      }
    }

    function markFound(id) { state.found[id] = true; }

    /* ---------- Górny pasek ---------- */
    function updateTopbar() {
      $('#starCount').textContent = totalStars();
      $('#streakCount').textContent = currentStreak();
      $('#sfxBtn').textContent = state.sfx ? '🔔' : '🔕';
      $('#readBtn').textContent = state.read ? '🗣️' : '🤐';
      $('#readBtn').title = state.read ? 'Sówka czyta na głos' : 'Czytanie wyłączone';
    }
    $('#readBtn').addEventListener('click', () => {
      state.read = !state.read; save(); updateTopbar();
      if (state.read) speak('Hu hu! Będę czytać na głos.'); else stopSpeak();
    });
    $('#sfxBtn').addEventListener('click', () => { state.sfx = !state.sfx; save(); updateTopbar(); });

    /* ---------- Pętla gier zręcznościowych ---------- */
    let raf = null, keyHandler = null, timers = [];
    function stopGame() {
      if (raf) cancelAnimationFrame(raf);
      raf = null; keyHandler = null;
      timers.forEach(clearTimeout); timers = [];
    }
    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function gameLoop(step) {
      let last = performance.now();
      const f = now => {
        const dt = Math.min(50, now - last); last = now;
        if (step(dt) !== false) raf = requestAnimationFrame(f);
      };
      raf = requestAnimationFrame(f);
    }
    document.addEventListener('keydown', e => { if (keyHandler) keyHandler(e); });

    /* =====================================================================
       MAPA
       ===================================================================== */
    function renderMap() {
      stopGame(); stopSpeak();
      document.body.classList.remove('in-level');
      updateTopbar();
      const tot = totalStars();
      const next = REWARDS.find(r => tot < r.at);
      const prevAt = [...REWARDS].reverse().find(r => tot >= r.at)?.at || 0;
      const pct = next ? Math.round((tot - prevAt) / (next.at - prevAt) * 100) : 100;
      const cur = LEVELS.findIndex((l, i) => unlocked(i) && !state.stars[l.id]);

      let greet;
      if (tot === 0) greet = CONFIG.intro;
      else if (tot === MAX_STARS) greet = 'Hu hu! Znasz rośliny z pola i wiesz, kto co je w przyrodzie! 🏆 Możesz wracać do ulubionych zadań, kiedy tylko chcesz.';
      else if (cur >= 0) greet = `Witaj z powrotem na polu! 🌾 Dziś czeka na Ciebie: <b>${LEVELS[cur].name}</b>. Dasz radę! 💪`;
      else greet = 'Wszystkie zadania odblokowane! Zagraj jeszcze raz tam, gdzie brakuje Ci gwiazdek ⭐.';

      const node = (l, i) => {
        const s = state.stars[l.id] || 0, un = unlocked(i);
        const cls = (!un ? 'locked' : i === cur ? 'current' : s ? 'done' : '') + (l.arcade ? ' arcade' : '');
        return `<button class="node ${cls}" data-level="${i}" ${un ? '' : 'disabled'} style="--off:${[0, 1, 2, 1][i % 4]}">
          <span class="node-icon">${un ? l.icon : '🔒'}</span>
          <span class="node-body"><span class="node-num">${l.boss ? 'Finał' : l.arcade ? 'Gra zręcznościowa' : `Zadanie ${i + 1}`}</span>
            <span class="node-name">${l.name}</span><span class="node-desc">${l.desc}</span></span>
          <span class="node-stars">${'★'.repeat(s)}<span class="off">${'★'.repeat(3 - s)}</span></span>
          ${i === cur ? '<span class="here">🦉 Tu jesteś!</span>' : ''}
        </button>`;
      };

      const albumItems = [...PL_GROUPS, ...ZW_GROUPS].map(g => ITEMS.filter(i => i.kind !== 'pr' && i.g === g)).flat();
      const foundN = albumItems.filter(i => state.found[i.id]).length;
      const album = albumItems.map(i => {
        const got = !!state.found[i.id];
        return `<div class="album-item ${got ? '' : 'locked'}" style="${lc(i.g)}" title="${got ? i.name : '???'}">
          <div class="ph">${got ? `<img src="${src(i.id)}" alt="${i.name}" loading="lazy" />` : '?'}</div>
          <span>${got ? i.name : '???'}</span></div>`;
      }).join('');

      screen.innerHTML = `
        <section class="hero">
          <div class="owl-big">${owlSVG(tot === MAX_STARS ? 'happy' : '')}</div>
          <div class="bubble">${greet}</div>
        </section>
        <div class="reward-bar">
          ${next ? `🎁 Następna nagroda dla Sówki: ${next.icon} <b>${next.name}</b> – jeszcze ${next.at - tot} ⭐` : '👑 Sówka ma już wszystkie nagrody!'}
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
        <h2 class="section-title">🗺️ Polna ścieżka</h2>
        <div class="path">${LEVELS.map(node).join('<div class="path-dots"></div>')}</div>
        <h2 class="section-title">📸 Mój zielnik i zwierzyniec</h2>
        <p class="muted">Każda roślina i każde zwierzę, które dobrze przypiszesz do grupy, trafia do albumu. Masz ${foundN} z ${albumItems.length}.</p>
        <div class="album">${album}</div>
        <button class="info-btn" id="srcBtn">📷 Skąd są zdjęcia?</button>
        <button class="link-btn danger" id="resetBtn">Zacznij od nowa (dla rodzica)</button>`;

      screen.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => startLevel(+b.dataset.level)));
      $('#srcBtn').addEventListener('click', renderSources);
      $('#resetBtn').addEventListener('click', () => {
        if (confirm('Usunąć wszystkie gwiazdki i album w tej grze?')) {
          try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
          location.reload();
        }
      });
      window.scrollTo(0, 0);
    }

    function renderSources() {
      const NAMES = { pole: 'Pole pszenicy', trawa: 'Trawa', orka: 'Orka', kombajn: 'Kombajn', maka: 'Mąka', chleb: 'Chleb i bułki', piekarz: 'Ciasto na chleb', kasza: 'Kasza gryczana', amarantus: 'Amarantus', skorzonera: 'Skorzonera', leszczyna: 'Orzechy laskowe', borowka: 'Borówka', muchomor: 'Muchomor' };
      const ids = Object.keys(CREDITS);
      screen.innerHTML = `
        <div class="info-wrap">
          <section class="hero">
            <div class="owl-mini">${owlSVG('happy')}</div>
            <div class="bubble">Wszystkie zdjęcia zrobili prawdziwi fotografowie i podzielili się nimi za darmo w Wikimedia Commons. Dziękujemy! 💚</div>
          </section>
          <div class="info-card">
            <h3>📷 Autorzy zdjęć</h3>
            <ul class="src-list">${ids.map(id => `<li><img src="${src(id)}" alt="" loading="lazy" />
              <span>${ITEM[id] ? ITEM[id].name : NAMES[id] || id} – ${CREDITS[id][0]}, <a href="${CREDITS[id][2]}" target="_blank" rel="noopener">${CREDITS[id][1]}</a></span></li>`).join('')}</ul>
          </div>
          <button class="btn" id="backMapBtn">← Wróć do mapy</button>
        </div>`;
      $('#backMapBtn').addEventListener('click', renderMap);
      window.scrollTo(0, 0);
    }

    /* =====================================================================
       POZIOMY – wspólne
       ===================================================================== */
    let session = null;

    function startLevel(idx, skipTheory) {
      stopGame(); stopSpeak();
      const lvl = LEVELS[idx];
      session = { idx, lvl, mistakes: 0, total: 0, solved: 0, queue: [] };
      document.body.classList.add('in-level');
      const run = () => { stopGame(); stopSpeak(); ({ photo: startQueue, text: startQueue, drop: startDrop, catch: startCatch, pick: startPick, multi: startMulti, order: startOrder, chain: startChain })[lvl.type](); };
      if (THEORY[lvl.id] && !skipTheory) renderTheory(run); else run();
    }

    /* ---------- Teoria krok po kroku ----------
       Pierwszy raz: „Dalej” jest zablokowane, dopóki dziecko nie odwróci
       wszystkich kart i nie minie czas na przeczytanie kroku. */
    function readMs(html) {
      const t = plain(html);
      const words = t.split(/\s+/).filter(Boolean).length, sents = Math.max(1, sentences(t).length);
      return Math.min(30000, Math.max(3000, (words * CONFIG.secPerWord + sents * CONFIG.secPerSentence) * 1000));
    }
    function bindFlips(root, onFlip) {
      root.querySelectorAll('.flip').forEach(f => f.addEventListener('click', () => {
        const first = !f.classList.contains('open');
        f.classList.add('open'); sfx.flip();
        // pytanie z przodu („Jaki pies?”) czytamy razem z odpowiedzią; wyraz z luką („k_yk”, „leka…”) – tylko gotowy wyraz z tyłu
        const front = plain(f.querySelector('.ff').innerHTML), back = plain(f.querySelector('.fb').innerHTML);
        if (state.read && first) speak((/\?/.test(front) ? front + ' ' : '') + back + '.', null, true);
        if (first && onFlip) onFlip();
      }));
    }
    function renderTheory(run) {
      const id = session.lvl.id, th = THEORY[id], n = th.steps.length;
      const seen = !!state.seen[id];
      const passed = new Set();   // kroki już zaliczone w tej wizycie – po powrocie nie blokujemy
      let step = 0;
      const render = () => {
        stopGame(); stopSpeak();
        const last = step === n - 1, free = seen || passed.has(step);
        screen.innerHTML = `
          <section class="level">
            <div class="level-top">
              <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
              <div class="steps no-read">${th.steps.map((_, i) => `<i class="${i === step ? 'on' : i < step ? 'done' : ''}"></i>`).join('')}</div>
              <div class="level-badge">${session.lvl.icon}</div>
            </div>
            <div class="guide"><div class="owl-mini" id="owl">${owlSVG('happy')}</div><div class="bubble" id="bubble">${step === 0 ? `📖 Przypomnij sobie: <b>${th.title}</b>. Obejrzyj każdy krok!` : last ? 'Ostatni krok – i zaczynamy zadania! 💪' : `Krok ${step + 1} z ${n}. Czytamy dalej! 👀`}</div></div>
            <div class="th-card" id="theory"><div class="th-step no-read">Krok ${step + 1} z ${n}</div>${th.steps[step]}</div>
            <div class="theory-actions">
              <button class="btn soft" id="readTh" data-say="#theory">🔊 Przeczytaj mi</button>
              <div class="row2" style="margin-top:12px">
                ${step > 0 ? '<button class="btn soft" id="prevTh">← Wstecz</button>' : ''}
                <button class="btn" id="goTh"><span class="fill"></span><span id="goLbl"></span></button>
              </div>
              ${seen ? '<button class="btn soft" id="skipTh">⏭ Znam to – od razu do zadań</button>' : ''}
            </div>
          </section>`;
        const go = $('#goTh'), lbl = $('#goLbl');
        const card = $('#theory');
        const nFlips = card.querySelectorAll('.flip').length;
        const need = free ? 0 : readMs(card.innerHTML);
        const t0 = Date.now();
        const goText = last ? 'Rozumiem – zaczynamy! →' : 'Dalej →';
        const check = () => {
          const left = card.querySelectorAll('.flip:not(.open)').length;
          const el = Date.now() - t0;
          const ok = free || (left === 0 && el >= need);
          if (ok) {
            if (go.classList.contains('locked') || !go.dataset.ready) { go.classList.remove('locked'); go.classList.add('ready'); go.dataset.ready = '1'; go.disabled = false; lbl.textContent = goText; }
            return true;
          }
          go.classList.add('locked'); go.disabled = true;
          go.style.setProperty('--p', Math.min(100, Math.round(((el / need) * (nFlips ? 0.5 : 1) + (nFlips ? (nFlips - left) / nFlips * 0.5 : 0)) * 100)) + '%');
          lbl.textContent = left ? `👆 Odwróć karty (zostało ${left})` : '⏳ Przeczytaj spokojnie…';
          return false;
        };
        bindFlips(card, check);
        if (!check()) { const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200); timers.push(iv); }
        go.addEventListener('click', () => {
          if (!check()) return;
          sfx.tap(); passed.add(step);
          if (last) { state.seen[id] = true; save(); run(); } else { step++; render(); }
        });
        if ($('#prevTh')) $('#prevTh').addEventListener('click', () => { passed.add(step); step--; render(); });
        if ($('#skipTh')) $('#skipTh').addEventListener('click', run);
        $('#quitBtn').addEventListener('click', renderMap);
        window.scrollTo(0, 0);
        if (state.read) speak(plain(card.innerHTML), $('#readTh'));
      };
      render();
    }
    function openTheory() {
      stopSpeak();
      const th = THEORY[session.lvl.id];
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `<div class="modal-card"><div id="theoryM" style="display:flex;flex-direction:column;gap:12px">${th.steps.map(s => `<div class="th-card">${s}</div>`).join('')}</div>
        <button class="btn soft" data-say="#theoryM">🔊 Przeczytaj mi</button><button class="btn" id="closeTh" style="margin-top:0">Wracam do zadania →</button></div>`;
      m.querySelectorAll('.flip').forEach(f => f.classList.add('open'));
      m.querySelectorAll('.th-hint').forEach(f => f.remove());
      document.body.appendChild(m);
      bindFlips(m);
      const close = () => { stopSpeak(); m.remove(); };
      m.querySelector('#closeTh').addEventListener('click', close);
      m.addEventListener('click', e => { if (e.target === m) close(); });
    }

    function shell(bubble, opts = {}) {
      screen.innerHTML = `
        <section class="level">
          <div class="level-top">
            <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
            ${opts.hearts ? `<div class="hearts" id="hearts"></div><span class="spacer" style="flex:1"></span>` : '<div class="progress"><div class="progress-fill" id="progFill"></div></div>'}
            ${THEORY[session.lvl.id] ? '<button class="icon-btn" id="thBtn" aria-label="Przypomnij sobie teorię" title="Przypomnij sobie">📖</button>' : ''}
            <div class="level-badge">${session.lvl.icon}</div>
          </div>
          ${opts.noGuide ? '' : `<div class="guide"><div class="owl-mini" id="owl">${owlSVG()}</div><div class="bubble" id="bubble">${bubble}</div>${sayMini('#bubble')}</div>`}
          <div class="task" id="task"></div>
        </section>`;
      $('#quitBtn').addEventListener('click', () => {
        if (opts.hearts || confirm('Przerwać zadanie? Gwiazdki dostaniesz, gdy dojdziesz do końca.')) renderMap();
      });
      if ($('#thBtn')) $('#thBtn').addEventListener('click', openTheory);
      window.scrollTo(0, 0);
    }
    function setProgress(frac) { const p = $('#progFill'); if (p) p.style.width = Math.round(frac * 100) + '%'; }

    function starsFor(mistakes, total) {
      const r = total ? mistakes / total : 0;
      return r <= 0.1 ? 3 : r <= 0.3 ? 2 : 1;
    }

    function finishLevel(stars, line) {
      stopGame();
      const prev = state.stars[session.lvl.id] || 0;
      state.stars[session.lvl.id] = Math.max(prev, stars);
      bumpStreak();
      save();
      if (window.Odznaki) Odznaki.sprawdz();
      const tot = totalStars();
      const newReward = REWARDS.find(r => r.at > tot - (state.stars[session.lvl.id] - prev) && r.at <= tot);
      const nextIdx = session.idx + 1 < LEVELS.length ? session.idx + 1 : -1;

      document.body.classList.add('in-level');
      screen.innerHTML = `
        <section class="result">
          <div class="owl-big">${owlSVG(stars >= 2 ? 'happy' : '')}</div>
          <h2>${stars === 3 ? 'Rewelacja!' : stars === 2 ? 'Bardzo dobrze!' : 'Dobra robota!'}</h2>
          <p>${line}</p>
          <div class="result-stars">
            ${[0, 1, 2].map(i => `<span class="rs ${i < stars ? 'on' : ''}" style="--d:${i * 0.15}s">★</span>`).join('')}
          </div>
          ${newReward ? `<div class="reward-pop"><span class="ic">${newReward.icon}</span><span>Sówka dostaje: <b>${newReward.name}</b>!</span></div>` : ''}
          ${stars < 3 ? '<p>Zagraj jeszcze raz po 3 ⭐ i odznakę 🏅</p>' : ''}
          <div class="result-actions">
            ${nextIdx > 0 ? '<button class="btn" id="nextBtn">Dalej: ' + LEVELS[nextIdx].icon + ' ' + LEVELS[nextIdx].name + ' →</button>' : ''}
            <button class="btn soft" id="againBtn">🔁 Jeszcze raz</button>
            <button class="btn soft" id="toMapBtn">🗺️ Mapa</button>
          </div>
        </section>`;
      $('#toMapBtn').addEventListener('click', renderMap);
      $('#againBtn').addEventListener('click', () => startLevel(session.idx, true));
      if (nextIdx > 0) $('#nextBtn').addEventListener('click', () => startLevel(nextIdx));
      sfx.win();
      if (stars >= 2) confetti();
      window.scrollTo(0, 0);
    }

    /* =====================================================================
       KOLEJKA ZADAŃ: zdjęcie → grupa, zdanie z luką, pytanie
       Błędne zadanie wraca raz na koniec kolejki.
       ===================================================================== */
    function startQueue() {
      const lvl = session.lvl;
      if (lvl.boss) {
        session.queue = shuffle([
          ...shuffle(plants).slice(0, 4).map(item => ({ type: 'photo', item })),
          ...shuffle(animals).slice(0, 4).map(item => ({ type: 'photo', item })),
          ...shuffle(PROD_Q).slice(0, 2).map(q => ({ type: 'text', ...q })),
          ...shuffle(FARM_Q).slice(0, 2).map(q => ({ type: 'text', ...q })),
          ...shuffle(CHAIN_Q).slice(0, 2).map(q => ({ type: 'text', ...q }))
        ]);
      } else if (lvl.type === 'photo') session.queue = lvl.pool().map(item => ({ type: 'photo', item }));
      else session.queue = lvl.pool().map(q => ({ type: 'text', ...q }));
      session.total = session.queue.length;
      shell('');
      nextTask();
    }

    function nextTask() {
      if (!session.queue.length) {
        return finishLevel(starsFor(session.mistakes, session.total),
          `Błędów: ${session.mistakes} na ${session.total} ${session.total >= 5 ? 'zadań' : 'zadania'}.`);
      }
      const span = session.span || session.total;
      setProgress(((session.offset || 0) + session.solved) / span);
      const t = session.queue.shift();
      if (t.type === 'photo') renderPhotoTask(t); else renderTextTask(t);
      window.scrollTo(0, 0);
    }

    function answered(t, ok, noteHTML) {
      if (ok) { session.solved++; sfx.good(); }
      else {
        session.mistakes++; sfx.bad();
        if (!t.again) session.queue.push({ ...t, again: true }); else session.solved++;
      }
      const wrap = $('#feedbackWrap');
      wrap.innerHTML = `
        ${ok ? '' : '<div class="feedback-head bad">To zadanie wróci jeszcze na końcu 🔁</div>'}
        <div class="note">💡 ${noteHTML}</div>
        <button class="btn" id="nextQBtn">${session.queue.length ? 'Dalej →' : 'Zobacz wynik →'}</button>`;
      $('#nextQBtn').addEventListener('click', nextTask);
      later(() => $('#nextQBtn')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
    }

    const phHTML = it => it.emoji ? `<div class="emo-ph">${it.emoji}</div>` : `<img src="${src(it.id)}" alt="" />`;
    function groupButtons(keys) {
      return `<div class="layers grp-btns ${keys.length === 3 ? 'three' : ''}" id="opts">${keys.map(g => `
        <button class="layer-btn" data-l="${g}" style="${lc(g)}"><span class="lic">${GROUPS[g].icon}</span>${GROUPS[g].name}<span class="floor">${GROUPS[g].use}</span></button>`).join('')}</div>`;
    }

    function renderPhotoTask(t) {
      const it = t.item, pl = it.kind !== 'zw';
      const keys = pl ? PL_GROUPS : ZW_GROUPS;
      const task = $('#task');
      task.innerHTML = `
        <div class="photo-card">
          ${it.emoji ? `<div class="emo-ph">${it.emoji}</div>` : `<img src="${src(it.id)}" alt="${it.name}" />`}
          <div class="photo-name">${it.name}</div>
          <div class="credit">${credit(it.id)}</div>
        </div>
        <div class="q-line" id="qline">${pl ? `${it.name} – do jakiej grupy roślin należy?` : `${it.name} – co je to zwierzę?`}</div>
        ${groupButtons(keys)}
        <div id="feedbackWrap"></div>`;
      owlSay(pl ? 'Co bierzemy z tej rośliny? 🤔' : 'Czym się żywi to zwierzę? 🤔');
      let done = false;
      task.querySelectorAll('.layer-btn').forEach(btn => btn.addEventListener('click', () => {
        if (done) return; done = true;
        const ok = inGroup(it, btn.dataset.l);
        task.querySelectorAll('.layer-btn').forEach(b => {
          b.disabled = true;
          if (inGroup(it, b.dataset.l)) b.classList.add('ok');
          else if (b === btn) b.classList.add('bad');
          else b.classList.add('dim');
        });
        if (ok) { markFound(it.id); save(); owlSay(pick(PRAISE) + (it.g2 ? ' Len pasuje do dwóch grup!' : ''), 'happy'); }
        else owlSay(`Prawie! ${it.name} – ${it.g2 ? 'rośliny oleiste i włókniste' : GROUPS[it.g].short} 💪`, 'sad');
        answered(t, ok, it.note);
      }));
    }

    function renderTextTask(t) {
      const letters = ['A', 'B', 'C', 'D'];
      const opts = shuffle(t.options);
      const task = $('#task');
      const sentence = t.s ? t.s.replace('___', '<span class="blank" id="blank">&nbsp;?&nbsp;</span>') : t.q;
      task.innerHTML = `
        <div class="q-card">
          ${sayMini('#qtext', '#qopts')}
          <div class="q-num">${t.s ? 'Dokończ zdanie' : 'Pytanie'}</div>
          <div class="q-text" id="qtext">${sentence}</div>
        </div>
        <div class="quiz-opts" id="qopts">
          ${opts.map((o, i) => `<button class="quiz-opt" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}
        </div>
        <div id="feedbackWrap"></div>`;
      owlSay(t.s ? 'Wybierz, jak skończyć zdanie ✏️' : 'Przeczytaj pytanie i wybierz odpowiedź.');
      let done = false;
      task.querySelectorAll('.quiz-opt').forEach(btn => btn.addEventListener('click', () => {
        if (done) return; done = true;
        const ok = opts[+btn.dataset.i] === t.a;
        task.querySelectorAll('.quiz-opt').forEach(b => {
          b.disabled = true;
          if (opts[+b.dataset.i] === t.a) b.classList.add('ok');
          else if (b === btn) b.classList.add('bad');
          else b.classList.add('dim');
        });
        const bl = $('#blank'); if (bl) { bl.textContent = t.a; bl.classList.add('filled'); }
        if (ok) owlSay(pick(PRAISE), 'happy'); else owlSay('Prawie! Zobacz poprawną odpowiedź 💪', 'sad');
        answered(t, ok, t.note);
      }));
    }

    function arcadeIntro(arena, title, text, onStart) {
      const ov = document.createElement('div');
      ov.className = 'arcade-start';
      ov.innerHTML = `<div class="owl-mini" style="width:80px">${owlSVG('happy')}</div><h3>${title}</h3><p>${text}</p>
        <button class="btn" id="goBtn">▶ Start!</button>`;
      arena.appendChild(ov);
      ov.querySelector('#goBtn').addEventListener('click', () => { ov.remove(); sfx.tap(); onStart(); });
    }
    function arcadeLose(arena, line) {
      stopGame(); sfx.lose();
      const ov = document.createElement('div');
      ov.className = 'arcade-start';
      ov.innerHTML = `<div class="owl-mini" style="width:80px">${owlSVG('sad')}</div><h3>Ojej, koniec serduszek!</h3><p>${line}</p>
        <button class="btn" id="againBtn">🔁 Jeszcze raz</button><button class="btn soft" id="mapBtn">🗺️ Mapa</button>`;
      arena.appendChild(ov);
      ov.querySelector('#againBtn').addEventListener('click', () => startLevel(session.idx));
      ov.querySelector('#mapBtn').addEventListener('click', renderMap);
    }
    function drawHearts(h) { $('#hearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < h ? '' : 'lost'}">❤️</span>`).join(''); }
    function floatText(arena, x, y, txt) {
      const f = document.createElement('div');
      f.className = 'float-txt'; f.textContent = txt;
      f.style.left = x + 'px'; f.style.top = y + 'px';
      arena.appendChild(f); setTimeout(() => f.remove(), 900);
    }

    /* =====================================================================
       🎮 SPADAJĄCE PLONY – roślina albo produkt spada z nieba, dotknij
       paska z właściwą grupą, zanim spadnie na ziemię.
       ===================================================================== */
    function startDrop() {
      const GOAL = 15;
      shell('', { hearts: true, noGuide: true });
      const task = $('#task');
      task.innerHTML = `<div class="arena" id="arena">
          ${PL_GROUPS.map((g, i) => `<button class="band" data-l="${g}" style="${lc(g)};top:${i * 25}%;height:25%"><span class="bl">${GROUPS[g].icon} ${GROUPS[g].name}</span></button>`).join('')}
          <div class="score-pill" id="score">0 / ${GOAL}</div>
        </div>`;
      const arena = $('#arena');
      let hearts = 3, score = 0, cur = null, busy = true, deck = [];
      drawHearts(hearts);
      const nextItem = () => { if (!deck.length) deck = shuffle(plantish); return deck.pop(); };

      function spawn() {
        const item = nextItem();
        const el = document.createElement('div');
        el.className = 'faller';
        el.innerHTML = `${phHTML(item)}<span>${item.name}</span>`;
        arena.appendChild(el);
        const W = arena.clientWidth;
        const x = W * 0.55 + Math.random() * (W * 0.45 - 100);
        el.style.left = Math.max(W * 0.45, x) + 'px';
        el.style.top = '-110px';
        cur = { item, el, y: -110, dur: Math.max(3400, 7600 - score * 280) };
        busy = false;
      }
      function resolve(l) {
        if (busy || !cur) return;
        busy = true;
        const { item, el } = cur;
        const H = arena.clientHeight;
        const ok = l && inGroup(item, l);
        const showG = ok ? l : item.g;
        const okBand = arena.querySelector(`.band[data-l="${showG}"]`);
        const target = PL_GROUPS.indexOf(showG) * 0.25 * H + 0.125 * H - 55;
        el.style.top = target + 'px'; el.style.transition = 'top .35s ease, opacity .35s ease';
        okBand.classList.remove('flash-ok'); void okBand.offsetWidth; okBand.classList.add('flash-ok');
        if (ok) {
          score++; if (item.kind === 'pl') markFound(item.id); sfx.good();
          floatText(arena, 20, target + 40, '+1 ⭐');
          $('#score').textContent = `${score} / ${GOAL}`;
        } else {
          hearts--; sfx.bad(); drawHearts(hearts);
          if (l) { const wb = arena.querySelector(`.band[data-l="${l}"]`); wb.classList.remove('flash-bad'); void wb.offsetWidth; wb.classList.add('flash-bad'); }
          floatText(arena, 20, target + 40, `${item.name}: ${GROUPS[item.g].name.toLowerCase()}`);
        }
        later(() => {
          el.style.opacity = '0';
          later(() => {
            el.remove(); cur = null;
            if (hearts <= 0) return arcadeLose(arena, `Udało się ${score} z ${GOAL}. Spróbuj jeszcze raz – za każdym razem idzie lepiej!`);
            if (score >= GOAL) { save(); return finishLevel(hearts, `Wszystkie ${GOAL} plonów trafiło do swojej grupy! Zostało serduszek: ${hearts} ❤️`); }
            spawn();
          }, 300);
        }, ok ? 450 : 1300);
      }
      arena.querySelectorAll('.band').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); resolve(b.dataset.l); }));
      keyHandler = e => { const i = ['1', '2', '3', '4'].indexOf(e.key); if (i >= 0) resolve(PL_GROUPS[i]); };

      arcadeIntro(arena, '🎮 Spadające plony',
        `Rośliny i to, co z nich robimy, spadają z nieba! <b>Dotknij paska z właściwą grupą</b>, zanim spadną na ziemię. Masz 3 ❤️. Zbierz ${GOAL} punktów!<br><small>Na komputerze: klawisze 1–4.</small>`,
        () => {
          spawn();
          gameLoop(dt => {
            if (!cur || busy) return;
            const H = arena.clientHeight;
            cur.y += dt * (H + 110) / cur.dur;
            cur.el.style.top = cur.y + 'px';
            if (cur.y > H - 60) resolve(null);
          });
        });
    }

    /* =====================================================================
       🧺 GŁODNY KOSZYK – łap koszykiem tylko zwierzęta ze wskazanej grupy.
       ===================================================================== */
    function startCatch() {
      const GOAL = 12, PER_TARGET = 3;
      shell('', { hearts: true, noGuide: true });
      const task = $('#task');
      task.innerHTML = `<div class="arena" id="arena">
          <div class="target-pill" id="target"></div>
          <div class="score-pill" id="score">0 / ${GOAL}</div>
          <div class="basket" id="basket">🧺</div>
        </div>`;
      const arena = $('#arena'), basket = $('#basket');
      let hearts = 3, score = 0, falling = [], spawnIn = 600, bx = 0, targets = shuffle(ZW_GROUPS), tIdx = 0, keyDir = 0;
      drawHearts(hearts);
      const target = () => targets[tIdx % targets.length];
      function showTarget() {
        const G = GROUPS[target()];
        const tp = $('#target');
        tp.setAttribute('style', lc(G.id));
        tp.innerHTML = `Łap tylko: ${G.icon} ${G.name.toLowerCase()}`;
      }
      function placeBasket() { basket.style.left = (bx - 50) + 'px'; }
      function moveTo(clientX) {
        const r = arena.getBoundingClientRect();
        bx = Math.max(50, Math.min(r.width - 50, clientX - r.left)); placeBasket();
      }
      arena.addEventListener('pointerdown', e => moveTo(e.clientX));
      arena.addEventListener('pointermove', e => moveTo(e.clientX));
      keyHandler = e => {
        if (e.type !== 'keydown') return;
        if (e.key === 'ArrowLeft') keyDir = -1; else if (e.key === 'ArrowRight') keyDir = 1;
      };
      const keyUp = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keyDir = 0; };
      document.addEventListener('keyup', keyUp);

      function spawn() {
        const W = arena.clientWidth;
        const want = Math.random() < 0.6;
        const pool = animals.filter(i => want ? i.g === target() : i.g !== target());
        const item = pick(pool);
        const el = document.createElement('div');
        el.className = 'faller small';
        el.innerHTML = `<img src="${src(item.id)}" alt="" /><span>${item.name}</span>`;
        arena.appendChild(el);
        const x = 10 + Math.random() * (W - 96 - 20);
        el.style.left = x + 'px'; el.style.top = '-100px';
        falling.push({ item, el, x: x + 48, y: -100, v: 0.075 + Math.min(0.06, score * 0.004) + Math.random() * 0.02 });
      }

      arcadeIntro(arena, '🧺 Głodny koszyk',
        `Przesuwaj koszyk palcem w lewo i w prawo. <b>Łap tylko zwierzęta z grupy, którą pokazuje napis u góry</b> – roślinożerne, mięsożerne albo wszystkożerne. Złapanie innego zwierzęcia zabiera ❤️. Złap ${GOAL}!<br><small>Na komputerze: strzałki ← →.</small>`,
        () => {
          bx = arena.clientWidth / 2; placeBasket(); showTarget();
          gameLoop(dt => {
            const H = arena.clientHeight, W = arena.clientWidth;
            if (keyDir) { bx = Math.max(50, Math.min(W - 50, bx + keyDir * dt * 0.45)); placeBasket(); }
            spawnIn -= dt;
            if (spawnIn <= 0) { spawn(); spawnIn = Math.max(900, 1700 - score * 60); }
            const basketTop = H - 78;
            for (const f of falling.slice()) {
              f.y += f.v * dt;
              f.el.style.top = f.y + 'px';
              const caught = f.y + 70 >= basketTop && f.y + 70 <= basketTop + 40 && Math.abs(f.x - bx) < 52;
              if (caught || f.y > H) {
                falling.splice(falling.indexOf(f), 1);
                f.el.remove();
                if (!caught) continue;
                if (f.item.g === target()) {
                  score++; markFound(f.item.id); sfx.good();
                  floatText(arena, bx - 20, basketTop - 30, '+1 ⭐');
                  $('#score').textContent = `${score} / ${GOAL}`;
                  if (score >= GOAL) { document.removeEventListener('keyup', keyUp); save(); finishLevel(hearts, `Złapano ${GOAL} zwierząt z właściwych grup! Zostało serduszek: ${hearts} ❤️`); return false; }
                  if (score % PER_TARGET === 0) {
                    tIdx++; showTarget();
                    falling.forEach(o => o.el.remove()); falling = []; spawnIn = 900;
                    floatText(arena, 20, 60, `Teraz: ${GROUPS[target()].name.toLowerCase()}!`);
                  }
                } else {
                  hearts--; sfx.bad(); drawHearts(hearts);
                  floatText(arena, Math.max(10, bx - 90), basketTop - 40, `${f.item.name}: ${GROUPS[f.item.g].name.toLowerCase()}`);
                  if (hearts <= 0) { document.removeEventListener('keyup', keyUp); arcadeLose(arena, `Złapano ${score} z ${GOAL}. Patrz na napis u góry – podpowiada, którą grupę łapiemy!`); return false; }
                }
              }
            }
          });
        });
    }

    /* =====================================================================
       🔍 ZNAJDŹ WSZYSTKIE – dotknij wszystkich zdjęć z danej grupy
       ===================================================================== */
    function startPick() {
      const rounds = shuffle(['ro', 'mi', 'ws', 'zb', 'ok']).map(g => {
        const pool = GROUPS[g].kind === 'zw' ? animals : plantish;
        const good = shuffle(pool.filter(i => inGroup(i, g))).slice(0, 4);
        const bad = shuffle(pool.filter(i => !inGroup(i, g))).slice(0, 9 - good.length);
        return { g, good, tiles: shuffle([...good, ...bad]) };
      });
      session.total = rounds.reduce((s, r) => s + r.good.length, 0);
      let ri = 0;
      shell('');
      const render = () => {
        const R = rounds[ri], G = GROUPS[R.g];
        setProgress(ri / rounds.length);
        let got = 0, done = false;
        const task = $('#task');
        task.innerHTML = `
          <div class="target-bar">Znajdź wszystkie: <span class="layer-chip" style="${lc(R.g)}">${G.icon} ${G.short}</span></div>
          <div class="grid3">${R.tiles.map(i => `<button class="tile" data-id="${i.id}">${phHTML(i)}<span>${i.name}</span></button>`).join('')}</div>
          <div class="found-count" id="cnt">Znaleziono: 0 z ${R.good.length}</div>
          <div id="feedbackWrap"></div>`;
        owlSay(G.kind === 'zw' ? `Dotknij <b>wszystkich</b> zwierząt, które są ${G.name.toLowerCase()} 🔍` : `Dotknij <b>wszystkiego</b>, co należy do grupy: ${G.short} – roślin i produktów 🔍`);
        task.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => {
          if (done || b.classList.contains('ok') || b.classList.contains('bad')) return;
          const it = ITEM[b.dataset.id];
          if (inGroup(it, R.g)) {
            b.classList.add('ok'); got++; if (it.kind !== 'pr') markFound(it.id); sfx.good();
            $('#cnt').textContent = `Znaleziono: ${got} z ${R.good.length}`;
            if (got === R.good.length) {
              done = true; save();
              owlSay(pick(PRAISE) + ' Wszystko znalezione!', 'happy');
              $('#feedbackWrap').innerHTML = `<button class="btn" id="nextR">${ri < rounds.length - 1 ? 'Następna grupa →' : 'Zobacz wynik →'}</button>`;
              $('#nextR').addEventListener('click', () => { if (++ri < rounds.length) render(); else finishLevel(starsFor(session.mistakes, session.total), `Pomyłek: ${session.mistakes}. Wszystko trafiło do swoich grup!`); });
              later(() => $('#nextR')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
            } else owlSay(`Tak! ${it.name} ✅ Szukaj dalej…`, 'happy');
          } else {
            b.classList.add('bad'); session.mistakes++; sfx.bad();
            owlSay(`Ojej, ${lowerFirst(it.name)} to ${GROUPS[it.g].short}. Szukaj dalej! 💪`, 'sad');
          }
        }));
        window.scrollTo(0, 0);
      };
      render();
    }

    /* =====================================================================
       🥔 CO MOŻNA ZROBIĆ? – wybierz wszystko, co pasuje
       ===================================================================== */
    function startMulti() {
      session.total = MULTI.reduce((s, r) => s + r.good.length, 0);
      let ri = 0;
      shell('');
      const render = () => {
        const R = MULTI[ri];
        setProgress(ri / MULTI.length);
        const tiles = shuffle([...R.good.map(g => [...g, true]), ...R.bad.map(b => [...b, false])]);
        let got = 0, done = false;
        const task = $('#task');
        task.innerHTML = `
          <div class="q-card">${sayMini('#qtext')}<div class="q-num">Runda ${ri + 1} z ${MULTI.length}</div><div class="q-text" id="qtext">${R.q}</div></div>
          <div class="grid2">${tiles.map((t, i) => `<button class="etile" data-i="${i}"><b>${t[0]}</b>${t[1]}</button>`).join('')}</div>
          <div class="found-count" id="cnt">Znaleziono: 0 z ${R.good.length}</div>
          <div id="feedbackWrap"></div>`;
        owlSay(ri === 0 ? 'Pokaż, co dają nam rośliny z pola! 🌾' : 'Dotknij wszystkich dobrych odpowiedzi.');
        task.querySelectorAll('.etile').forEach(b => b.addEventListener('click', () => {
          if (done || b.classList.contains('ok') || b.classList.contains('bad')) return;
          const t = tiles[+b.dataset.i];
          if (t[2]) {
            b.classList.add('ok'); got++; sfx.good();
            $('#cnt').textContent = `Znaleziono: ${got} z ${R.good.length}`;
            if (got === R.good.length) {
              done = true;
              owlSay(pick(PRAISE), 'happy');
              $('#feedbackWrap').innerHTML = `<div class="note">💡 ${R.note}</div>
                <button class="btn" id="nextR">${ri < MULTI.length - 1 ? 'Dalej →' : 'Zobacz wynik →'}</button>`;
              $('#nextR').addEventListener('click', () => { if (++ri < MULTI.length) render(); else finishLevel(starsFor(session.mistakes, session.total), `Pomyłek: ${session.mistakes}. Wiesz już, co dają nam rośliny! 🌾`); });
              later(() => $('#nextR')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
            } else owlSay('Tak! ✅ Co jeszcze?', 'happy');
          } else {
            b.classList.add('bad'); session.mistakes++; sfx.bad();
            owlSay('Hmm, tego z tej rośliny nie zrobimy 🙂 Szukaj dalej!', 'sad');
          }
        }));
        window.scrollTo(0, 0);
      };
      render();
    }

    /* =====================================================================
       🥖 HISTORIA CHLEBA – ułóż kroki po kolei (najpierw, potem, następnie,
       w końcu), a potem posłuchaj całej opowieści.
       ===================================================================== */
    function startOrder() {
      session.total = STORIES.reduce((s, st) => s + st.steps.length, 0);
      let ri = 0;
      shell('');
      const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
      const render = () => {
        const st = STORIES[ri], n = st.steps.length;
        setProgress(ri / STORIES.length);
        let nextI = 0, done = false, wrongHere = 0;
        const order = shuffle(st.steps.map((_, i) => i));
        const task = $('#task');
        task.innerHTML = `
          <div class="q-card"><div class="q-num">Historia ${ri + 1} z ${STORIES.length}</div><div class="q-text">${st.title}</div></div>
          <div class="slots" id="slots">${st.steps.map((s, i) => `<div class="slot ${i === 0 ? 'next' : ''}" data-i="${i}"><span class="cn">${st.conn[i]}</span><span class="sl-txt">…</span></div>`).join('')}</div>
          <div class="th-hint">👇 Dotknij kroku, który jest teraz</div>
          <div class="scards" id="scards">${order.map(i => { const s = st.steps[i]; return `<button class="scard" data-i="${i}">${s[0] ? `<img src="${src(s[0])}" alt="" />` : `<div class="semo">${s[1]}</div>`}<span>${cap(s[2])}</span></button>`; }).join('')}</div>
          <div id="feedbackWrap"></div>`;
        owlSay(`Ułóż historię po kolei. Co jest <b>${st.conn[0].toLowerCase()}</b>? 🤔`);
        task.querySelectorAll('.scard').forEach(b => b.addEventListener('click', () => {
          if (done || b.classList.contains('used')) return;
          const i = +b.dataset.i;
          if (i === nextI) {
            const s = st.steps[i], slot = task.querySelector(`.slot[data-i="${i}"]`);
            slot.classList.remove('next'); slot.classList.add('filled');
            slot.querySelector('.sl-txt').outerHTML = `${s[0] ? `<img class="mini" src="${src(s[0])}" alt="" />` : `<span class="memo">${s[1]}</span>`}<span>${s[2]}</span>`;
            b.classList.add('used'); sfx.good(); nextI++;
            if (nextI < n) {
              task.querySelector(`.slot[data-i="${nextI}"]`).classList.add('next');
              owlSay(`Tak! ✅ A co dzieje się <b>${st.conn[nextI].toLowerCase()}</b>?`, 'happy');
            } else {
              done = true;
              session.solved += n;
              $('#scards').remove(); task.querySelector('.th-hint').remove();
              owlSay(pick(PRAISE) + ' Cała historia ułożona!', 'happy');
              const story = st.steps.map((s, k) => `<b>${st.conn[k]}</b> ${s[2]}`).join(' ');
              $('#feedbackWrap').innerHTML = `
                <div class="note" id="storyTxt">📖 ${story}</div>
                <button class="btn soft" data-say="#storyTxt">🔊 Opowiedz mi całą historię</button>
                <button class="btn" id="nextR">${ri < STORIES.length - 1 ? 'Następna historia →' : 'Zobacz wynik →'}</button>`;
              $('#nextR').addEventListener('click', () => { if (++ri < STORIES.length) render(); else finishLevel(starsFor(session.mistakes, session.total), `Pomyłek: ${session.mistakes}. Umiesz opowiedzieć, skąd jest chleb! 🍞`); });
              later(() => $('#nextR')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
            }
          } else {
            session.mistakes++; wrongHere++; sfx.bad();
            b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
            const good = st.steps[nextI];
            owlSay(wrongHere >= 2 ? `Podpowiedź: ${st.conn[nextI].toLowerCase()} ${good[2]} ${good[1]}` : `Hmm, to jeszcze nie teraz. Pomyśl, co musi być <b>${st.conn[nextI].toLowerCase()}</b> 💪`, 'sad');
          }
        }));
        window.scrollTo(0, 0);
      };
      render();
    }

    /* =====================================================================
       🔗 ŁAŃCUCHY POKARMOWE – uzupełnij brakujące ogniwa łańcucha,
       potem kilka pytań (producenci, destruenci, równowaga).
       ===================================================================== */
    function chainOptions(id, chainIds) {
      // fałszywe odpowiedzi z innej „roli”, żeby nie było dwóch dobrych odpowiedzi
      const it = ITEM[id];
      const carn = animals.filter(a => a.g === 'mi').map(a => [a.id, a.name]);
      const herb = animals.filter(a => a.g === 'ro').map(a => [a.id, a.name]);
      const pool = !it || it.kind !== 'zw' ? carn : it.g === 'mi' ? [...FOOD_PLANTS, ...herb] : [...FOOD_PLANTS, ...carn];
      return shuffle(pool.filter(p => !chainIds.includes(p[0]))).slice(0, 3);
    }
    function startChain() {
      const rounds = CHAINS;
      const holes = rounds.reduce((s, c) => s + c.hide.length, 0);
      session.total = holes + CHAIN_Q.length;
      let ri = 0;
      shell('');
      const render = () => {
        const C = rounds[ri];
        const known = new Set(C.links.map((_, i) => i).filter(i => !C.hide.includes(i)));
        let hi = 0, wrongHere = 0;
        const draw = () => {
          setProgress(ri / (rounds.length + 1));
          const holeIdx = C.hide[hi];
          const task = $('#task');
          task.innerHTML = `
            <div class="q-card">${sayMini('#qtext')}<div class="q-num">Łańcuch ${ri + 1} z ${rounds.length}</div><div class="q-text" id="qtext">${holeIdx === undefined ? 'Łańcuch gotowy! 🎉' : holeIdx === 0 ? `Co zjada <b>${C.links[1][1].toLowerCase()}</b>?` : `Kto zjada <b>${ACC[C.links[holeIdx - 1][1]]}</b>?`}</div></div>
            <div class="chain">${C.links.map(([id, n], i) => {
              const show = known.has(i);
              return `${i ? '<span class="arr">→</span>' : ''}<div class="link" style="--lc:${show ? roleColor(id) : '#94a3b8'}"><div class="ph ${show ? '' : 'q'} ${i === holeIdx ? 'now' : ''}">${show ? `<img src="${src(id)}" alt="" />` : '?'}</div><span>${show ? n : '…'}</span>${show ? `<small>${roleName(id)}</small>` : ''}</div>`;
            }).join('')}</div>
            <div class="grid2" id="copts"></div>
            <div id="feedbackWrap"></div>`;
          if (holeIdx === undefined) {
            owlSay(pick(PRAISE) + ' Przeczytaj łańcuch od początku: ' + C.links.map(l => l[1].toLowerCase()).join(' → '), 'happy');
            $('#copts').remove();
            $('#feedbackWrap').innerHTML = `<div class="note">💡 ${C.links.map(l => l[1]).join(' → ')}. ${C.note}</div><button class="btn" id="nextR">${ri < rounds.length - 1 ? 'Następny łańcuch →' : 'Jeszcze kilka pytań →'}</button>`;
            $('#nextR').addEventListener('click', () => {
              if (++ri < rounds.length) render();
              else {
                session.queue = shuffle(CHAIN_Q).map(q => ({ type: 'text', ...q }));
                session.offset = holes; session.span = session.total; session.solved = holes;
                nextTask();
              }
            });
            later(() => $('#nextR')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
            return;
          }
          const [gid, gname] = C.links[holeIdx];
          const opts = shuffle([[gid, gname], ...chainOptions(gid, C.links.map(l => l[0]))]);
          owlSay(holeIdx === 0 ? 'Na początku łańcucha jest zwykle roślina 🌱' : 'Wybierz brakujące ogniwo 🔗');
          $('#copts').innerHTML = opts.map(([id, n]) => `<button class="tile" data-id="${id}" style="aspect-ratio:1/0.95"><img src="${src(id)}" alt="" /><span>${n}</span></button>`).join('');
          $('#copts').querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => {
            if (b.classList.contains('bad')) return;
            if (b.dataset.id === gid) {
              sfx.good(); b.classList.add('ok'); known.add(holeIdx); hi++; wrongHere = 0;
              if (ITEM[gid] && ITEM[gid].kind !== 'pr') { markFound(gid); save(); }
              later(draw, 450);
            } else {
              session.mistakes++; wrongHere++; sfx.bad(); b.classList.add('bad');
              const it = ITEM[b.dataset.id];
              const nm = b.querySelector('span').textContent;
              owlSay(!it || it.kind !== 'zw' ? `${nm} to roślina – rośliny nikogo nie zjadają 🌱 Spróbuj jeszcze raz!` : holeIdx === 0 ? `${nm} to zwierzę, a łańcuch zaczyna się od rośliny 🌱 Spróbuj jeszcze raz!` : it.g === 'ro' ? `${nm} to zwierzę roślinożerne – je tylko rośliny. Spróbuj jeszcze raz!` : `${nm} to zwierzę mięsożerne – je mięso, a nie rośliny. Spróbuj jeszcze raz!`, 'sad');
            }
          }));
          window.scrollTo(0, 0);
        };
        draw();
      };
      render();
    }

    renderMap();
  </script>
</body>
