<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15803d" />
  <title>Rośliny i zwierzęta – przyroda z Sówką Lulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #14321f;
      --muted: #5f7466;
      --primary: #16a34a;
      --primary-dark: #166534;
      --primary-soft: #dcfce7;
      --line: #bbf7d0;
      --good: #16a34a;
      --good-soft: #dcfce7;
      --bad: #dc2626;
      --bad-soft: #fee2e2;
      --gold: #facc15;
      /* kolory warstw jak w podręczniku */
      --k: #16a34a;
      --p: #eab308;
      --r: #ea580c;
      --s: #d6a06a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Nunito', system-ui, 'Segoe UI', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(134, 239, 172, 0.55), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(253, 224, 71, 0.35), transparent 35%),
        linear-gradient(180deg, #f0fdf4 0%, #ecfccb 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
    button:disabled { cursor: default; }
    img { -webkit-user-drag: none; user-select: none; }

    #app {
      max-width: 560px; margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }

    /* ---------- Górny pasek ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: rgba(240, 253, 244, 0.88);
      backdrop-filter: blur(10px);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 42px; padding: 8px 14px;
      border-radius: 999px; border: 2px solid var(--line);
      background: #fff; font-weight: 900; font-size: 1rem;
      text-decoration: none; color: var(--ink);
    }
    .pill.back { color: var(--primary-dark); }
    .topbar .spacer { flex: 1; }
    .topbar .pill { white-space: nowrap; }
    @media (max-width: 420px) { .topbar { gap: 4px; padding: 10px 8px; } .topbar .pill { padding: 6px 8px; font-size: 0.92rem; min-height: 40px; gap: 4px; } }
    body.in-level .topbar { display: none; }

    main { flex: 1; display: flex; flex-direction: column; padding: 0 16px 24px; }
    body.in-level main { padding-bottom: 0; }

    /* ---------- Sowa ---------- */
    .owl-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .owl-big { width: 130px; flex: none; animation: bob 3s ease-in-out infinite; }
    .owl-mini { width: 56px; flex: none; }
    .jump { animation: jump 0.6s ease; }
    .shake { animation: shake 0.45s ease; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

    .bubble {
      position: relative; flex: 1;
      background: #fff; border: 2px solid var(--line);
      border-radius: 20px; padding: 10px 14px;
      font-weight: 700; line-height: 1.4; font-size: 1rem;
      box-shadow: 0 8px 20px rgba(22, 101, 52, 0.1);
    }
    .bubble::before {
      content: ''; position: absolute; left: -10px; top: 18px;
      border: 9px solid transparent; border-right-color: var(--line); border-left: 0;
    }
    .bubble::after {
      content: ''; position: absolute; left: -7px; top: 19px;
      border: 8px solid transparent; border-right-color: #fff; border-left: 0;
    }
    .pop { animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(0.94); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }

    /* ---------- Mapa ---------- */
    .hero { display: flex; align-items: center; gap: 14px; margin: 8px 0 14px; }
    .reward-bar {
      background: #fff; border: 2px solid var(--line); border-radius: 20px;
      padding: 12px 14px; font-weight: 800; font-size: 0.95rem;
    }
    .bar { height: 12px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #4ade80, var(--primary)); border-radius: 999px; transition: width 0.6s ease; }
    .section-title { font-size: 1.3rem; font-weight: 900; margin: 24px 0 10px; }
    .muted { color: var(--muted); font-weight: 700; margin: -4px 0 12px; font-size: 0.95rem; }

    .path { display: flex; flex-direction: column; align-items: flex-start; }
    .path-dots { width: 4px; height: 18px; margin: 2px 0 2px 40px; border-left: 4px dotted #86efac; }
    .node {
      position: relative;
      width: 84%; margin-left: calc(var(--off) * 8%);
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; text-align: left;
      background: #fff; border: 3px solid var(--line); border-radius: 22px;
      box-shadow: 0 6px 0 #bbf7d0;
      transition: transform 0.12s ease;
    }
    .node:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #bbf7d0; }
    .node-icon {
      width: 52px; height: 52px; flex: none; border-radius: 50%;
      display: grid; place-items: center; font-size: 1.5rem; font-weight: 900;
      background: var(--primary-soft);
    }
    .node-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .node-num { font-size: 0.75rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
    .node-name { font-size: 1.05rem; font-weight: 900; }
    .node-desc { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .node-stars { font-size: 1.1rem; color: var(--gold); letter-spacing: -1px; flex: none; text-shadow: 0 1px 0 #ca8a04; }
    .node-stars .off { color: #e5e7eb; text-shadow: none; }
    .node.done { border-color: #86efac; }
    .node.current { border-color: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); animation: glow 1.8s ease-in-out infinite; }
    .node.current .node-icon { background: var(--primary); color: #fff; }
    .node.locked { opacity: 0.55; background: #f8fafc; box-shadow: 0 6px 0 #e5e7eb; border-color: #e5e7eb; }
    .node.locked .node-icon { background: #e5e7eb; }
    .node.arcade .node-num { color: #c2410c; }
    @keyframes glow { 0%, 100% { outline: 0 solid rgba(22, 163, 74, 0.25); } 50% { outline: 7px solid rgba(22, 163, 74, 0.15); } }
    .here {
      position: absolute; right: 10px; top: -13px;
      background: var(--gold); color: var(--ink); font-size: 0.75rem; font-weight: 900;
      padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 0 #ca8a04;
    }

    /* album znalezisk */
    .album {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px;
      background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 12px;
    }
    .album-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .album-item .ph {
      width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
      border: 3px solid var(--lc, var(--line)); background: #f1f5f9;
      display: grid; place-items: center; font-size: 1.3rem; color: #94a3b8; font-weight: 900;
    }
    .album-item .ph img { width: 100%; height: 100%; object-fit: cover; }
    .album-item span { font-size: 0.62rem; font-weight: 800; color: var(--muted); text-align: center; line-height: 1.15; }
    .album-item.locked .ph { border-color: #e5e7eb; }

    .info-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 52px; padding: 10px 16px; margin-top: 14px;
      border-radius: 18px; border: 3px solid var(--line); background: #fff;
      font-size: 1.02rem; font-weight: 900; color: var(--primary-dark);
      box-shadow: 0 5px 0 var(--line);
    }
    .info-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }

    /* ---------- Przyciski ---------- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 58px; padding: 12px 18px;
      border: 0; border-radius: 18px;
      font-size: 1.2rem; font-weight: 900;
      background: var(--primary); color: #fff;
      box-shadow: 0 5px 0 var(--primary-dark);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
    .btn.soft { background: #fff; color: var(--primary-dark); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
    .btn + .btn { margin-top: 12px; }
    .link-btn.danger { background: none; border: 0; color: #9ca3af; margin: 28px auto 0; display: block; font-size: 0.85rem; font-weight: 800; text-decoration: underline; padding: 8px; }

    /* ---------- Poziom ---------- */
    .level { flex: 1; display: flex; flex-direction: column; }
    .level-top { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
    .icon-btn {
      width: 44px; height: 44px; flex: none; border-radius: 50%;
      border: 2px solid var(--line); background: #fff; font-size: 1.2rem; font-weight: 900; color: var(--muted);
    }
    .progress { flex: 1; height: 16px; background: #fff; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4ade80, #16a34a); border-radius: 999px; transition: width 0.4s ease; }
    .level-badge { font-size: 1.5rem; font-weight: 900; }
    .hearts { font-size: 1.2rem; letter-spacing: 1px; white-space: nowrap; }
    .hearts .lost { filter: grayscale(1); opacity: 0.3; }
    .guide { display: flex; align-items: flex-start; gap: 10px; margin: 2px 0 10px; }
    .task { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

    /* zdjęcie w zadaniu */
    .photo-card {
      position: relative; background: #fff; border: 3px solid var(--line); border-radius: 24px;
      overflow: hidden; box-shadow: 0 8px 20px rgba(22, 101, 52, 0.12);
    }
    .photo-card img { display: block; width: 100%; height: min(34vh, 250px); object-fit: cover; }
    .photo-name {
      position: absolute; left: 12px; bottom: 30px;
      background: rgba(255, 255, 255, 0.95); padding: 6px 14px; border-radius: 999px;
      font-size: 1.25rem; font-weight: 900; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }
    .credit { font-size: 0.62rem; font-weight: 700; color: var(--muted); padding: 5px 10px; line-height: 1.2; }
    .photo-card .credit { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.88); }
    .q-line { font-size: 1.15rem; font-weight: 900; text-align: center; line-height: 1.35; }

    /* przyciski warstw – ułożone jak piętra lasu */
    .layers { display: flex; flex-direction: column; gap: 8px; }
    .layer-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 54px; padding: 8px 14px; text-align: left;
      border-radius: 18px; border: 3px solid var(--lc); background: #fff;
      font-size: 1.1rem; font-weight: 900;
      box-shadow: 0 5px 0 var(--lc);
    }
    .layer-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--lc); }
    .layer-btn .lic {
      flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
      font-size: 1.3rem; background: var(--lc);
    }
    .layer-btn .floor { margin-left: auto; font-size: 0.75rem; color: var(--muted); font-weight: 800; }
    .layer-btn.ok { background: var(--good-soft); border-color: var(--good); box-shadow: 0 5px 0 var(--good); }
    .layer-btn.bad { background: var(--bad-soft); border-color: #fca5a5; box-shadow: none; opacity: 0.85; }
    .layer-btn.dim { opacity: 0.45; }

    /* pytania tekstowe */
    .q-card {
      background: #fff; border: 3px solid var(--line); border-radius: 24px;
      padding: 18px; text-align: center;
    }
    .q-num { font-size: 0.82rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .q-text { font-size: 1.2rem; font-weight: 900; line-height: 1.45; }
    .blank {
      display: inline-block; min-width: 90px; border-bottom: 3px dashed var(--primary);
      color: var(--primary-dark); padding: 0 4px;
    }
    .blank.filled { border-bottom-style: solid; background: var(--good-soft); border-radius: 6px 6px 0 0; }
    .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
    .quiz-opt {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 56px; padding: 10px 16px; text-align: left;
      border-radius: 18px; border: 3px solid var(--line); background: #fff;
      font-size: 1.02rem; font-weight: 800; line-height: 1.35;
      box-shadow: 0 5px 0 var(--line);
    }
    .quiz-opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
    .quiz-opt .letter {
      flex: none; width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center; font-size: 0.9rem; font-weight: 900;
      background: var(--primary-soft); color: var(--primary-dark);
    }
    .quiz-opt.ok { background: var(--good-soft); border-color: var(--good); box-shadow: 0 5px 0 var(--good); }
    .quiz-opt.ok .letter { background: var(--good); color: #fff; }
    .quiz-opt.bad { background: var(--bad-soft); border-color: #fca5a5; box-shadow: none; opacity: 0.8; }
    .quiz-opt.bad .letter { background: #fca5a5; color: #fff; }
    .quiz-opt.dim { opacity: 0.5; }
    .note {
      text-align: left; background: #fef9c3; border: 2px solid #fde68a; border-radius: 16px;
      padding: 10px 12px; font-weight: 700; line-height: 1.45; font-size: 0.95rem;
    }
    .feedback-head { font-weight: 900; text-align: center; font-size: 1.05rem; }
    .feedback-head.ok { color: #166534; }
    .feedback-head.bad { color: #b91c1c; }

    /* ---------- Poznaj warstwy ---------- */
    .tower { display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 8px 20px rgba(22, 101, 52, 0.15); }
    .tower-floor {
      position: relative; display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 10px 14px;
      color: #fff; font-weight: 900; font-size: 1.15rem; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
      background-size: cover; background-position: center;
    }
    .tower-floor::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--lc) 0%, rgba(0, 0, 0, 0.05) 85%); opacity: 0.85; }
    .tower-floor > * { position: relative; }
    .tower-floor .tic { font-size: 1.8rem; }
    .tower-floor small { display: block; font-size: 0.78rem; font-weight: 800; opacity: 0.95; }
    .tower-floor .sun { margin-left: auto; font-size: 0.85rem; }

    .layer-card { background: #fff; border: 3px solid var(--lc); border-radius: 24px; overflow: hidden; }
    .layer-card > img { display: block; width: 100%; height: min(28vh, 210px); object-fit: cover; }
    .layer-card .lc-body { padding: 12px 14px 14px; }
    .layer-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
      background: var(--lc); color: #fff; font-weight: 900; font-size: 1.05rem; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .layer-card p { margin: 10px 0 0; font-weight: 700; line-height: 1.5; color: #334155; }
    .mini-title { font-weight: 900; font-size: 0.9rem; margin: 12px 0 6px; color: var(--muted); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .chip-ph { flex: none; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .chip-ph img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid var(--lc); }
    .chip-ph span { font-size: 0.7rem; font-weight: 800; text-align: center; line-height: 1.15; }
    .dots { display: flex; justify-content: center; gap: 6px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #d1fae5; }
    .dots i.on { background: var(--primary); }

    /* ---------- Znajdź wszystkie (siatka zdjęć) ---------- */
    .target-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
      font-weight: 900; font-size: 1.05rem; text-align: center;
    }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile {
      position: relative; padding: 0; border: 3px solid #fff; border-radius: 18px; overflow: hidden; background: #fff;
      box-shadow: 0 4px 0 #d1fae5; aspect-ratio: 1 / 1.12; display: flex; flex-direction: column;
    }
    .tile img { width: 100%; flex: 1; min-height: 0; object-fit: cover; display: block; }
    .tile span { font-size: 0.78rem; font-weight: 900; padding: 4px 2px; line-height: 1.1; }
    .tile.ok { border-color: var(--good); }
    .tile.ok::after { content: '✓'; position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: #fff; font-weight: 900; display: grid; place-items: center; }
    .tile.bad { border-color: var(--bad); opacity: 0.6; }
    .tile.bad::after { content: '✕'; position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--bad); color: #fff; font-weight: 900; display: grid; place-items: center; }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .etile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 92px; padding: 8px; border-radius: 18px; border: 3px solid var(--line); background: #fff;
      font-weight: 800; font-size: 0.92rem; line-height: 1.25; text-align: center; box-shadow: 0 4px 0 var(--line);
    }
    .etile b { font-size: 1.9rem; line-height: 1; }
    .etile.ok { background: var(--good-soft); border-color: var(--good); box-shadow: 0 4px 0 var(--good); }
    .etile.bad { background: var(--bad-soft); border-color: #fca5a5; box-shadow: none; opacity: 0.7; }
    .found-count { text-align: center; font-weight: 900; color: var(--muted); }

    /* ---------- Czytanie i teoria ---------- */
    .say-mini {
      flex: none; width: 42px; height: 42px; border-radius: 50%; align-self: center;
      border: 2px solid var(--line); background: #fff; font-size: 1.15rem; display: grid; place-items: center; padding: 0;
    }
    .say-mini.on, .btn.on { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4); } 50% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0.12); } }
    .q-card { position: relative; }
    .q-card .say-mini { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; font-size: 1rem; }
    .theory { display: flex; flex-direction: column; gap: 10px; }
    .th-title { margin: 0; font-size: 1.35rem; font-weight: 900; }
    .th-p { margin: 0; font-weight: 700; line-height: 1.55; font-size: 1.04rem; color: #1f2937; }
    .th-row { background: #fff; border-radius: 18px; border: 2px solid var(--line); border-left: 8px solid var(--lc, var(--primary)); padding: 10px 12px; }
    .th-row h3 { margin: 0 0 4px; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
    .th-row p { margin: 0; font-weight: 700; line-height: 1.5; color: #334155; }
    .th-row .chips { margin-top: 8px; }
    .th-tip { background: #fef9c3; border: 2px solid #fde68a; border-radius: 18px; padding: 10px 12px; font-weight: 800; line-height: 1.5; }
    .th-img { width: 100%; max-height: 220px; object-fit: contain; background: #fff; border-radius: 18px; border: 2px solid var(--line); display: block; }
    .theory-actions { padding: 14px 0 calc(16px + env(safe-area-inset-bottom)); }
    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(20, 50, 31, 0.55); display: flex; align-items: flex-end; justify-content: center; }
    .modal-card {
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #f0fdf4;
      border-radius: 26px 26px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ---------- Pokoloruj tabelkę ---------- */
    .crayons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .crayon {
      display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px;
      border-radius: 16px; border: 3px solid var(--line); background: #fff; font-weight: 900; font-size: 1rem; text-align: left;
    }
    .crayon i { flex: none; width: 34px; height: 34px; border-radius: 50% 40% 55% 45%; background: var(--cc); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.15); }
    .crayon.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--cc); transform: scale(1.03); }
    .ctable { display: grid; grid-template-columns: repeat(4, 1fr); border: 3px solid #6b9bd1; border-radius: 12px; overflow: hidden; background: #fff; }
    @media (max-width: 400px) { .ctable { grid-template-columns: repeat(3, 1fr); } }
    .cell {
      position: relative; min-height: 76px; padding: 6px 2px; border: 1px solid #93c5fd; border-radius: 0; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-size: 0.95rem; font-weight: 900; transition: background 0.2s ease;
    }
    .cell img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
    .cell.dark { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
    .cell.wrong::after { content: '✕'; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 0.8rem; display: grid; place-items: center; text-shadow: none; }
    .cell.right::after { content: '✓'; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; font-size: 0.8rem; display: grid; place-items: center; text-shadow: none; }
    .leaf-card { background: #fff; border: 3px solid var(--line); border-radius: 24px; overflow: hidden; }
    .leaf-card img { display: block; width: 100%; max-height: 300px; object-fit: contain; background: #fff; }
    .leaf-card .lc-body { padding: 12px 14px; font-weight: 700; line-height: 1.6; font-size: 1.05rem; }

    /* ---------- Gry zręcznościowe ---------- */
    .arena {
      position: relative; flex: 1; min-height: 380px; border-radius: 24px; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none;
      background: #14532d url('zdjecia/las.jpg') center / cover;
      margin-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    .band {
      position: absolute; left: 0; right: 0; display: flex; align-items: center; padding: 0 12px;
      border: 0; color: #fff; font-weight: 900; font-size: 1rem; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      background: linear-gradient(90deg, var(--lc), transparent 70%); opacity: 0.92;
      border-top: 2px dashed rgba(255, 255, 255, 0.5);
    }
    .band:first-child { border-top: 0; }
    .band .bl { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.25); padding: 4px 10px; border-radius: 999px; }
    .band.flash-ok { animation: flashOk 0.7s ease; }
    .band.flash-bad { animation: flashBad 0.7s ease; }
    @keyframes flashOk { 0%, 100% { box-shadow: inset 0 0 0 0 #4ade80; } 40% { box-shadow: inset 0 0 0 6px #4ade80; background: rgba(74, 222, 128, 0.55); } }
    @keyframes flashBad { 0%, 100% { box-shadow: inset 0 0 0 0 #f87171; } 40% { box-shadow: inset 0 0 0 6px #f87171; background: rgba(248, 113, 113, 0.55); } }
    .faller {
      position: absolute; width: 96px; display: flex; flex-direction: column; align-items: center; pointer-events: none;
      transition: transform 0.35s ease, opacity 0.35s ease; z-index: 3;
    }
    .faller img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35); }
    .faller span { margin-top: 3px; background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 0.85rem; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
    .faller.small img { width: 64px; height: 64px; border-width: 3px; }
    .faller.small span { font-size: 0.72rem; }
    .score-pill {
      position: absolute; top: 10px; right: 10px; z-index: 4; background: #fff; border-radius: 999px; padding: 6px 12px;
      font-weight: 900; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
    }
    .target-pill {
      position: absolute; top: 10px; left: 10px; right: 90px; z-index: 4; display: flex; align-items: center; gap: 6px;
      background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 0.95rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); border: 3px solid var(--lc);
    }
    .basket {
      position: absolute; bottom: 8px; width: 100px; height: 70px; z-index: 3; pointer-events: none;
      display: flex; align-items: flex-end; justify-content: center; font-size: 3.6rem; line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
    }
    .float-txt { position: absolute; z-index: 5; font-weight: 900; font-size: 1.4rem; pointer-events: none; animation: floatUp 0.9s ease forwards; text-shadow: 0 2px 4px rgba(0,0,0,.5); color: #fff; }
    @keyframes floatUp { to { transform: translateY(-50px); opacity: 0; } }
    .arcade-start {
      position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 20px; text-align: center; background: rgba(20, 50, 31, 0.72); color: #fff;
    }
    .arcade-start h3 { margin: 0; font-size: 1.5rem; }
    .arcade-start p { margin: 0; font-weight: 700; line-height: 1.5; max-width: 340px; }
    .arcade-start .btn { max-width: 320px; }

    /* ---------- Wynik ---------- */
    .result { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 24px; }
    .result .owl-big { width: 160px; }
    .result h2 { font-size: 1.9rem; margin: 6px 0 0; }
    .result-stars { display: flex; gap: 8px; font-size: 3.4rem; line-height: 1; }
    .rs { color: #e5e7eb; }
    .rs.on { color: var(--gold); text-shadow: 0 3px 0 #ca8a04; animation: starIn 0.5s ease both; animation-delay: var(--d); }
    @keyframes starIn { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1); } }
    .result p { font-weight: 700; color: var(--muted); margin: 0; font-size: 1.05rem; }
    .reward-pop {
      background: #fef9c3; border: 3px solid var(--gold); border-radius: 18px; padding: 12px 18px;
      font-weight: 900; font-size: 1.1rem; animation: pop 0.5s ease; display: flex; align-items: center; gap: 10px;
    }
    .reward-pop .ic { font-size: 2rem; }
    .result-actions { width: 100%; margin-top: auto; padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); }

    /* źródła */
    .info-wrap { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
    .info-card { background: #fff; border: 3px solid var(--line); border-radius: 22px; padding: 16px; }
    .info-card h3 { margin: 0 0 8px; font-size: 1.1rem; }
    .info-card p { margin: 0 0 8px; font-weight: 700; line-height: 1.55; color: #334155; }
    .src-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .src-list li { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: #334155; }
    .src-list img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex: none; }
    .src-list a { color: var(--primary-dark); }

    .confetti { position: fixed; top: -20px; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    @media (min-width: 600px) {
      .owl-big { width: 150px; }
      main { padding-left: 20px; padding-right: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ===== Rośliny i zwierzęta – dodatki ===== */
    :root { --zb: #d97706; --ok: #e11d48; --ol: #ca8a04; --wl: #0d9488; --ro: #16a34a; --mi: #dc2626; --ws: #7c3aed; }
    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(253, 224, 71, 0.5), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(134, 239, 172, 0.45), transparent 35%),
        linear-gradient(180deg, #fefce8 0%, #ecfccb 100%);
      background-attachment: fixed;
    }
    .arena { background: #a16207 url('zdjecia/pole.jpg') center / cover; }
    .btn { position: relative; overflow: hidden; }
    .btn.locked { background: #dcfce7; color: var(--primary-dark); box-shadow: 0 5px 0 #bbf7d0; font-size: 1rem; }
    .btn.locked .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: rgba(22, 163, 74, 0.2); transition: width 0.2s linear; }
    .btn.locked span { position: relative; }
    .btn.ready { animation: ready 0.5s ease; }
    @keyframes ready { 40% { transform: scale(1.04); } }
    .row2 { display: flex; gap: 10px; }
    .row2 .btn { margin-top: 0; }
    .row2 .btn.soft { flex: 0 0 34%; }

    /* teoria krok po kroku */
    .steps { flex: 1; display: flex; gap: 5px; }
    .steps i { flex: 1; height: 10px; border-radius: 999px; background: #dcfce7; }
    .steps i.on { background: var(--primary); }
    .steps i.done { background: #86efac; }
    .th-card { background: #fff; border: 3px solid var(--line); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 24px rgba(22, 101, 52, 0.12); animation: slideIn 0.35s ease; }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .th-step { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); }
    .th-hint { font-size: 0.85rem; font-weight: 900; color: var(--muted); text-align: center; }
    .modal-card { display: flex; flex-direction: column; gap: 12px; }
    .modal-card .th-card { animation: none; box-shadow: none; }
    .flips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .flips.three { grid-template-columns: repeat(3, 1fr); }
    .flips.one { grid-template-columns: 1fr; }
    .flip { position: relative; min-height: 92px; padding: 0; border: 0; background: none; perspective: 700px; }
    .flip > span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.5s ease; font-weight: 900; text-align: center; line-height: 1.25; }
    .flip .ff { background: linear-gradient(160deg, var(--tc, #4ade80), var(--tc2, #16a34a)); color: #fff; font-size: 1.1rem; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
    .flip .ff::after { content: '👆 dotknij'; font-size: 0.68rem; opacity: 0.9; font-weight: 800; }
    .flip .fb { background: #fff; border: 3px solid var(--tc, var(--good)); color: var(--ink); font-size: 1rem; transform: rotateY(180deg); box-shadow: 0 5px 0 var(--tc, var(--good)); }
    .flip .fb small { font-size: 0.76rem; color: var(--muted); font-weight: 800; }
    .flip .fb .in { display: block; }
    .flip .fb .in small { display: block; }
    .flip .fb img { display: block; margin: 0 auto 4px; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .flips.three .flip .fb { font-size: 0.9rem; padding: 6px; }
    .flip.open .ff { transform: rotateY(-180deg); }
    .flip.open .fb { transform: rotateY(0); }
    .flip:not(.open) { animation: wiggle 2.6s ease-in-out infinite; }
    .flip:nth-child(2) { animation-delay: 0.3s; } .flip:nth-child(3) { animation-delay: 0.6s; } .flip:nth-child(4) { animation-delay: 0.9s; }
    @keyframes wiggle { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-3deg); } 95% { transform: rotate(3deg); } }

    /* drzewko „rośliny uprawne” */
    .tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .tree-top { background: linear-gradient(160deg, #4ade80, #15803d); color: #fff; font-weight: 900; font-size: 1.1rem; padding: 8px 18px; border-radius: 999px; box-shadow: 0 4px 0 #166534; }
    .tree-stem { width: 4px; height: 14px; background: #86efac; }
    .tree-kids { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-top: 4px solid #86efac; padding-top: 10px; }
    .tree-kids.three { grid-template-columns: repeat(3, 1fr); }
    .tree-kid { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-weight: 900; font-size: 0.78rem; line-height: 1.15; }
    .tree-kid img { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 4px solid var(--lc); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15); }
    .tree-kid b { color: var(--lc); font-size: 0.9rem; }

    /* karta grupy roślin / zwierząt */
    .grp { border-radius: 22px; overflow: hidden; border: 3px solid var(--lc); background: #fff; }
    .grp-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--lc); color: #fff; font-weight: 900; font-size: 1.15rem; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
    .grp-head .use { margin-left: auto; white-space: nowrap; font-size: 0.72rem !important; background: rgba(255, 255, 255, 0.95); color: var(--lc); text-shadow: none; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; }
    .grp-strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(56px, 1fr); gap: 0; overflow-x: auto; }
    .grp-strip figure { margin: 0; position: relative; }
    .grp-strip img { width: 100%; height: 86px; object-fit: cover; display: block; }
    .grp-strip figcaption { position: absolute; left: 3px; right: 3px; bottom: 3px; background: rgba(255, 255, 255, 0.92); border-radius: 999px; font-size: 0.66rem; font-weight: 900; text-align: center; padding: 1px 2px; }
    .grp p { margin: 0; padding: 10px 12px; font-weight: 700; line-height: 1.55; color: #1f2937; }
    .fact { display: flex; gap: 10px; align-items: center; background: #ecfeff; border: 2px dashed #67e8f9; border-radius: 18px; padding: 8px 10px; font-weight: 700; line-height: 1.45; font-size: 0.95rem; }
    .fact img { width: 70px; height: 70px; border-radius: 14px; object-fit: cover; flex: none; }
    .fact b.tag { display: block; color: #0e7490; font-size: 0.8rem; }

    /* oś czasu – historia chleba, pory roku */
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-step { display: flex; align-items: center; gap: 10px; position: relative; padding: 6px 0; }
    .tl-step:not(:last-child)::after { content: ''; position: absolute; left: 31px; top: 66px; bottom: -6px; width: 4px; background: #fde68a; }
    .tl-ph { width: 66px; height: 66px; flex: none; border-radius: 50%; overflow: hidden; border: 4px solid #facc15; background: #fef9c3; display: grid; place-items: center; font-size: 2rem; position: relative; z-index: 1; }
    .tl-ph img { width: 100%; height: 100%; object-fit: cover; }
    .tl-txt { font-weight: 700; line-height: 1.4; }
    .tl-txt b.cn { display: inline-block; background: #fde68a; color: #92400e; border-radius: 999px; padding: 0 8px; font-size: 0.8rem; margin-bottom: 2px; }
    .seasons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .season { border-radius: 18px; overflow: hidden; background: #fff; border: 3px solid var(--lc); display: flex; flex-direction: column; }
    .season img { width: 100%; height: 78px; object-fit: cover; display: block; }
    .season .s-emo { height: 78px; display: grid; place-items: center; font-size: 2.6rem; background: var(--lc); }
    .season h4 { margin: 0; padding: 6px 8px 0; font-size: 1rem; color: var(--lc); }
    .season p { margin: 0; padding: 2px 8px 8px; font-size: 0.82rem; font-weight: 700; line-height: 1.35; }

    /* łańcuch pokarmowy */
    .chain { display: flex; align-items: flex-start; justify-content: center; gap: 2px; background: linear-gradient(90deg, #dcfce7, #fef9c3 55%, #fee2e2); border-radius: 20px; padding: 10px 6px; }
    .link { flex: 1 1 0; min-width: 0; max-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
    .link .ph { width: 100%; max-width: 72px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 4px solid var(--lc, #fff); background: #fff; display: grid; place-items: center; font-size: 1.8rem; font-weight: 900; color: #94a3b8; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15); }
    .link .ph img { width: 100%; height: 100%; object-fit: cover; }
    .link .ph.q { border-style: dashed; border-color: #94a3b8; animation: pulse 1.2s ease-in-out infinite; }
    .link .ph.q.now { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .link span { font-size: 0.74rem; font-weight: 900; line-height: 1.1; }
    .link small { font-size: 0.6rem; font-weight: 800; color: #fff; background: var(--lc, #94a3b8); border-radius: 999px; padding: 1px 6px; line-height: 1.3; }
    .arr { flex: none; align-self: center; margin-top: -18px; font-size: 1.3rem; font-weight: 900; color: #78716c; }

    /* ułóż historię */
    .slots { display: flex; flex-direction: column; gap: 6px; }
    .slot { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border-radius: 16px; border: 3px dashed #fde68a; background: rgba(255, 255, 255, 0.7); font-weight: 800; font-size: 0.92rem; line-height: 1.3; }
    .slot .cn { flex: none; min-width: 86px; text-align: center; background: #fde68a; color: #92400e; border-radius: 999px; padding: 3px 8px; font-weight: 900; font-size: 0.82rem; }
    .slot.next { border-color: var(--primary); background: var(--primary-soft); }
    .slot.filled { border-style: solid; border-color: var(--good); background: #fff; animation: pop 0.3s ease; }
    .slot .mini { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
    .slot .memo { font-size: 1.4rem; flex: none; }
    .scards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .scard { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 0 8px; border-radius: 18px; border: 3px solid var(--line); background: #fff; overflow: hidden; font-weight: 800; font-size: 0.85rem; line-height: 1.25; text-align: center; box-shadow: 0 4px 0 var(--line); }
    .scard img { width: 100%; height: 74px; object-fit: cover; }
    .scard .semo { width: 100%; height: 74px; display: grid; place-items: center; font-size: 2.4rem; background: #fef9c3; }
    .scard span { padding: 0 6px; }
    .scard.used { display: none; }
    .scard.bad { animation: shake 0.45s ease; border-color: #fca5a5; }

    /* emoji zamiast zdjęcia (produkty) */
    .emo-ph { display: grid; place-items: center; background: #fef9c3; font-size: 2.6rem; }
    .tile .emo-ph { flex: 1; min-height: 0; font-size: 2.6rem; }
    .faller .emo-ph { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35); font-size: 2.6rem; }
    .faller.small .emo-ph { width: 64px; height: 64px; font-size: 2rem; }
    .photo-card .emo-ph { height: min(34vh, 250px); font-size: 6rem; }
    .grp-btns.three .layer-btn { min-height: 58px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="pill back" href="./index.html" aria-label="Wróć do przyrody">← Wróć</a>
      <span class="spacer"></span>
      <a class="pill" href="../osiagniecia.html" title="Moje odznaki" aria-label="Moje odznaki">🏅</a>
      <span class="pill" title="Zdobyte gwiazdki">⭐ <span id="starCount">0</span></span>
      <span class="pill" title="Dni nauki z rzędu">🔥 <span id="streakCount">0</span></span>
      <button class="pill" id="readBtn" aria-label="Włącz lub wyłącz czytanie na głos">🗣️</button>
      <button class="pill" id="sfxBtn" aria-label="Włącz lub wyłącz dźwięki">🔔</button>
    </header>
    <main id="screen"></main>
  </div>

  <script src="../osiagniecia.js"></script>
  <script>
    /* ---------- Narzędzia ---------- */
    const $ = (s, r = document) => r.querySelector(s);
    const screen = $('#screen');
    function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const src = id => CONFIG.img + id + '.jpg';
    const credit = id => CREDITS[id] ? `📷 fot. ${CREDITS[id][0]}, ${CREDITS[id][1]}` : '';
    const lc = l => `--lc:${GROUPS[l].color}`;
    const lowerFirst = s => s.charAt(0).toLowerCase() + s.slice(1);

    /* =====================================================================
       ROŚLINY I ZWIERZĘTA – przyroda z Sówką Lulu (podręcznik cz. 1:
       „Na polu”, „Historia chleba”, „Rośliny uprawne”, „Praca rolnika”,
       „Rośliny i zwierzęta zależą od siebie”). Zdjęcia: zdjecia/ (Wikimedia
       Commons, autorzy w CREDITS i w zdjecia/ZRODLA.md).
       Silnik jak w warstwy-lasu.html, teoria krok po kroku jak w polski/gramatyka.html.
       ===================================================================== */
    const CONFIG = {
      storageKey: 'nauka-3a-przyroda-rosliny-zwierzeta-v1',
      img: 'zdjecia/',
