<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Gramatyka i ortografia – polski z Sówką Lulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1e1b4b;
      --muted: #64648a;
      --primary: #6366f1;
      --primary-dark: #4338ca;
      --primary-soft: #e0e7ff;
      --line: #c7d2fe;
      --good: #16a34a;
      --good-soft: #dcfce7;
      --bad: #dc2626;
      --bad-soft: #fee2e2;
      --gold: #facc15;
      /* kolory części mowy */
      --r: #2563eb;
      --c: #dc2626;
      --p: #16a34a;
      --x: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Nunito', system-ui, 'Segoe UI', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(165, 180, 252, 0.55), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(251, 191, 36, 0.28), transparent 35%),
        linear-gradient(180deg, #eef2ff 0%, #fdf4ff 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
    button:disabled { cursor: default; }

    #app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: rgba(238, 242, 255, 0.9); backdrop-filter: blur(10px); }
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-weight: 900; font-size: 1rem; text-decoration: none; color: var(--ink); white-space: nowrap; }
    .pill.back { color: var(--primary-dark); }
    .topbar .spacer { flex: 1; }
    @media (max-width: 420px) { .topbar { gap: 4px; padding: 10px 8px; } .topbar .pill { padding: 6px 8px; font-size: 0.92rem; min-height: 40px; gap: 4px; } }
    body.in-level .topbar { display: none; }
    main { flex: 1; display: flex; flex-direction: column; padding: 0 16px 24px; }
    body.in-level main { padding-bottom: 0; }

    /* Sowa */
    .owl-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .owl-big { width: 130px; flex: none; animation: bob 3s ease-in-out infinite; }
    .owl-mini { width: 56px; flex: none; }
    .jump { animation: jump 0.6s ease; }
    .shake { animation: shake 0.45s ease; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
    .bubble { position: relative; flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 10px 14px; font-weight: 700; line-height: 1.4; font-size: 1rem; box-shadow: 0 8px 20px rgba(67, 56, 202, 0.1); }
    .bubble::before { content: ''; position: absolute; left: -10px; top: 18px; border: 9px solid transparent; border-right-color: var(--line); border-left: 0; }
    .bubble::after { content: ''; position: absolute; left: -7px; top: 19px; border: 8px solid transparent; border-right-color: #fff; border-left: 0; }
    .pop { animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(0.94); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }

    /* Mapa */
    .hero { display: flex; align-items: center; gap: 14px; margin: 8px 0 14px; }
    .reward-bar { background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 12px 14px; font-weight: 800; font-size: 0.95rem; }
    .bar { height: 12px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #a5b4fc, var(--primary)); border-radius: 999px; transition: width 0.6s ease; }
    .section-title { font-size: 1.3rem; font-weight: 900; margin: 24px 0 10px; }
    .path { display: flex; flex-direction: column; align-items: flex-start; }
    .path-dots { width: 4px; height: 18px; margin: 2px 0 2px 40px; border-left: 4px dotted #a5b4fc; }
    .node { position: relative; width: 84%; margin-left: calc(var(--off) * 8%); display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; background: #fff; border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 6px 0 var(--line); transition: transform 0.12s ease; }
    .node:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
    .node-icon { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; font-weight: 900; background: var(--primary-soft); }
    .node-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .node-num { font-size: 0.75rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
    .node-name { font-size: 1.05rem; font-weight: 900; }
    .node-desc { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .node-stars { font-size: 1.1rem; color: var(--gold); letter-spacing: -1px; flex: none; text-shadow: 0 1px 0 #ca8a04; }
    .node-stars .off { color: #e5e7eb; text-shadow: none; }
    .node.done { border-color: #a5b4fc; }
    .node.current { border-color: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); animation: glow 1.8s ease-in-out infinite; }
    .node.current .node-icon { background: var(--primary); color: #fff; }
    .node.locked { opacity: 0.55; background: #f8fafc; box-shadow: 0 6px 0 #e5e7eb; border-color: #e5e7eb; }
    .node.locked .node-icon { background: #e5e7eb; }
    .node.arcade .node-num { color: #c2410c; }
    @keyframes glow { 0%, 100% { outline: 0 solid rgba(99, 102, 241, 0.25); } 50% { outline: 7px solid rgba(99, 102, 241, 0.15); } }
    .here { position: absolute; right: 10px; top: -13px; background: var(--gold); color: var(--ink); font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 0 #ca8a04; }
    .link-btn.danger { background: none; border: 0; color: #9ca3af; margin: 28px auto 0; display: block; font-size: 0.85rem; font-weight: 800; text-decoration: underline; padding: 8px; }

    /* Przyciski */
    .btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 58px; padding: 12px 18px; border: 0; border-radius: 18px; font-size: 1.2rem; font-weight: 900; background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark); transition: transform 0.1s ease; }
    .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
    .btn.soft { background: #fff; color: var(--primary-dark); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
    .btn + .btn { margin-top: 12px; }
    .btn.locked { background: #e0e7ff; color: #6366f1; box-shadow: 0 5px 0 #c7d2fe; font-size: 1rem; }
    .btn.locked .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: rgba(99, 102, 241, 0.18); transition: width 0.2s linear; }
    .btn.locked span { position: relative; }
    .btn.ready { animation: ready 0.5s ease; }
    @keyframes ready { 40% { transform: scale(1.04); } }
    .row2 { display: flex; gap: 10px; }
    .row2 .btn { margin-top: 0; }
    .row2 .btn.soft { flex: 0 0 34%; }

    /* Poziom */
    .level { flex: 1; display: flex; flex-direction: column; }
    .level-top { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
    .icon-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 1.2rem; font-weight: 900; color: var(--muted); }
    .progress { flex: 1; height: 16px; background: #fff; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #a5b4fc, #6366f1); border-radius: 999px; transition: width 0.4s ease; }
    .level-badge { font-size: 1.5rem; font-weight: 900; }
    .hearts { font-size: 1.2rem; letter-spacing: 1px; white-space: nowrap; }
    .hearts .lost { filter: grayscale(1); opacity: 0.3; }
    .guide { display: flex; align-items: flex-start; gap: 10px; margin: 2px 0 10px; }
    .task { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

    .q-card { position: relative; background: #fff; border: 3px solid var(--line); border-radius: 24px; padding: 18px; text-align: center; }
    .q-num { font-size: 0.82rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; padding: 0 34px; }
    .q-text { font-size: 1.2rem; font-weight: 900; line-height: 1.45; }
    .q-text.big { font-size: 2.1rem; letter-spacing: 0.02em; }
    .blank { display: inline-block; min-width: 48px; border-bottom: 3px dashed var(--primary); color: var(--primary-dark); padding: 0 4px; }
    .blank.filled { min-width: 0; padding: 0 1px; border-bottom-style: solid; background: var(--good-soft); border-radius: 6px 6px 0 0; color: #15803d; }
    .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
    .quiz-opts.duo { flex-direction: row; }
    .quiz-opts.duo .quiz-opt { justify-content: center; font-size: 1.6rem; min-height: 76px; }
    .quiz-opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px; text-align: left; border-radius: 18px; border: 3px solid var(--oc, var(--line)); background: #fff; font-size: 1.05rem; font-weight: 800; line-height: 1.35; box-shadow: 0 5px 0 var(--oc, var(--line)); }
    .quiz-opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
    .quiz-opt .letter { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 0.9rem; font-weight: 900; background: var(--primary-soft); color: var(--primary-dark); }
    .quiz-opt .pq { margin-left: auto; font-size: 0.8rem; color: var(--muted); font-weight: 800; }
    .quiz-opt.ok { background: var(--good-soft); border-color: var(--good); box-shadow: 0 5px 0 var(--good); }
    .quiz-opt.ok .letter { background: var(--good); color: #fff; }
    .quiz-opt.bad { background: var(--bad-soft); border-color: #fca5a5; box-shadow: none; opacity: 0.8; }
    .quiz-opt.dim { opacity: 0.5; }
    .note { text-align: left; background: #fef9c3; border: 2px solid #fde68a; border-radius: 16px; padding: 10px 12px; font-weight: 700; line-height: 1.45; font-size: 0.95rem; }
    .feedback-head { font-weight: 900; text-align: center; font-size: 1.05rem; }
    .feedback-head.bad { color: #b91c1c; }

    /* wyrazy do dotykania w zdaniu */
    .sent { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .wbtn { display: inline-flex; flex-direction: column; align-items: center; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 3px solid var(--line); background: #fff; font-size: 1.25rem; font-weight: 900; box-shadow: 0 4px 0 var(--line); }
    .wbtn small { font-size: 0.68rem; font-weight: 900; color: #fff; background: var(--tc); border-radius: 999px; padding: 1px 7px; margin-top: 3px; display: none; }
    .wbtn.tagged { border-color: var(--tc); box-shadow: 0 4px 0 var(--tc); }
    .wbtn.tagged small { display: block; }
    .wbtn.ok { background: var(--good-soft); }
    .wbtn.bad { background: var(--bad-soft); }
    .order-row { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 8px; border: 3px dashed var(--line); border-radius: 18px; background: rgba(255,255,255,.6); align-items: center; justify-content: center; }
    .order-row .placed { background: var(--good-soft); border: 3px solid var(--good); border-radius: 14px; padding: 6px 10px; font-weight: 900; font-size: 1.15rem; }
    .order-row .placed i { font-style: normal; font-size: 0.75rem; color: var(--good); margin-right: 4px; }
    .order-row .hint { color: var(--muted); font-weight: 800; font-size: 0.9rem; }
    .wbtn.used { visibility: hidden; }
    .wbtn .first { color: var(--primary); text-decoration: underline; }

    /* ---------- Teoria krok po kroku ---------- */
    .steps { flex: 1; display: flex; gap: 5px; }
    .steps i { flex: 1; height: 10px; border-radius: 999px; background: #e0e7ff; }
    .steps i.on { background: var(--primary); }
    .steps i.done { background: #a5b4fc; }
    .th-card { background: #fff; border: 3px solid var(--line); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 24px rgba(67, 56, 202, 0.12); animation: slideIn 0.35s ease; }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .th-step { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); }
    .th-title { margin: 0; font-size: 1.35rem; font-weight: 900; }
    .th-p { margin: 0; font-weight: 700; line-height: 1.6; font-size: 1.06rem; color: #1f2937; }
    .th-tip { background: #fef9c3; border: 2px solid #fde68a; border-radius: 18px; padding: 10px 12px; font-weight: 800; line-height: 1.5; }
    .th-rule { background: var(--primary-soft); border-radius: 18px; padding: 10px 12px; font-weight: 800; line-height: 1.5; border-left: 8px solid var(--primary); }
    .th-hint { font-size: 0.85rem; font-weight: 900; color: var(--muted); text-align: center; }
    .th-big { font-size: 1.5rem; font-weight: 900; text-align: center; line-height: 1.4; }
    .theory-actions { padding: 14px 0 calc(16px + env(safe-area-inset-bottom)); }
    .tag { display: inline-block; color: #fff; background: var(--tc); border-radius: 999px; padding: 1px 10px; font-weight: 900; }
    .q { color: var(--tc); font-weight: 900; }
    .abc { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .abc span { width: 30px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--primary-soft); font-weight: 900; font-size: 1.05rem; }
    .abc span.pl { background: #fde68a; color: #92400e; }

    /* karty do odwracania */
    .flips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .flips.three { grid-template-columns: repeat(3, 1fr); }
    .flips.one { grid-template-columns: 1fr; }
    .flip { position: relative; min-height: 92px; padding: 0; border: 0; background: none; perspective: 700px; }
    .flip > span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.5s ease; font-weight: 900; text-align: center; line-height: 1.25; }
    .flip .ff { background: linear-gradient(160deg, #818cf8, #6366f1); color: #fff; font-size: 1.2rem; box-shadow: 0 5px 0 var(--primary-dark); }
    .flip .ff::after { content: '👆 dotknij'; font-size: 0.68rem; opacity: 0.85; font-weight: 800; }
    .flip .fb { background: #fff; border: 3px solid var(--tc, var(--good)); color: var(--ink); font-size: 1.05rem; transform: rotateY(180deg); box-shadow: 0 5px 0 var(--tc, var(--good)); }
    .flip .fb .tag { font-size: 0.78rem; padding: 1px 7px; max-width: 100%; }
    .flips.three .flip .fb { font-size: 0.95rem; padding: 6px; }
    .flip .fb small { font-size: 0.78rem; color: var(--muted); font-weight: 800; }
    .flip.open .ff { transform: rotateY(-180deg); }
    .flip.open .fb { transform: rotateY(0); }
    .flip:not(.open) { animation: wiggle 2.6s ease-in-out infinite; }
    .flip:nth-child(2) { animation-delay: 0.3s; } .flip:nth-child(3) { animation-delay: 0.6s; } .flip:nth-child(4) { animation-delay: 0.9s; }
    @keyframes wiggle { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-3deg); } 95% { transform: rotate(3deg); } }
    .flips.words { display: flex; flex-wrap: wrap; justify-content: center; }
    .flips.words .flip { min-width: 96px; flex: 0 0 auto; min-height: 78px; }
    .flips.words .flip .ff { font-size: 1.15rem; }

    .tempo { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; font-weight: 900; font-size: 0.9rem; color: var(--muted); }
    .reward-bar + .tempo { margin: 12px 0 0; }
    .tempo span { flex-basis: 100%; }
    .tempo button { flex: 1; min-height: 46px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-weight: 900; font-size: 0.95rem; color: var(--ink); }
    .tempo button.on { background: var(--primary); border-color: var(--primary-dark); color: #fff; }
    .say-mini { flex: none; width: 42px; height: 42px; border-radius: 50%; align-self: center; border: 2px solid var(--line); background: #fff; font-size: 1.15rem; display: grid; place-items: center; padding: 0; }
    .say-mini.on, .btn.on { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 50% { box-shadow: 0 0 0 7px rgba(99, 102, 241, 0.12); } }
    .q-card .say-mini { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; font-size: 1rem; }
    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(30, 27, 75, 0.55); display: flex; align-items: flex-end; justify-content: center; }
    .modal-card { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #eef2ff; border-radius: 26px 26px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: slideUp 0.3s ease; display: flex; flex-direction: column; gap: 12px; }
    .modal-card .th-card { animation: none; box-shadow: none; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Gry zręcznościowe */
    .arena { position: relative; flex: 1; min-height: 400px; border-radius: 24px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: linear-gradient(180deg, #818cf8 0%, #c4b5fd 55%, #fbcfe8 100%); margin-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .arena.rain { background: linear-gradient(180deg, #475569 0%, #64748b 50%, #94a3b8 100%); }
    .cloud { position: absolute; font-size: 3rem; opacity: 0.8; pointer-events: none; }
    .faller { position: absolute; pointer-events: none; z-index: 3; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 1.15rem; white-space: nowrap; box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25); border: 3px solid #fff; }
    .faller.drop { font-size: 1.7rem; padding: 10px 20px; border-radius: 22px; border-color: #bae6fd; }
    .faller.drop .blank { min-width: 36px; }
    .score-pill { position: absolute; top: 10px; right: 10px; z-index: 4; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 900; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); }
    .target-pill { position: absolute; top: 10px; left: 10px; right: 90px; z-index: 4; display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 0.95rem; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); border: 3px solid var(--tc); }
    .basket { position: absolute; bottom: 8px; width: 100px; height: 70px; z-index: 3; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); }
    .rain-btns { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 4; display: flex; gap: 10px; }
    .rain-btns button { flex: 1; min-height: 72px; border-radius: 20px; border: 0; background: #fff; font-size: 2rem; font-weight: 900; color: var(--primary-dark); box-shadow: 0 6px 0 #312e81; }
    .rain-btns button:active { transform: translateY(4px); box-shadow: 0 2px 0 #312e81; }
    .float-txt { position: absolute; z-index: 5; font-weight: 900; font-size: 1.3rem; pointer-events: none; animation: floatUp 1.1s ease forwards; text-shadow: 0 2px 4px rgba(0,0,0,.5); color: #fff; }
    @keyframes floatUp { to { transform: translateY(-50px); opacity: 0; } }
    .arcade-start { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(30, 27, 75, 0.75); color: #fff; }
    .arcade-start h3 { margin: 0; font-size: 1.5rem; }
    .arcade-start p { margin: 0; font-weight: 700; line-height: 1.5; max-width: 340px; }
    .arcade-start .btn { max-width: 320px; }

    /* Wynik */
    .result { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 24px; }
    .result .owl-big { width: 160px; }
    .result h2 { font-size: 1.9rem; margin: 6px 0 0; }
    .result-stars { display: flex; gap: 8px; font-size: 3.4rem; line-height: 1; }
    .rs { color: #e5e7eb; }
    .rs.on { color: var(--gold); text-shadow: 0 3px 0 #ca8a04; animation: starIn 0.5s ease both; animation-delay: var(--d); }
    @keyframes starIn { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1); } }

    const PRAISE = ['Super!', 'Brawo!', 'Hu hu! Świetnie!', 'Ekstra!', 'Tak jest! 🎉', 'Mistrzyni ortografii! ✏️', 'Wow, pięknie!', 'Doskonale!'];

    const $ = (s, r = document) => r.querySelector(s);
    const screen = $('#screen');

    /* ---------- Stan ---------- */
    function defaultState() { return { stars: {}, seen: {}, streak: { last: null, count: 0 }, sfx: true, read: true, tempo: 'mid' }; }
    function loadState() {
      try { const s = JSON.parse(localStorage.getItem(CONFIG.storageKey)); if (s) return Object.assign(defaultState(), s); } catch (e) {}
      return defaultState();
    }
    function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {} }
    const state = loadState();
    const totalStars = () => LEVELS.reduce((s, l) => s + (state.stars[l.id] || 0), 0);
    const accessories = () => REWARDS.filter(r => totalStars() >= r.at).map(r => r.id);
    const unlocked = i => i === 0 || !!state.stars[LEVELS[i - 1].id];
    function dayStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); }
    function bumpStreak() { const t = dayStr(new Date()), s = state.streak; if (s.last === t) return; s.count = s.last === yesterdayStr() ? s.count + 1 : 1; s.last = t; }
    const currentStreak = () => state.streak.last === dayStr(new Date()) || state.streak.last === yesterdayStr() ? state.streak.count : 0;

    function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const gapHTML = (w, fill) => w.replace('_', fill ? `<span class="blank filled">${fill}</span>` : '<span class="blank" id="blank">&nbsp;?&nbsp;</span>');
    const fullWord = it => it.w.replace('_', it.a);

    /* ---------- Dźwięki ---------- */
    let actx = null;
    function tone(freqs, dur = 0.1, type = 'sine', vol = 0.15) {
      if (!state.sfx) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = actx.currentTime;
        freqs.forEach((f, i) => {
          const o = actx.createOscillator(), gn = actx.createGain(), st = t0 + i * dur;
          o.type = type; o.frequency.value = f;
          gn.gain.setValueAtTime(0, st); gn.gain.linearRampToValueAtTime(vol, st + 0.01); gn.gain.exponentialRampToValueAtTime(0.001, st + dur * 1.6);
          o.connect(gn).connect(actx.destination); o.start(st); o.stop(st + dur * 1.7);
        });
      } catch (e) {}
    }
    const sfx = { good: () => tone([660, 990], 0.09), bad: () => tone([240, 180], 0.12, 'triangle'), tap: () => tone([520], 0.04, 'sine', 0.07), flip: () => tone([440, 660], 0.06, 'sine', 0.08), win: () => tone([523, 659, 784, 1047], 0.12), lose: () => tone([392, 330, 262], 0.16, 'triangle') };

    /* ---------- Czytanie na głos ----------
       Tempo jak u ucznia 3 klasy: wolniej (CONFIG.rate) i przerwa po każdym
       zdaniu (CONFIG.pauseMs). Tekst dzielimy na zdania i czytamy po kolei. */
    let plVoice = null, sayBtn = null, sayToken = 0, sayTimer = null;
    function pickVoice() {
      if (!window.speechSynthesis) return;
      const pl = speechSynthesis.getVoices().filter(v => /^pl/i.test(v.lang));
      plVoice = pl.find(v => /Google|Natural|Online|Neural|Siri|Zosia|Ewa/i.test(v.name)) || pl.find(v => /Paulina|Zofia|Marek/i.test(v.name)) || pl[0] || null;
    }
    if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
    function plain(html) {
      const d = document.createElement('div');
      d.innerHTML = String(html).replace(/___/g, ' … ');
      d.querySelectorAll('.no-read, .say-mini, .letter, .fb, .ff').forEach(e => e.remove());
      d.querySelectorAll('.blank:not(.filled)').forEach(e => { e.textContent = ' … '; });
      d.querySelectorAll('h2, h3, p, li, .th-tip, .th-rule, .quiz-opt, .q-text, .q-num').forEach(e => e.append(/[.!?:…]\s*$/.test(e.textContent) ? ' ' : '. '));
      return d.textContent.replace(/\d️?⃣/gu, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu, ' ')
        .replace(/→|←|↓|↑|✕|✓|„|”/g, ' ').replace(/(\s*\.\s*){2,}/g, '. ').replace(/\s+/g, ' ').trim();
    }
    // dzielimy tylko na prawdziwe zdania: po . ! ? … i gdy dalej jest wielka litera
    // („kto? co?” i dwukropki zostają w jednym kawałku); krótkie kawałki doklejamy do następnego
    function sentences(t) {
      return t.split(/(?<=[.!?…])\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ0-9])/u).map(s => s.trim()).filter(s => /[\p{L}\d]/u.test(s));
    }
    // kawałki do czytania z pauzą po każdym: po kropce/!/? – długa, po : ; – średnia, po przecinku – krótka.
    // Syntezator sam prawie nie robi przerw, więc czytamy kawałek po kawałku.
    function chunks(t) {
      const out = [];
      const re = /[^.!?…:;,–]+(?:[.!?…:;,]+|\s–\s|–|$)/gu;
      for (const m of t.match(re) || []) {
        const s = m.trim();
        if (!/[\p{L}\d]/u.test(s)) { if (out.length) out[out.length - 1].t += ' ' + s; continue; }
        const end = s.slice(-1);
        const pm = /[.!…]/.test(end) ? 1 : end === '?' ? 0.8 : /[:;–]/.test(end) ? 0.55 : end === ',' ? 0.3 : 1;
        out.push({ t: s.replace(/\s*–$/, ''), pm });
      }
      return out;
    }
    function markSaying(btn) { if (sayBtn) sayBtn.classList.remove('on'); sayBtn = btn || null; if (sayBtn) sayBtn.classList.add('on'); }
    let sayQueue = [], sayActive = false, sayStarted = false, sayTotal = 0;
    const tempo = () => CONFIG.tempa.find(t => t.id === state.tempo) || CONFIG.tempa[1];
    function stopSpeak() { sayToken++; sayQueue = []; sayActive = false; clearTimeout(sayTimer); try { speechSynthesis.cancel(); } catch (e) {} markSaying(null); }
    // append = true: nie przerywaj tego, co Sówka czyta – dopisz na koniec (np. odwrócona karta)
    // onDone – wywołane, gdy Sówka przeczyta wszystko do końca (nie przy przerwaniu)
    function speak(text, btn, append, onDone) {
      if (!window.speechSynthesis || !text) return;
      if (append && sayActive) { const c = chunks(text); sayQueue.push(...c); sayTotal += c.length; return; }
      stopSpeak();
      const my = sayToken;
      sayQueue = chunks(text); sayTotal = sayQueue.length; sayActive = true; sayStarted = false;
      markSaying(btn);
      const next = () => {
        if (my !== sayToken) return;
        if (!sayQueue.length) { sayActive = false; markSaying(null); if (onDone) onDone(); return; }
        const c = sayQueue.shift();
        const u = new SpeechSynthesisUtterance(c.t);
        u.lang = 'pl-PL'; if (plVoice) u.voice = plVoice;
        u.rate = tempo().rate; u.pitch = 1.05;
        u.onstart = () => { sayStarted = true; };
        let done = false;
        const go = () => { if (done || my !== sayToken) return; done = true; sayTimer = setTimeout(next, CONFIG.pauseMs * c.pm * tempo().pf); };
        u.onend = u.onerror = go;
        try { speechSynthesis.speak(u); } catch (e) { go(); }
      };
      next();
    }
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-say]');
      if (!b) return;
      if (sayBtn === b) { stopSpeak(); return; }
      const el = document.querySelector(b.dataset.say);
      const ex = b.dataset.extra ? document.querySelector(b.dataset.extra) : null;
      if (el) speak(plain(el.innerHTML + (ex ? '. ' + ex.innerHTML : '')), b);
    });
    // wybór tempa czytania (🐢 🚶 🐇) – działa od razu, także w trakcie czytania
    const tempoHTML = () => `<div class="tempo no-read"><span>Tempo czytania:</span>${CONFIG.tempa.map(t => `<button class="${t.id === state.tempo ? 'on' : ''}" data-tempo="${t.id}">${t.icon} ${t.name}</button>`).join('')}</div>`;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-tempo]');
      if (!b) return;
      state.tempo = b.dataset.tempo; save(); sfx.tap();
      document.querySelectorAll('[data-tempo]').forEach(x => x.classList.toggle('on', x.dataset.tempo === state.tempo));
      if (!sayActive) speak(`Tak będę czytać: ${tempo().name}. Posłuchaj, czy Ci pasuje.`);
    });
    const sayMini = (sel, extra) => `<button class="say-mini" data-say="${sel}" ${extra ? `data-extra="${extra}"` : ''} aria-label="Przeczytaj na głos">🔊</button>`;

    /* ---------- Sówka Lulu (fioletowa) ---------- */
    function owlSVG(mood) {

      const crown = acc.includes('crown') ? `<polygon points="36,40 37,12 49,27 60,5 71,27 83,12 84,40" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="30" r="4" fill="#ef4444"/><circle cx="45" cy="33" r="3" fill="#3b82f6"/><circle cx="75" cy="33" r="3" fill="#22c55e"/>` : '';
      const hat = acc.includes('hat') && !acc.includes('crown') ? `<path d="M44 34 v10 q16 7 32 0 v-10z" fill="#1e1b4b"/><polygon points="26,30 60,16 94,30 60,44" fill="#312e81"/><path d="M60 30 L90 33 V48" stroke="#facc15" stroke-width="3" fill="none"/><circle cx="90" cy="50" r="4" fill="#facc15"/>` : '';
      return `<svg class="owl-svg" viewBox="0 0 120 135" aria-hidden="true">
        <ellipse cx="60" cy="131" rx="34" ry="4" fill="rgba(30,27,75,0.14)"/>

        <ellipse cx="60" cy="80" rx="42" ry="46" fill="#6366f1"/>
        <ellipse cx="21" cy="92" rx="11" ry="24" fill="#4338ca" transform="rotate(14 21 92)"/>
        <ellipse cx="99" cy="92" rx="11" ry="24" fill="#4338ca" transform="rotate(-14 99 92)"/>
        <ellipse cx="60" cy="98" rx="26" ry="27" fill="#e0e7ff"/>
        <path d="M48 96 q5 5 10 0 M62 96 q5 5 10 0 M55 107 q5 5 10 0" stroke="#a5b4fc" stroke-width="2.5" fill="none"/>
        ${eyes}
        <polygon points="54,73 66,73 60,84" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
        <ellipse cx="47" cy="126" rx="8" ry="4.5" fill="#f59e0b"/><ellipse cx="73" cy="126" rx="8" ry="4.5" fill="#f59e0b"/>
        ${scarf}${glasses}${hat}${crown}
      </svg>`;
    }
    function owlSay(html, mood) {
      const b = $('#bubble');
      if (b) { b.innerHTML = html; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
      const o = $('#owl');
      if (o) { o.innerHTML = owlSVG(mood); o.classList.remove('jump', 'shake'); void o.offsetWidth; if (mood === 'happy') o.classList.add('jump'); if (mood === 'sad') o.classList.add('shake'); }
    }
    function confetti() {
      const colors = ['#6366f1', '#facc15', '#ec4899', '#22c55e', '#a5b4fc', '#f97316'];
      for (let i = 0; i < 45; i++) {
        const c = document.createElement('div');
        c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = pick(colors);
        c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * 0.4 + 's';
        document.body.appendChild(c); setTimeout(() => c.remove(), 3800);

    }

    function updateTopbar() {
      $('#starCount').textContent = totalStars();
      $('#streakCount').textContent = currentStreak();
      $('#sfxBtn').textContent = state.sfx ? '🔔' : '🔕';
      $('#readBtn').textContent = state.read ? '🗣️' : '🤐';

    }
    $('#readBtn').addEventListener('click', () => { state.read = !state.read; save(); updateTopbar(); if (state.read) speak('Hu hu! Będę czytać na głos.'); else stopSpeak(); });
    $('#sfxBtn').addEventListener('click', () => { state.sfx = !state.sfx; save(); updateTopbar(); });

    let raf = null, keyHandler = null, timers = [];
    function stopGame() { if (raf) cancelAnimationFrame(raf); raf = null; keyHandler = null; timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; }
    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function gameLoop(step) {
      let last = performance.now();
      const f = now => { const dt = Math.min(50, now - last); last = now; if (step(dt) !== false) raf = requestAnimationFrame(f); };
      raf = requestAnimationFrame(f);
    }
    document.addEventListener('keydown', e => { if (keyHandler) keyHandler(e); });

    /* =====================================================================
       MAPA
       ===================================================================== */
    function renderMap() {
      stopGame(); stopSpeak();
      document.body.classList.remove('in-level');
      updateTopbar();
      const tot = totalStars();
      const next = REWARDS.find(r => tot < r.at);
      const prevAt = [...REWARDS].reverse().find(r => tot >= r.at)?.at || 0;
      const pct = next ? Math.round((tot - prevAt) / (next.at - prevAt) * 100) : 100;
      const cur = LEVELS.findIndex((l, i) => unlocked(i) && !state.stars[l.id]);
      let greet;
      if (tot === 0) greet = CONFIG.intro;
      else if (tot === MAX_STARS) greet = 'Hu hu! Komplet gwiazdek! 🏆 Sprawdzian Ci niestraszny. Wracaj, kiedy chcesz powtórzyć.';
      else if (cur >= 0) greet = `Witaj z powrotem! ✏️ Dziś czeka na Ciebie: <b>${LEVELS[cur].name}</b>. Dasz radę! 💪`;
      else greet = 'Wszystko odblokowane! Zagraj jeszcze raz tam, gdzie brakuje Ci gwiazdek ⭐.';
      const node = (l, i) => {
        const s = state.stars[l.id] || 0, un = unlocked(i);
        const cls = (!un ? 'locked' : i === cur ? 'current' : s ? 'done' : '') + (l.arcade ? ' arcade' : '');
        return `<button class="node ${cls}" data-level="${i}" ${un ? '' : 'disabled'} style="--off:${[0, 1, 2, 1][i % 4]}">
          <span class="node-icon">${un ? l.icon : '🔒'}</span>
          <span class="node-body"><span class="node-num">${l.boss ? 'Finał' : l.arcade ? 'Gra zręcznościowa' : `Zadanie ${i + 1}`}</span>
            <span class="node-name">${l.name}</span><span class="node-desc">${l.desc}</span></span>
          <span class="node-stars">${'★'.repeat(s)}<span class="off">${'★'.repeat(3 - s)}</span></span>
          ${i === cur ? '<span class="here">🦉 Tu jesteś!</span>' : ''}
        </button>`;
      };
      screen.innerHTML = `
        <section class="hero"><div class="owl-big">${owlSVG(tot === MAX_STARS ? 'happy' : '')}</div><div class="bubble">${greet}</div></section>
        <div class="reward-bar">
          ${next ? `🎁 Następna nagroda dla Sówki: ${next.icon} <b>${next.name}</b> – jeszcze ${next.at - tot} ⭐` : '👑 Sówka ma już wszystkie nagrody!'}
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
        ${tempoHTML()}
        <h2 class="section-title">🗺️ Ścieżka do sprawdzianu</h2>
        <div class="path">${LEVELS.map(node).join('<div class="path-dots"></div>')}</div>
        <button class="link-btn danger" id="resetBtn">Zacznij od nowa (dla rodzica)</button>`;
      screen.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => startLevel(+b.dataset.level)));
      $('#resetBtn').addEventListener('click', () => {
        if (confirm('Usunąć wszystkie gwiazdki w tej grze?')) { try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {} location.reload(); }
      });

    }

    /* =====================================================================
       POZIOMY
       ===================================================================== */
    let session = null;
    function startLevel(idx, skipTheory) {
      stopGame(); stopSpeak();
      const lvl = LEVELS[idx];
      session = { idx, lvl, mistakes: 0, total: 0, solved: 0, queue: [] };
      document.body.classList.add('in-level');
      const run = () => { stopGame(); stopSpeak(); ({ queue: startQueue, catch: startCatch, rain: startRain })[lvl.type](); };
      if (THEORY[lvl.id] && !skipTheory) renderTheory(run); else run();
    }

    /* ---------- Teoria krok po kroku ----------
       Pierwszy raz: „Dalej” jest zablokowane, dopóki dziecko nie odwróci
       wszystkich kart i nie minie czas na przeczytanie kroku. */
    function readMs(html) {
      const t = plain(html);
      const words = t.split(/\s+/).filter(Boolean).length, sents = Math.max(1, sentences(t).length);
      return Math.min(30000, Math.max(3000, (words * CONFIG.secPerWord + sents * CONFIG.secPerSentence) * 1000));
    }
    function bindFlips(root, onFlip) {
      root.querySelectorAll('.flip').forEach(f => f.addEventListener('click', () => {
        const first = !f.classList.contains('open');
        f.classList.add('open'); sfx.flip();
        // pytanie z przodu („Jaki pies?”) czytamy razem z odpowiedzią; wyraz z luką („k_yk”, „leka…”) – tylko gotowy wyraz z tyłu
        const front = plain(f.querySelector('.ff').innerHTML), back = plain(f.querySelector('.fb').innerHTML);
        if (state.read && first) speak((/\?/.test(front) ? front + ' ' : '') + back + '.', null, true);
        if (first && onFlip) onFlip();
      }));
    }
    function renderTheory(run) {
      const id = session.lvl.id, th = THEORY[id], n = th.steps.length;
      const seen = !!state.seen[id];
      const passed = new Set();   // kroki już zaliczone w tej wizycie – po powrocie nie blokujemy
      let step = 0;
      const render = () => {
        stopGame(); stopSpeak();
        const last = step === n - 1, free = seen || passed.has(step);
        screen.innerHTML = `
          <section class="level">
            <div class="level-top">
              <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
              <div class="steps no-read">${th.steps.map((_, i) => `<i class="${i === step ? 'on' : i < step ? 'done' : ''}"></i>`).join('')}</div>
              <div class="level-badge">${session.lvl.icon}</div>
            </div>
            <div class="guide"><div class="owl-mini" id="owl">${owlSVG('happy')}</div><div class="bubble" id="bubble">${step === 0 ? `📖 Przypomnij sobie: <b>${th.title}</b>. Obejrzyj każdy krok!` : last ? 'Ostatni krok – i zaczynamy zadania! 💪' : `Krok ${step + 1} z ${n}. Czytamy dalej! 👀`}</div></div>
            <div class="th-card" id="theory"><div class="th-step no-read">Krok ${step + 1} z ${n}</div>${th.steps[step]}</div>
            <div class="theory-actions">
              ${tempoHTML()}
              <button class="btn soft" id="readTh">🔊 Przeczytaj mi</button>
              <div class="row2" style="margin-top:12px">
                ${step > 0 ? '<button class="btn soft" id="prevTh">← Wstecz</button>' : ''}
                <button class="btn" id="goTh"><span class="fill"></span><span id="goLbl"></span></button>
              </div>
              ${seen ? '<button class="btn soft" id="skipTh">⏭ Znam to – od razu do zadań</button>' : ''}
            </div>
          </section>`;
        const go = $('#goTh'), lbl = $('#goLbl');
        const card = $('#theory');
        const nFlips = card.querySelectorAll('.flip').length;
        const need = free ? 0 : readMs(card.innerHTML);
        const t0 = Date.now();
        const goText = last ? 'Rozumiem – zaczynamy! →' : 'Dalej →';
        // gdy Sówka czyta na głos: „Dalej” dopiero, gdy skończy czytać (krok i odwrócone karty).
        // Gdy czytanie wyłączone albo telefon nie ma głosu – czas na samodzielne przeczytanie.
        let readDone = false;
        const readBtn = $('#readTh');
        const startRead = () => { readDone = false; speak(plain(card.innerHTML), readBtn, false, () => { readDone = true; }); };
        readBtn.addEventListener('click', () => { if (sayBtn === readBtn) stopSpeak(); else startRead(); });
        const listen = () => state.read && !!window.speechSynthesis && (sayStarted || sayActive || Date.now() - t0 < 3000);
        const check = () => {
          const left = card.querySelectorAll('.flip:not(.open)').length;
          const el = Date.now() - t0;
          const mustListen = !free && listen();
          const ok = free || (left === 0 && (mustListen ? readDone && !sayActive : el >= need));
          if (ok) {
            if (go.classList.contains('locked') || !go.dataset.ready) { go.classList.remove('locked'); go.classList.add('ready'); go.dataset.ready = '1'; go.disabled = false; lbl.textContent = goText; }
            return true;
          }
          go.classList.add('locked'); go.disabled = true;
          const part = mustListen ? (readDone ? 1 : sayActive && sayTotal ? 1 - (sayQueue.length + 1) / sayTotal : 0) : el / need;
          go.style.setProperty('--p', Math.min(100, Math.round((part * (nFlips ? 0.5 : 1) + (nFlips ? (nFlips - left) / nFlips * 0.5 : 0)) * 100)) + '%');
          lbl.textContent = left ? `👆 Odwróć karty (zostało ${left})` : !mustListen ? '⏳ Przeczytaj spokojnie…' : sayActive ? '🔊 Słuchaj do końca…' : '🔊 Dotknij „Przeczytaj mi”';
          return false;
        };
        bindFlips(card, check);
        if (!check()) { const iv = setInterval(() => { if (check()) clearInterval(iv); }, 200); timers.push(iv); }
        go.addEventListener('click', () => {
          if (!check()) return;
          sfx.tap(); passed.add(step);
          if (last) { state.seen[id] = true; save(); run(); } else { step++; render(); }
        });
        if ($('#prevTh')) $('#prevTh').addEventListener('click', () => { passed.add(step); step--; render(); });
        if ($('#skipTh')) $('#skipTh').addEventListener('click', run);
        $('#quitBtn').addEventListener('click', renderMap);
        window.scrollTo(0, 0);
        if (state.read) startRead();
      };
      render();
    }
    function openTheory() {
      stopSpeak();
      const th = THEORY[session.lvl.id];
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `<div class="modal-card"><div id="theoryM" style="display:flex;flex-direction:column;gap:12px">${th.steps.map(s => `<div class="th-card">${s}</div>`).join('')}</div>
        <button class="btn soft" data-say="#theoryM">🔊 Przeczytaj mi</button><button class="btn" id="closeTh" style="margin-top:0">Wracam do zadania →</button></div>`;
      m.querySelectorAll('.flip').forEach(f => f.classList.add('open'));
      m.querySelectorAll('.th-hint').forEach(f => f.remove());
      document.body.appendChild(m);
      bindFlips(m);
      const close = () => { stopSpeak(); m.remove(); };
      m.querySelector('#closeTh').addEventListener('click', close);
      m.addEventListener('click', e => { if (e.target === m) close(); });
    }

    function shell(bubble, opts = {}) {
      screen.innerHTML = `
        <section class="level">
          <div class="level-top">
            <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
            ${opts.hearts ? `<div class="hearts" id="hearts"></div><span style="flex:1"></span>` : '<div class="progress"><div class="progress-fill" id="progFill"></div></div>'}
            ${opts.theory ? '<button class="icon-btn" id="thBtn" aria-label="Przypomnij sobie teorię" title="Przypomnij sobie">📖</button>' : ''}
            <div class="level-badge">${session.lvl.icon}</div>
          </div>
          ${opts.noGuide ? '' : `<div class="guide"><div class="owl-mini" id="owl">${owlSVG()}</div><div class="bubble" id="bubble">${bubble}</div>${sayMini('#bubble')}</div>`}
          <div class="task" id="task"></div>
        </section>`;
      $('#quitBtn').addEventListener('click', () => { if (opts.hearts || confirm('Przerwać zadanie? Gwiazdki dostaniesz, gdy dojdziesz do końca.')) renderMap(); });
      if ($('#thBtn')) $('#thBtn').addEventListener('click', openTheory);
      window.scrollTo(0, 0);
    }
    function setProgress(frac) { const p = $('#progFill'); if (p) p.style.width = Math.round(frac * 100) + '%'; }
    function starsFor(mistakes, total) { const r = total ? mistakes / total : 0; return r <= 0.1 ? 3 : r <= 0.3 ? 2 : 1; }

    function finishLevel(stars, line) {
      stopGame(); stopSpeak();
      const prev = state.stars[session.lvl.id] || 0;
      state.stars[session.lvl.id] = Math.max(prev, stars);
      bumpStreak(); save();
      if (window.Odznaki) Odznaki.sprawdz();
      const tot = totalStars();
      const newReward = REWARDS.find(r => r.at > tot - (state.stars[session.lvl.id] - prev) && r.at <= tot);
      const nextIdx = session.idx + 1 < LEVELS.length ? session.idx + 1 : -1;
      document.body.classList.add('in-level');
      screen.innerHTML = `
        <section class="result">
          <div class="owl-big">${owlSVG(stars >= 2 ? 'happy' : '')}</div>
          <h2>${stars === 3 ? 'Rewelacja!' : stars === 2 ? 'Bardzo dobrze!' : 'Dobra robota!'}</h2>
          <p>${line}</p>
          <div class="result-stars">${[0, 1, 2].map(i => `<span class="rs ${i < stars ? 'on' : ''}" style="--d:${i * 0.15}s">★</span>`).join('')}</div>
          ${newReward ? `<div class="reward-pop"><span class="ic">${newReward.icon}</span><span>Sówka dostaje: <b>${newReward.name}</b>!</span></div>` : ''}
          ${stars < 3 ? '<p>Zagraj jeszcze raz po 3 ⭐ i odznakę 🏅</p>' : ''}
          <div class="result-actions">
            ${nextIdx > 0 ? '<button class="btn" id="nextBtn">Dalej: ' + LEVELS[nextIdx].icon + ' ' + LEVELS[nextIdx].name + ' →</button>' : ''}
            <button class="btn soft" id="againBtn">🔁 Jeszcze raz</button>
            <button class="btn soft" id="toMapBtn">🗺️ Mapa</button>
          </div>
        </section>`;
      $('#toMapBtn').addEventListener('click', renderMap);
      $('#againBtn').addEventListener('click', () => startLevel(session.idx, true));
      if (nextIdx > 0) $('#nextBtn').addEventListener('click', () => startLevel(nextIdx));
      sfx.win(); if (stars >= 2) confetti();
      window.scrollTo(0, 0);
    }

    /* =====================================================================
       GENEROWANIE ZADAŃ
       ===================================================================== */
    const T = {
      pos: () => { const [w, k] = pick(WORDS); return { type: 'choice', num: 'Jaka to część mowy?', q: w, big: true, fixed: true, pos: true, options: POS_ORDER.map(p => POS[p].name), a: POS[k].name, note: POS_NOTE[k](w) }; },
      posMany: n => shuffle(WORDS).slice(0, n).map(([w, k]) => ({ type: 'choice', num: 'Jaka to część mowy?', q: w, big: true, fixed: true, pos: true, options: POS_ORDER.map(p => POS[p].name), a: POS[k].name, note: POS_NOTE[k](w) })),
      tap: n => shuffle(SENTS).slice(0, n).map(s => {
        const kinds = POS_ORDER.filter(k => s.t.filter(x => x === k).length === 1);
        return { type: 'tap', s, k: pick(kinds) };
      }),
      order: n => shuffle(ORDER_SETS).slice(0, n).map(ws => ({ type: 'order', words: ws })),
      abcQ: n => shuffle(ABC_Q).slice(0, n).map(q => ({ type: 'choice', num: 'Pytanie', ...q })),
      zdania: n => shuffle(ZDANIA).slice(0, n).map(([s, k, note]) => ({ type: 'choice', num: 'Jakie to zdanie?', q: s, fixed: true, options: ['pojedyncze', 'złożone'], a: k === 'p' ? 'pojedyncze' : 'złożone', note, duo: true })),
      lacz: n => shuffle(LACZ).slice(0, n).map(t => ({ type: 'choice', num: 'Wybierz słowo, które połączy zdanie', s: t.s, options: t.options, a: t.a, note: t.note })),
      nie: n => shuffle(NIE).slice(0, n).map(t => ({ type: 'choice', num: 'Jak napiszesz?', s: t.s, options: t.options, a: t.a, note: t.note })),
      nieQ: n => NIE_Q.slice(0, n).map(t => ({ type: 'choice', num: 'Pytanie', ...t })),
      gap: (bank, n) => shuffle(bank).slice(0, n).map(it => ({ type: 'choice', num: 'Jaka literka?', q: gapHTML(it.w), big: true, fixed: true, duo: true, options: it.o, a: it.a, note: it.n, fill: true })),
      why: n => shuffle(RZ.filter(i => RZ_RULES[i.rule])).slice(0, n).map(it => ({ type: 'choice', num: 'Dlaczego rz?', q: `Dlaczego <b>${fullWord(it)}</b> piszemy przez <b>rz</b>?`, fixed: true, options: Object.values(RZ_RULES), a: RZ_RULES[it.rule], note: it.n })),
      pair: (key, n) => shuffle(PAIRS[key]).slice(0, n).map(([w, p]) => {
        const others = shuffle(PAIRS[key].filter(x => x[1] !== p)).slice(0, 2).map(x => x[1]);
        return { type: 'choice', num: 'Znajdź wyraz z rodziny', q: `Który wyraz podpowie, jak napisać <b>${w}</b>?<br><small style="color:var(--muted)">szukaj literki: ${PAIR_WHAT[key]}</small>`, options: [p, ...others], a: p, note: `<b>${w}</b> – <b>${p}</b>. To jedna rodzina wyrazów.` };
      })
    };
    function buildTasks(id) {
      switch (id) {
        case 'czesci': return [...T.posMany(7), ...T.tap(4)];
        case 'alfabet': return [...T.order(5), ...T.abcQ(3)];
        case 'zdania': return [...T.zdania(8), ...T.lacz(3)];
        case 'nie': return [...T.nie(7), ...T.nieQ(3)];
        case 'rz': return [...T.gap(RZ, 9), ...T.why(2), ...T.pair('rz', 1)];
        case 'z': return [...T.gap(Z, 9), ...T.pair('z', 3)];
        case 'ch': return [...T.gap(CH, 9), ...T.pair('ch', 3)];
        case 'boss': return [...T.posMany(2), ...T.tap(2), ...T.order(1), ...T.abcQ(1), ...T.zdania(2), ...T.nie(2), ...T.gap(RZ, 2), ...T.gap(Z, 2), ...T.gap(CH, 2)];
      }
      return [];
    }

    function startQueue() {
      const lvl = session.lvl;
      const tasks = buildTasks(lvl.id);
      session.queue = shuffle(tasks);
      session.total = session.queue.length;
      shell('', { theory: !!THEORY[lvl.id] && !lvl.boss });
      nextTask();
    }
    function nextTask() {
      if (!session.queue.length) return finishLevel(starsFor(session.mistakes, session.total), `Błędów: ${session.mistakes} na ${session.total} zadań.`);
      setProgress(session.solved / session.total);
      const t = session.queue.shift();
      ({ choice: renderChoice, tap: renderTap, order: renderOrder })[t.type](t);
      window.scrollTo(0, 0);
    }
    function answered(t, ok, noteHTML) {
      if (ok) { session.solved++; sfx.good(); }
      else { session.mistakes++; sfx.bad(); if (!t.again) session.queue.push({ ...t, again: true }); else session.solved++; }
      const wrap = $('#feedbackWrap');
      wrap.innerHTML = `${ok ? '' : '<div class="feedback-head bad">To zadanie wróci jeszcze na końcu 🔁</div>'}
        <div class="note">💡 ${noteHTML}</div>
        <button class="btn" id="nextQBtn">${session.queue.length ? 'Dalej →' : 'Zobacz wynik →'}</button>`;
      $('#nextQBtn').addEventListener('click', nextTask);
      later(() => $('#nextQBtn')?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
    }

    function renderChoice(t) {
      const letters = ['A', 'B', 'C', 'D'];
      const opts = t.fixed ? t.options.slice() : shuffle(t.options);
      const task = $('#task');
      const text = t.s ? t.s.replace('___', '<span class="blank" id="blank">&nbsp;?&nbsp;</span>') : t.q;
      const posKey = name => POS_ORDER.find(k => POS[k].name === name);
      task.innerHTML = `
        <div class="q-card">${sayMini('#qtext', '#qopts')}
          <div class="q-num">${t.num}</div>
          <div class="q-text ${t.big ? 'big' : ''}" id="qtext">${text}</div>
        </div>
        <div class="quiz-opts ${t.duo ? 'duo' : ''}" id="qopts">
          ${opts.map((o, i) => { const k = t.pos ? posKey(o) : null; return `<button class="quiz-opt" data-i="${i}" ${k ? `style="${tc(k).replace('--tc', '--oc')}"` : ''}>${t.duo ? '' : `<span class="letter">${letters[i]}</span>`}<span>${k ? POS[k].icon + ' ' : ''}${o}</span>${k ? `<span class="pq">${POS[k].q}</span>` : ''}</button>`; }).join('')}
        </div>
        <div id="feedbackWrap"></div>`;
      owlSay(t.pos ? 'Zadaj pytanie: kto? co? – co robi? – jaki? 🤔' : t.fill ? 'Jaką literkę wpiszesz w okienko? ✏️' : t.duo ? 'Policz czasowniki! 🔢' : t.s ? 'Wybierz, jak uzupełnić zdanie ✏️' : 'Przeczytaj i wybierz odpowiedź.');
      let done = false;
      task.querySelectorAll('.quiz-opt').forEach(btn => btn.addEventListener('click', () => {
        if (done) return; done = true;
        const ok = opts[+btn.dataset.i] === t.a;
        task.querySelectorAll('.quiz-opt').forEach(b => { b.disabled = true; if (opts[+b.dataset.i] === t.a) b.classList.add('ok'); else if (b === btn) b.classList.add('bad'); else b.classList.add('dim'); });
        const bl = $('#blank'); if (bl) { bl.textContent = t.a; bl.classList.add('filled'); }
        owlSay(ok ? pick(PRAISE) : 'Prawie! Zobacz, jak jest dobrze 💪', ok ? 'happy' : 'sad');
        answered(t, ok, t.note);
      }));
    }

    // dotknij wyrazu w zdaniu, który jest daną częścią mowy
    function renderTap(t) {
      const { s, k } = t, task = $('#task');
      task.innerHTML = `
        <div class="q-card">${sayMini('#qtext')}
          <div class="q-num">Dotknij wyrazu</div>
          <div class="q-text" id="qtext">Który wyraz to <span class="tag" style="${tc(k)}">${POS[k].name}</span>?<br><small style="color:var(--muted)">Pytanie: ${POS[k].q}</small></div>
        </div>
        <div class="sent">${s.w.map((w, i) => `<button class="wbtn" data-i="${i}" style="${tc(s.t[i])}">${w}<small>${POS[s.t[i]].name}</small></button>`).join('')}</div>
        <div id="feedbackWrap"></div>`;
      owlSay(`Szukaj wyrazu, który odpowiada na pytanie <b>${POS[k].q}</b> 🔎`);
      let done = false;
      task.querySelectorAll('.wbtn').forEach(b => b.addEventListener('click', () => {
        if (done) return; done = true;
        const i = +b.dataset.i, ok = s.t[i] === k;
        task.querySelectorAll('.wbtn').forEach(x => { x.disabled = true; if (s.t[+x.dataset.i] !== 'x') x.classList.add('tagged'); });
        b.classList.add(ok ? 'ok' : 'bad');
        const right = s.w[s.t.indexOf(k)].replace(/[.,!?]/g, '');
        owlSay(ok ? pick(PRAISE) : `Prawie! ${POS[k].name} to „${right}” 💪`, ok ? 'happy' : 'sad');
        answered(t, ok, `${POS[k].name}: <b>${right}</b>. Zobacz kolory: każdy wyraz ma teraz podpis.`);
      }));
    }

    // ułóż wyrazy alfabetycznie – dotykaj po kolei
    function renderOrder(t) {
      const sorted = t.words.slice().sort(COLL.compare);
      const task = $('#task');
      let pos = 0, err = false, finished = false;
      task.innerHTML = `
        <div class="q-card">${sayMini('#qtext')}
          <div class="q-num">Kolejność alfabetyczna</div>
          <div class="q-text" id="qtext">Dotykaj wyrazów <b>w kolejności alfabetycznej</b> – od pierwszego do ostatniego.</div>
        </div>
        <div class="order-row" id="orow"><span class="hint">tu ułożysz wyrazy 👇</span></div>
        <div class="sent">${shuffle(t.words).map(w => `<button class="wbtn" data-w="${w}">${w}</button>`).join('')}</div>
        <div id="feedbackWrap"></div>`;
      owlSay('Patrz na pierwszą literę. Takie same? Patrz na drugą! 🔤');
      task.querySelectorAll('.wbtn').forEach(b => b.addEventListener('click', () => {
        if (finished) return;
        const w = b.dataset.w;
        if (w === sorted[pos]) {
          sfx.tap(); b.classList.add('used');
          const row = $('#orow'); row.querySelector('.hint')?.remove();
          row.insertAdjacentHTML('beforeend', `<span class="placed"><i>${pos + 1}.</i>${w}</span>`);
          if (++pos === sorted.length) {
            finished = true;
            owlSay(err ? 'Ułożone! Następnym razem pójdzie gładko 💪' : pick(PRAISE), err ? '' : 'happy');
            answered(t, !err, `Kolejność: <b>${sorted.join(', ')}</b>.`);
          }
        } else {
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx.bad();
          err = true;
          const a = sorted[pos], cmp = w;
          let i = 0; while (i < a.length && a[i] === cmp[i]) i++;
          owlSay(`Hmm, jeszcze nie ten. Porównaj ${i + 1}. literę: „${a[i] || ''}” stoi w alfabecie przed „${cmp[i] || ''}”. 🤔`, 'sad');
        }
      }));
    }

    /* =====================================================================
       🎮 GRY ZRĘCZNOŚCIOWE
       ===================================================================== */
    function arcadeIntro(arena, title, text, onStart) {
      const ov = document.createElement('div'); ov.className = 'arcade-start';
      ov.innerHTML = `<div class="owl-mini" style="width:80px">${owlSVG('happy')}</div><h3>${title}</h3><p>${text}</p><button class="btn" id="goBtn">▶ Start!</button>`;
      arena.appendChild(ov);
      ov.querySelector('#goBtn').addEventListener('click', () => { ov.remove(); sfx.tap(); onStart(); });
    }
    function arcadeLose(arena, line) {
      stopGame(); sfx.lose();
      const ov = document.createElement('div'); ov.className = 'arcade-start';
      ov.innerHTML = `<div class="owl-mini" style="width:80px">${owlSVG('sad')}</div><h3>Ojej, koniec serduszek!</h3><p>${line}</p><button class="btn" id="againBtn">🔁 Jeszcze raz</button><button class="btn soft" id="mapBtn">🗺️ Mapa</button>`;
      arena.appendChild(ov);
      ov.querySelector('#againBtn').addEventListener('click', () => startLevel(session.idx));
      ov.querySelector('#mapBtn').addEventListener('click', renderMap);
    }
    function drawHearts(h) { $('#hearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < h ? '' : 'lost'}">❤️</span>`).join(''); }
    function floatText(arena, x, y, txt) {
      const f = document.createElement('div'); f.className = 'float-txt'; f.textContent = txt;
      f.style.left = x + 'px'; f.style.top = y + 'px'; arena.appendChild(f); setTimeout(() => f.remove(), 1100);
    }

    // 🧺 Łap wyrazy – koszykiem łapiemy tylko wskazaną część mowy
    function startCatch() {
      const GOAL = 12, PER_TARGET = 4;
      shell('', { hearts: true, noGuide: true });
      $('#task').innerHTML = `<div class="arena" id="arena"><span class="cloud" style="left:8%;top:18%">☁️</span><span class="cloud" style="right:10%;top:34%">☁️</span>
        <div class="target-pill" id="target"></div><div class="score-pill" id="score">0 / ${GOAL}</div><div class="basket" id="basket">🧺</div></div>`;
      const arena = $('#arena'), basket = $('#basket');
      let hearts = 3, score = 0, falling = [], spawnIn = 600, bx = 0, targets = shuffle(POS_ORDER), tIdx = 0, keyDir = 0;
      drawHearts(hearts);
      const target = () => targets[tIdx % targets.length];
      const showTarget = () => { const k = target(), tp = $('#target'); tp.setAttribute('style', tc(k)); tp.innerHTML = `Łap tylko: ${POS[k].icon} ${POS[k].many}`; };
      const placeBasket = () => { basket.style.left = (bx - 50) + 'px'; };
      const moveTo = x => { const r = arena.getBoundingClientRect(); bx = Math.max(50, Math.min(r.width - 50, x - r.left)); placeBasket(); };
      arena.addEventListener('pointerdown', e => moveTo(e.clientX));
      arena.addEventListener('pointermove', e => moveTo(e.clientX));
      keyHandler = e => { if (e.key === 'ArrowLeft') keyDir = -1; else if (e.key === 'ArrowRight') keyDir = 1; };
      const keyUp = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keyDir = 0; };
      document.addEventListener('keyup', keyUp);
      function spawn() {
        const W = arena.clientWidth, want = Math.random() < 0.55;
        const [w, k] = pick(WORDS.filter(x => want ? x[1] === target() : x[1] !== target()));
        const el = document.createElement('div'); el.className = 'faller'; el.textContent = w;
        arena.appendChild(el);
        const ew = el.offsetWidth, x = 8 + Math.random() * (W - ew - 16);
        el.style.left = x + 'px'; el.style.top = '-60px';
        falling.push({ w, k, el, x: x + ew / 2, y: -60, v: 0.07 + Math.min(0.05, score * 0.004) + Math.random() * 0.02 });
      }
      arcadeIntro(arena, '🧺 Łap wyrazy',
        `Przesuwaj koszyk palcem w lewo i w prawo. <b>Łap tylko tę część mowy, która jest napisana u góry</b> – co ${PER_TARGET} punkty się zmienia! Zły wyraz zabiera ❤️. Złap ${GOAL}!<br><small>Na komputerze: strzałki ← →.</small>`,
        () => {
          bx = arena.clientWidth / 2; placeBasket(); showTarget();
          gameLoop(dt => {
            const H = arena.clientHeight, W = arena.clientWidth;
            if (keyDir) { bx = Math.max(50, Math.min(W - 50, bx + keyDir * dt * 0.45)); placeBasket(); }
            spawnIn -= dt;
            if (spawnIn <= 0) { spawn(); spawnIn = Math.max(1000, 1800 - score * 60); }
            const basketTop = H - 78;
            for (const f of falling.slice()) {
              f.y += f.v * dt; f.el.style.top = f.y + 'px';
              const caught = f.y + 44 >= basketTop && f.y + 44 <= basketTop + 40 && Math.abs(f.x - bx) < 60;
              if (caught || f.y > H) {
                falling.splice(falling.indexOf(f), 1); f.el.remove();
                if (!caught) continue;
                if (f.k === target()) {
                  score++; sfx.good(); floatText(arena, bx - 20, basketTop - 30, '+1 ⭐');
                  $('#score').textContent = `${score} / ${GOAL}`;
                  if (score >= GOAL) { document.removeEventListener('keyup', keyUp); finishLevel(hearts, `Złapano ${GOAL} wyrazów! Zostało serduszek: ${hearts} ❤️`); return false; }
                  if (score % PER_TARGET === 0) { tIdx++; showTarget(); falling.forEach(o => o.el.remove()); falling = []; spawnIn = 1000; floatText(arena, 20, 60, `Teraz: ${POS[target()].many}!`); }
                } else {
                  hearts--; sfx.bad(); drawHearts(hearts);
                  floatText(arena, Math.max(10, bx - 90), basketTop - 40, `${f.w} – ${POS[f.k].name}`);
                  if (hearts <= 0) { document.removeEventListener('keyup', keyUp); arcadeLose(arena, `Złapano ${score} z ${GOAL}. Zanim złapiesz, zapytaj: kto? co? – co robi? – jaki?`); return false; }
                }
              }
            }
          });
        });
    }

    // 🌧️ Ortograficzny deszcz – wyraz z okienkiem spada, wybierz literki, zanim spadnie
    function startRain() {
      const GOAL = 14;
      shell('', { hearts: true, noGuide: true });
      $('#task').innerHTML = `<div class="arena rain" id="arena"><span class="cloud" style="left:4%;top:2%">🌧️</span><span class="cloud" style="right:6%;top:6%">🌧️</span>
        <div class="score-pill" id="score">0 / ${GOAL}</div><div class="rain-btns" id="rbtns"></div></div>`;
      const arena = $('#arena'), rb = $('#rbtns');
      let hearts = 3, score = 0, cur = null, busy = true, deck = [];
      drawHearts(hearts);
      const nextItem = () => { if (!deck.length) deck = shuffle([...RZ, ...Z, ...CH]); return deck.pop(); };
      function spawn() {
        const it = nextItem();
        const el = document.createElement('div'); el.className = 'faller drop'; el.innerHTML = gapHTML(it.w).replace(' id="blank"', '');
        arena.appendChild(el);
        el.style.left = Math.max(8, (arena.clientWidth - el.offsetWidth) / 2) + 'px'; el.style.top = '-70px';
        rb.innerHTML = shuffle(it.o).map(o => `<button data-o="${o}">${o}</button>`).join('');
        rb.querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); resolve(b.dataset.o); }));
        cur = { it, el, y: -70, dur: Math.max(4200, 8200 - score * 260) };
        busy = false;
      }
      function resolve(o) {
        if (busy || !cur) return;
        busy = true;
        const { it, el } = cur, ok = o === it.a;
        el.innerHTML = gapHTML(it.w, it.a);
        el.style.borderColor = ok ? '#4ade80' : '#f87171';
        if (ok) { score++; sfx.good(); floatText(arena, 20, cur.y + 60, '+1 ⭐'); $('#score').textContent = `${score} / ${GOAL}`; }
        else { hearts--; sfx.bad(); drawHearts(hearts); floatText(arena, 12, cur.y + 70, `Dobrze: ${fullWord(it)}`); }
        rb.innerHTML = '';
        later(() => {
          el.remove(); cur = null;
          if (hearts <= 0) return arcadeLose(arena, `Udało się ${score} z ${GOAL}. Przypomnij sobie reguły rz, ż i ch – i spróbuj jeszcze raz!`);
          if (score >= GOAL) return finishLevel(hearts, `Wszystkie ${GOAL} wyrazów napisane dobrze! Zostało serduszek: ${hearts} ❤️`);
          spawn();
        }, ok ? 600 : 1600);
      }
      keyHandler = e => { const b = rb.querySelectorAll('button')[['1', '2'].indexOf(e.key)]; if (b) resolve(b.dataset.o); };
      arcadeIntro(arena, '🌧️ Ortograficzny deszcz',
        `Z chmury spadają wyrazy z okienkiem. <b>Dotknij właściwych literek</b> na dole (rz, ż, sz, ch albo h), zanim wyraz spadnie! Masz 3 ❤️. Zbierz ${GOAL} punktów!<br><small>Na komputerze: klawisze 1 i 2.</small>`,
        () => {
          spawn();
          gameLoop(dt => {
            if (!cur || busy) return;
            const H = arena.clientHeight - 100;
            cur.y += dt * (H + 70) / cur.dur; cur.el.style.top = cur.y + 'px';
            if (cur.y > H - 50) resolve(null);
          });
        });
    }

    renderMap();
  </script>
</body>
</html>
