<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>My Bedroom – mój pokój z Sówką Lulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1e1b4b;
      --muted: #6b7280;
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --primary-soft: #ede9fe;
      --line: #ddd6fe;
      --good: #16a34a;
      --good-soft: #dcfce7;
      --bad: #dc2626;
      --bad-soft: #fee2e2;
      --gold: #facc15;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Nunito', system-ui, 'Segoe UI', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(196, 181, 253, 0.55), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(165, 180, 252, 0.5), transparent 35%),
        linear-gradient(180deg, #f5f3ff 0%, #e0e7ff 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
    button:disabled { cursor: default; }

    #app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }

    /* ---------- Górny pasek ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: rgba(245, 243, 255, 0.88);
      backdrop-filter: blur(10px);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 42px; padding: 8px 14px;
      border-radius: 999px; border: 2px solid var(--line);
      background: #fff; font-weight: 900; font-size: 1rem;
      text-decoration: none; color: var(--ink);
    }
    .pill.back { color: var(--primary); }
    .topbar .spacer { flex: 1; }
    .topbar .pill { white-space: nowrap; }
    @media (max-width: 400px) { .topbar .pill.streak { display: none; } }
    .bubble .say-mini { display: inline-grid; vertical-align: middle; width: 36px; height: 36px; font-size: 1rem; margin-left: 2px; }
    @media (max-width: 420px) { .topbar { gap: 6px; padding: 10px 10px; } .topbar .pill { padding: 8px 10px; } }
    body.in-level .topbar { display: none; }

    main { flex: 1; display: flex; flex-direction: column; padding: 0 16px 24px; }
    body.in-level main { padding-bottom: 0; }

    /* ---------- Sowa ---------- */
    .owl-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .owl-big { width: 130px; flex: none; animation: bob 3s ease-in-out infinite; }
    .owl-mini { width: 62px; flex: none; }
    .jump { animation: jump 0.6s ease; }
    .shake { animation: shake 0.45s ease; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

    .bubble {
      position: relative; flex: 1;
      background: #fff; border: 2px solid var(--line);
      border-radius: 20px; padding: 12px 14px;
      font-weight: 700; line-height: 1.4; font-size: 1rem;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.1);
    }
    .bubble::before {
      content: ''; position: absolute; left: -10px; top: 22px;
      border: 9px solid transparent; border-right-color: var(--line); border-left: 0;
    }
    .bubble::after {
      content: ''; position: absolute; left: -7px; top: 23px;
      border: 8px solid transparent; border-right-color: #fff; border-left: 0;
    }
    .bubble small { display: block; margin-top: 6px; color: var(--primary-dark); font-size: 0.9rem; }
    .pop { animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(0.94); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }

    /* ---------- Mapa ---------- */
    .hero { display: flex; align-items: center; gap: 14px; margin: 8px 0 14px; }
    .hero .bubble { font-size: 1.02rem; }

    .reward-bar {
      background: #fff; border: 2px solid var(--line); border-radius: 20px;
      padding: 12px 14px; font-weight: 800; font-size: 0.95rem;
    }
    .bar { height: 12px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #a78bfa, var(--primary)); border-radius: 999px; transition: width 0.6s ease; }

    .section-title { font-size: 1.3rem; font-weight: 900; margin: 24px 0 10px; }
    .muted { color: var(--muted); font-weight: 700; margin: -4px 0 12px; font-size: 0.95rem; }

    .path { display: flex; flex-direction: column; align-items: flex-start; }
    .path-dots { width: 4px; height: 18px; margin: 2px 0 2px 40px; border-left: 4px dotted #c4b5fd; }
    .node {
      position: relative;
      width: 84%; margin-left: calc(var(--off) * 8%);
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; text-align: left;
      background: #fff; border: 3px solid var(--line); border-radius: 22px;
      box-shadow: 0 6px 0 #ddd6fe;
      transition: transform 0.12s ease;
    }
    .node:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #ddd6fe; }
    .node-icon {
      width: 52px; height: 52px; flex: none; border-radius: 50%;
      display: grid; place-items: center; font-size: 1.6rem;
      background: var(--primary-soft);
    }
    .node-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .node-num { font-size: 0.75rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
    .node-name { font-size: 1.1rem; font-weight: 900; }
    .node-desc { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
    .node-stars { font-size: 1.1rem; color: var(--gold); letter-spacing: -1px; flex: none; text-shadow: 0 1px 0 #ca8a04; }
    .node-stars .off { color: #e5e7eb; text-shadow: none; }
    .node.done { border-color: #c4b5fd; }
    .node.current { border-color: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); animation: glow 1.8s ease-in-out infinite; }
    .node.current .node-icon { background: var(--primary); }
    .node.locked { opacity: 0.55; background: #f8fafc; box-shadow: 0 6px 0 #e5e7eb; border-color: #e5e7eb; }
    .node.locked .node-icon { background: #e5e7eb; }
    @keyframes glow { 0%, 100% { outline: 0 solid rgba(124, 58, 237, 0.25); } 50% { outline: 7px solid rgba(124, 58, 237, 0.15); } }
    .here {
      position: absolute; right: 10px; top: -13px;
      background: var(--gold); color: var(--ink); font-size: 0.75rem; font-weight: 900;
      padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 0 #ca8a04;
    }

    .words { display: flex; flex-direction: column; gap: 8px; }
    .word-row {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px;
    }
    .w-emoji { font-size: 1.4rem; width: 32px; text-align: center; }
    .w-text { flex: 1; min-width: 0; line-height: 1.2; }
    .w-en { font-weight: 900; font-size: 1.05rem; }
    .w-pl { font-weight: 700; color: var(--muted); font-size: 0.85rem; }
    .dots { display: flex; gap: 3px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: #e5e7eb; }
    .dots i.on { background: var(--good); }

    /* ---------- Przyciski ---------- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 58px; padding: 12px 18px;
      border: 0; border-radius: 18px;
      font-size: 1.2rem; font-weight: 900;
      background: var(--primary); color: #fff;
      box-shadow: 0 5px 0 var(--primary-dark);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
    .btn.soft { background: #fff; color: var(--primary); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
    .btn.green { background: #22c55e; box-shadow: 0 5px 0 #15803d; }
    .btn + .btn { margin-top: 12px; }
    .btn-review { margin-top: 18px; }
    .btn-audio {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: var(--primary); color: #fff; font-size: 1.8rem;
      box-shadow: 0 5px 0 var(--primary-dark);
    }
    .btn-audio:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }
    .btn-audio.slow { background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
    .btn-audio.sm { width: 48px; height: 48px; font-size: 1.3rem; }
    .btn-audio.xs { width: 38px; height: 38px; font-size: 1rem; box-shadow: 0 3px 0 var(--primary-dark); }
    .link-btn { background: none; border: 0; color: var(--primary); font-weight: 800; font-size: 0.95rem; padding: 8px; text-decoration: underline; }
    .credit { text-align: center; font-size: 0.72rem; color: #9ca3af; margin: 4px 0 0; }
    .link-btn.danger { color: #9ca3af; margin: 28px auto 0; display: block; font-size: 0.85rem; }

    /* ---------- Poziom ---------- */
    .level { flex: 1; display: flex; flex-direction: column; }
    .level-top { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
    .icon-btn {
      width: 44px; height: 44px; flex: none; border-radius: 50%;
      border: 2px solid var(--line); background: #fff; font-size: 1.2rem; font-weight: 900; color: var(--muted);
    }
    .progress { flex: 1; height: 16px; background: #fff; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4ade80, #16a34a); border-radius: 999px; transition: width 0.4s ease; }
    .level-badge { font-size: 1.6rem; }
    .guide { display: flex; align-items: flex-start; gap: 12px; margin: 4px 0 12px; }
    .task { flex: 1; display: flex; flex-direction: column; gap: 12px; }

    .prompt-card {
      background: #fff; border: 3px solid var(--line); border-radius: 24px;
      padding: 16px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .prompt-emoji { font-size: 2.6rem; line-height: 1; }
    .prompt-pl { font-size: 1.6rem; font-weight: 900; }
    .prompt-en { font-size: 1.9rem; font-weight: 900; color: var(--primary-dark); }
    .prompt-line { font-size: 1.25rem; font-weight: 800; }
    .prompt-sub { font-size: 0.95rem; font-weight: 700; color: var(--muted); }
    .audio-row { display: flex; gap: 16px; justify-content: center; margin: 4px 0; }
    .hint-text { font-weight: 800; font-size: 1.1rem; color: var(--muted); }

    /* karta nauki */
    .learn-card { padding: 20px 16px; gap: 8px; }
    .learn-card .count { font-size: 0.85rem; font-weight: 900; color: var(--muted); }
    .learn-card .big-emoji { font-size: 3.6rem; line-height: 1.1; }
    .word-en { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.02em; }
    .part-0 { color: var(--primary); }
    .part-1 { color: #db2777; }
    .part-2 { color: #0891b2; }
    .word-pl { font-size: 1.3rem; font-weight: 800; color: var(--muted); }
    .say-like { font-size: 0.95rem; font-weight: 700; color: var(--muted); }
    .tip {
      text-align: left; background: #fef9c3; border: 2px solid #fde68a; border-radius: 16px;
      padding: 10px 12px; font-weight: 700; line-height: 1.45; width: 100%;
    }

    /* wybór */
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt {
      min-height: 72px; padding: 10px; border-radius: 18px;
      border: 3px solid var(--line); background: #fff; font-size: 1.2rem; font-weight: 900;
      box-shadow: 0 5px 0 var(--line); word-break: break-word;
    }
    .opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
    .opt.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); box-shadow: 0 5px 0 var(--good); }
    .opt.bad { background: var(--bad-soft); border-color: #fca5a5; color: #b91c1c; box-shadow: none; opacity: 0.7; }

    /* pociąg */
    .train { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .wagon {
      min-height: 54px; border-radius: 12px; border: 3px dashed #c4b5fd; background: rgba(255, 255, 255, 0.6);
      display: grid; place-items: center; font-weight: 900; font-size: 0.82rem; padding: 4px; text-align: center;
    }
    .wagon.engine { border: 0; background: none; font-size: 2.2rem; }
    .wagon.full { border: 3px solid var(--good); background: var(--good-soft); color: #166534; animation: pop 0.3s ease; }
    .wagon.next { border-color: var(--primary); background: #fff; }
    .order-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .order-options .opt { min-height: 58px; font-size: 1.1rem; }

    /* sloty i klocki */
    .slots {
      display: grid; grid-template-columns: repeat(var(--n), minmax(0, 46px));
      gap: 5px; justify-content: center;
    }
    .slot {
      aspect-ratio: 5 / 6; border-radius: 10px; border: 3px solid var(--line); background: #fff;
      display: grid; place-items: center; padding: 0;
      font-size: clamp(1.1rem, 5.5vw, 1.6rem); font-weight: 900;
    }
    .slot.fixed { border-color: transparent; background: transparent; }
    .slot-break { grid-column: 1 / -1; height: 0; }
    .slot.gap { border-style: dashed; border-color: #a78bfa; background: #faf5ff; }
    .slot.gap.active { border-style: solid; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }
    .slot.filled { border-color: #a78bfa; }
    .slot.ghost { color: #c4b5fd; }
    .slot.locked, .slot.ok { border-color: var(--good); background: var(--good-soft); color: #166534; border-style: solid; }
    .slot.bad { border-color: var(--bad); background: var(--bad-soft); color: #b91c1c; border-style: solid; }
    .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
    .tile {
      width: 50px; height: 56px; border-radius: 12px; border: 0;
      background: #fde68a; box-shadow: 0 5px 0 #f59e0b;
      font-size: 1.6rem; font-weight: 900;
    }
    .tile:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #f59e0b; }
    .tile.used { visibility: hidden; }

    /* pisanie */
    .answer-box {
      min-height: 64px; border-radius: 18px; border: 3px solid var(--primary); background: #fff;
      display: flex; align-items: center; justify-content: center; padding: 8px 14px;
      font-size: 2rem; font-weight: 900; letter-spacing: 0.04em; word-break: break-all;
    }
    .answer-box.ok { border-color: var(--good); background: var(--good-soft); color: #166534; }
    .answer-box .placeholder { color: #c4b5fd; font-size: 1.1rem; letter-spacing: 0; font-weight: 800; }
    .caret { width: 3px; height: 1.9rem; background: var(--primary); margin-left: 2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .feedback { font-weight: 700; text-align: center; line-height: 1.45; }
    .feedback:empty { display: none; }
    .compare { font-size: 1.7rem; font-weight: 900; letter-spacing: 0.05em; }
    .c-ok { color: var(--good); }
    .c-bad { color: var(--bad); text-decoration: line-through; }
    .reveal { font-size: 2.1rem; font-weight: 900; background: #fff; border: 3px dashed var(--line); border-radius: 18px; padding: 6px 12px; }

    /* klawiatura */
    .kb {
      position: sticky; bottom: 0; margin: auto -16px 0;
      background: #e0e7ff; border-top: 2px solid #c7d2fe;
      border-radius: 20px 20px 0 0;
      padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
      user-select: none; -webkit-user-select: none;
    }
    .kb-row { display: flex; justify-content: center; gap: 5px; margin: 6px 0; }
    .k {
      flex: 1 1 0; max-width: 48px; height: 48px; padding: 0;
      border: 0; border-radius: 10px; background: #fff;
      font-size: 1.3rem; font-weight: 800; box-shadow: 0 3px 0 #a5b4fc;
    }
    .k:active, .k.pressed { transform: translateY(2px); box-shadow: 0 1px 0 #a5b4fc; background: #c7d2fe; }
    .kb.upper .k.letter { text-transform: uppercase; }
    .k.wide { flex: 1.5 1 0; max-width: 66px; background: #c7d2fe; }
    .kb.upper .k[data-k="shift"] { background: var(--primary); color: #fff; }
    .k.space { max-width: none; flex: 1.4 1 0; height: 54px; font-size: 1rem; background: #fff; }
    .k.enter { max-width: none; height: 54px; background: #22c55e; color: #fff; box-shadow: 0 4px 0 #15803d; font-size: 1.2rem; font-weight: 900; }

    /* ---------- Gry zręcznościowe ---------- */
    .arena-hud { display: flex; align-items: center; gap: 8px; }
    .lives { font-size: 1rem; letter-spacing: -2px; flex: none; }
    .score { flex: none; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; font-weight: 900; }
    .score:empty { display: none; }
    .arena-target {
      flex: 1; min-height: 54px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px;
      background: #fff; border: 3px solid var(--primary); border-radius: 16px; padding: 6px 10px;
      font-size: 1.1rem; font-weight: 800; text-align: center;
    }
    .spell { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.12em; }
    .spell .got { color: var(--good); }
    .spell .now { color: var(--primary); animation: blink 1s steps(1) infinite; }
    .arena {
      position: relative; flex: 1; min-height: 380px; margin-bottom: 12px;
      border-radius: 24px; overflow: hidden; border: 3px solid #bfdbfe;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 65%, #bbf7d0 100%);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .arena.sky { background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 60%, #e0f2fe 100%); }
    .ent { position: absolute; left: 0; top: 0; will-change: transform; }
    .player { width: 84px; pointer-events: none; }
    .basket { font-size: 2.3rem; text-align: center; margin-top: -26px; line-height: 1; }
    .drop {
      padding: 8px 12px; border-radius: 14px; background: #fff; border: 3px solid #a78bfa;
      font-weight: 900; font-size: 1.15rem; white-space: nowrap; box-shadow: 0 4px 0 #c4b5fd; pointer-events: none;
    }
    .balloon { width: 100px; height: 130px; cursor: pointer; }
    .bal {
      width: 100px; height: 112px; border-radius: 50% 50% 46% 46%;
      background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.55), transparent 32%), var(--c);
      display: grid; place-items: center; padding: 6px; color: #fff; font-weight: 900; font-size: 0.95rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); position: relative;
    }
    .bal::after { content: ''; position: absolute; left: 50%; bottom: -18px; width: 2px; height: 18px; background: #94a3b8; }
    .popped .bal { animation: popOut 0.3s ease forwards; }
    .wrong .bal { background: #9ca3af; animation: shake 0.45s ease; }
    @keyframes popOut { to { transform: scale(1.6); opacity: 0; } }
    .flyer { width: 64px; pointer-events: none; }
    .ball {
      width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 4px solid #f59e0b;
      display: grid; place-items: center; font-size: 1.9rem; font-weight: 900; box-shadow: 0 4px 0 #fbbf24; pointer-events: none;
    }
    .ball.got { background: var(--good-soft); border-color: var(--good); animation: popOut 0.35s ease forwards; }
    .ball.bad { background: var(--bad-soft); border-color: var(--bad); animation: popOut 0.35s ease forwards; }
    .ball.fade { opacity: 0.3; }
    .cloud { font-size: 2.6rem; opacity: 0.85; pointer-events: none; }
    .float-text { pointer-events: none; font-weight: 900; font-size: 1.3rem; color: var(--good); }
    .float-text span { display: block; animation: rise 0.9s ease forwards; }
    @keyframes rise { to { transform: translateY(-50px); opacity: 0; } }
    .arena-overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: rgba(30, 27, 75, 0.35); }
    .ov-card { background: #fff; border-radius: 22px; padding: 18px; text-align: center; max-width: 320px; box-shadow: 0 16px 40px rgba(30, 27, 75, 0.25); }
    .ov-title { font-size: 1.5rem; font-weight: 900; }
    .ov-card p { font-weight: 700; line-height: 1.45; color: #374151; }
    .node.arcade .node-icon { background: #ffedd5; }
    .node.arcade.current .node-icon { background: #f97316; }
    .node-num .game-tag { color: #ea580c; }

    /* ---------- Wynik ---------- */
    .result { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 24px; }
    .result .owl-big { width: 160px; }
    .result h2 { font-size: 2rem; margin: 6px 0 0; }
    .result-stars { display: flex; gap: 8px; font-size: 3.4rem; line-height: 1; }
    .rs { color: #e5e7eb; }

    /* =====================================================================

    const ITEMS = CONFIG.items;
    const LEVELS = [
      { id: 'learn', type: 'learn', icon: '📖', name: 'Poznaj słówka', desc: 'Posłuchaj i zapamiętaj' },

    const $ = (s, r = document) => r.querySelector(s);
    const screen = $('#screen');
    const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

    /* ---------- Stan i zapis ---------- */
    function defaultState() { return { stars: {}, mastery: {}, streak: { last: null, count: 0 }, sfx: true, read: true }; }
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(CONFIG.storageKey));
        if (s) return Object.assign(defaultState(), s);
      } catch (e) {}
      return defaultState();
    }
    function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {} }
    const state = loadState();

    const totalStars = () => LEVELS.reduce((s, l) => s + (state.stars[l.id] || 0), 0);
    const accessories = () => REWARDS.filter(r => totalStars() >= r.at).map(r => r.id);
    // odblokowany, gdy poprzedni (albo ten lub dalszy) ma gwiazdki – nowe poziomy nie blokują już zdobytych
    const unlocked = i => i === 0 || LEVELS.slice(i - 1).some(l => state.stars[l.id]);
    const mastery = it => state.mastery[it.en] || 0;
    function changeMastery(it, d) { state.mastery[it.en] = Math.max(0, Math.min(5, mastery(it) + d)); save(); }

    function dayStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); }
    function bumpStreak() {
      const t = dayStr(new Date()), s = state.streak;
      if (s.last === t) return;
      s.count = s.last === yesterdayStr() ? s.count + 1 : 1;
      s.last = t;
    }
    function currentStreak() {
      const s = state.streak;
      return s.last === dayStr(new Date()) || s.last === yesterdayStr() ? s.count : 0;
    }

    /* ---------- Narzędzia ---------- */
    function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const sample = (a, n) => shuffle(a).slice(0, n);
    const neighbor = (it, d) => ITEMS[(ITEMS.indexOf(it) + d + ITEMS.length) % ITEMS.length];
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const letters = n => n === 1 ? 'literę' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'litery' : 'liter';

    // losuje n słówek, częściej te, których dziecko jeszcze nie umie napisać
    function pickWeak(n) {
      const out = []; let pool = ITEMS.slice();
      while (out.length < n) {
        if (!pool.length) pool = ITEMS.slice();
        const w = pool.map(it => 6 - mastery(it));
        let r = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
        while (k < pool.length - 1 && r > w[k]) { r -= w[k]; k++; }
        out.push(pool.splice(k, 1)[0]);
      }
      return out;
    }

    // dwa słowa („toy chest”) – każde w swoim rzędzie kratek
    const cols = w => Math.max(...w.split(' ').map(p => p.length));
    function partsHTML(it) {
      return `<span lang="en">${it.parts ? it.parts.map((p, i) => `<span class="part-${i % 3}">${p}</span>`).join('') : it.en}</span>`;
    }

    // które litery z odpowiedzi dziecka pasują do słowa (najdłuższy wspólny podciąg)
    function lcsMatched(a, b) {
      a = a.toLowerCase(); b = b.toLowerCase();
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = a.length - 1; i >= 0; i--)
        for (let j = b.length - 1; j >= 0; j--)
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const set = new Set(); let i = 0, j = 0;
      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { set.add(i); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
      }
      return set;
    }

    /* ---------- Dźwięk i czytanie na głos ----------
       Polskie polecenia czyta polski głos, a wszystko w <e>…</e> (albo lang="en")
       – angielski: nagranie lektora, gdy jest, inaczej brytyjski głos urządzenia. */
    // 1) nagrania lektora (mp3 w CONFIG.audioDir) – brzmią naturalnie na każdym urządzeniu
    const AUDIO = {};
    if (CONFIG.audioDir) (CONFIG.audioWords || ITEMS.map(it => it.en)).forEach(w => {
      const a = new Audio(CONFIG.audioDir + w.toLowerCase() + '.mp3');
      a.preload = 'auto';
      a.addEventListener('error', () => { delete AUDIO[w.toLowerCase()]; });
      AUDIO[w.toLowerCase()] = a;
    });
    let playing = null, sayBtn = null, speakToken = 0;

    // 2) głosy syntezatora: angielski (najlepiej brytyjski) i polski
    let voice = null, plVoice = null;
    function pickVoice() {
      if (!hasTTS) return;
      const all = speechSynthesis.getVoices();
      const en = all.filter(v => /^en/i.test(v.lang));
      const good = v => /google|natural|online|siri|enhanced|premium|neural|libby|sonia|serena|daniel/i.test(v.name);
      voice = en.find(v => /GB/i.test(v.lang) && good(v)) || en.find(v => /GB/i.test(v.lang))
        || en.find(good) || en.find(v => /US/i.test(v.lang)) || en[0] || null;
      const pl = all.filter(v => /^pl/i.test(v.lang));
      plVoice = pl.find(v => /Google|Natural|Online|Neural|Siri|Zosia|Ewa/i.test(v.name)) || pl.find(v => /Paulina|Zofia|Marek/i.test(v.name)) || pl[0] || null;
    }
    if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

    function markSaying(btn) {
      if (sayBtn) sayBtn.classList.remove('on');
      sayBtn = btn || null;
      if (sayBtn) sayBtn.classList.add('on');
    }
    function stopSpeak() {
      speakToken++;
      try { if (hasTTS) speechSynthesis.cancel(); } catch (e) {}
      try { if (playing) playing.pause(); } catch (e) {}
      markSaying(null);
    }
    // jedna wypowiedź; Promise kończy się, gdy głos skończy mówić
    function ttsPromise(text, lang, slow) {
      return new Promise(res => {
        if (!hasTTS) return res();
        const v = lang === 'en' ? voice : plVoice;
        if (lang === 'en' && !v) return res();   // bez angielskiego głosu milczymy, zamiast czytać po polsku
        try {
          const u = new SpeechSynthesisUtterance(text);
          if (v) u.voice = v;
          u.lang = v ? v.lang : (lang === 'en' ? 'en-GB' : 'pl-PL');
          u.rate = lang === 'en' ? (slow ? 0.55 : 0.85) : 0.95;
          u.pitch = lang === 'en' ? 1 : 1.1;
          const t = setTimeout(res, 2500 + text.length * 120);
          u.onend = u.onerror = () => { clearTimeout(t); res(); };
          speechSynthesis.speak(u);
        } catch (e) { res(); }
      });
    }
    const audioKey = text => text.toLowerCase().replace(/[^a-z' ]/g, '').trim();
    function enPromise(text, slow) {
      const a = AUDIO[audioKey(text)];
      if (!a) return ttsPromise(text, 'en', slow);
      return new Promise(res => {
        try {
          a.currentTime = 0;
          a.playbackRate = slow ? 0.7 : 1;
          a.preservesPitch = true;
          playing = a;
          const t = setTimeout(res, 4000);
          a.onended = () => { clearTimeout(t); res(); };
          const p = a.play();
          if (p && p.catch) p.catch(() => { clearTimeout(t); ttsPromise(text, 'en', slow).then(res); });
        } catch (e) { ttsPromise(text, 'en', slow).then(res); }
      });
    }
    // angielskie słowo lub zdanie (przyciski 🔊, poprawne odpowiedzi)
    function say(text, slow = false) {
      stopSpeak();
      enPromise(text, slow);
    }

    // HTML → lista kawałków [{lang, text}] do przeczytania po kolei
    function segments(html) {
      const d = document.createElement('div');
      d.innerHTML = String(html).replace(/_{3,}/g, ' … ');
      d.querySelectorAll('.no-read, svg, button, .credit, .count').forEach(x => x.remove());
      d.querySelectorAll('.blank:not(.filled)').forEach(x => { x.textContent = ' … '; });
      d.querySelectorAll('h2, h3, p, li, .th-tip, .opt, .prompt-line, .prompt-sub, .word-pl, .say-like, .tip, .th-grid div, small').forEach(x =>
        x.append(/[.!?:…]\s*$/.test(x.textContent) ? ' ' : '. '));
      d.querySelectorAll('e, [lang="en"]').forEach(x => x.replaceWith('\u0001' + x.textContent + '\u0002'));
      const txt = d.textContent
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu, ' ')
        .replace(/→|←|↓|↑|✕|✓|➜/g, ' ').replace(/=/g, ' – ').replace(/[„”"]/g, '');
      const out = [];
      txt.split(/(\u0001[^\u0002]*\u0002)/).forEach(part => {
        const en = part.startsWith('\u0001');
        const text = part.replace(/[\u0001\u0002]/g, '').replace(/\s+/g, ' ').replace(/(\s*\.\s*){2,}/g, '. ').trim();
        if (/[\p{L}\d]/u.test(text)) out.push({ lang: en ? 'en' : 'pl', text: en ? text.replace(/’/g, "'") : text });
      });
      return out;
    }
    async function speakSegs(list, btn) {
      stopSpeak();
      const my = speakToken;
      markSaying(btn);
      for (const s of list) {
        if (my !== speakToken) return;
        await (s.lang === 'en' ? enPromise(s.text) : ttsPromise(s.text, 'pl'));
      }
      if (my === speakToken) markSaying(null);
    }
    const speakHTML = (html, btn) => speakSegs(segments(html), btn);
    const autoSay = html => { if (state.read) speakHTML(html); };   // tylko teoria i karty „poznaj” – pytań nie czytamy sami
    // przycisk 🔊 z data-read = selektor elementu do przeczytania; drugie dotknięcie zatrzymuje
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-read]');
      if (!b) return;
      if (sayBtn === b) { stopSpeak(); return; }
      const el = document.querySelector(b.dataset.read);
      if (el) speakHTML(el.innerHTML, b);
    });
    const sayMini = sel => `<button class="say-mini" data-read="${sel}" aria-label="Przeczytaj na głos">🔊</button>`;

    let actx = null;
    function tone(freqs, dur = 0.1, type = 'sine', vol = 0.15) {
      if (!state.sfx) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = actx.currentTime;
        freqs.forEach((f, i) => {
          const o = actx.createOscillator(), g = actx.createGain(), st = t0 + i * dur;
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0, st);
          g.gain.linearRampToValueAtTime(vol, st + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, st + dur * 1.6);
          o.connect(g).connect(actx.destination);
          o.start(st); o.stop(st + dur * 1.7);
        });
      } catch (e) {}
    }
    const sfx = {
      good: () => tone([660, 990], 0.09),
      bad: () => tone([240, 180], 0.12, 'triangle'),
      tap: () => tone([520], 0.04, 'sine', 0.07),
      win: () => tone([523, 659, 784, 1047], 0.12)
    };
