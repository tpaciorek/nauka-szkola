        ${eyes}
        <polygon points="54,73 66,73 60,84" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
        <ellipse cx="47" cy="126" rx="8" ry="4.5" fill="#f59e0b"/><ellipse cx="73" cy="126" rx="8" ry="4.5" fill="#f59e0b"/>
        ${scarf}${glasses}${hat}${crown}
      </svg>`;
    }

    function owlSay(html, mood) {
      const b = $('#bubble');
      if (b) { b.innerHTML = html; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
      const o = $('#owl');
      if (o) {
        o.innerHTML = owlSVG(mood);
        o.classList.remove('jump', 'shake'); void o.offsetWidth;
        if (mood === 'happy') o.classList.add('jump');
        if (mood === 'sad') o.classList.add('shake');
      }
    }
    function shakeEl(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

    function confetti() {
      const colors = ['#7c3aed', '#facc15', '#22c55e', '#ec4899', '#38bdf8', '#f97316'];
      for (let i = 0; i < 45; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = pick(colors);
        c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
        c.style.animationDelay = Math.random() * 0.4 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3800);
      }
    }

    /* ---------- Klawiatura ekranowa ---------- */
    let kbHandler = null, shiftOn = false;
    function keyboardHTML() {
      const row = s => [...s].map(k => `<button class="k letter" data-k="${k}">${k}</button>`).join('');
      return `<div class="kb" id="kb">
        <div class="kb-row">${row('qwertyuiop')}</div>
        <div class="kb-row">${row('asdfghjkl')}</div>
        <div class="kb-row"><button class="k wide" data-k="shift" aria-label="Wielka litera">⇧</button>${row('zxcvbnm')}<button class="k wide" data-k="back" aria-label="Usuń literę">⌫</button></div>
        <div class="kb-row">${ITEMS.some(it => it.en.includes(' ')) ? '<button class="k space" data-k="space" aria-label="Spacja">spacja</button>' : ''}<button class="k enter" data-k="enter">Sprawdź ✓</button></div>
      </div>`;
    }
    function setShift(v) { shiftOn = v; const kb = $('#kb'); if (kb) kb.classList.toggle('upper', v); }
    function handleKey(k, virtual) {
      if (!kbHandler) return;
      if (k === 'shift') { setShift(!shiftOn); return; }
      if (k === 'back') kbHandler.back();
      else if (k === 'enter') kbHandler.enter();
      else if (k === 'space') { kbHandler.type(' '); sfx.tap(); }
      else {
        kbHandler.type(virtual && shiftOn ? k.toUpperCase() : k);
        if (virtual) setShift(false);
        sfx.tap();
      }
      if (kbHandler && kbHandler.refresh) kbHandler.refresh();
    }
    document.addEventListener('keydown', e => {
      if (!kbHandler || e.ctrlKey || e.metaKey || e.altKey) return;
      let k = null;
      if (/^[a-zA-Z]$/.test(e.key)) k = e.key;
      else if (e.key === 'Backspace') k = 'back';
      else if (e.key === 'Enter') k = 'enter';
      else if (e.key === ' ') k = 'space';
      if (!k) return;
      e.preventDefault();
      const btn = $(`.k[data-k="${k.length === 1 ? k.toLowerCase() : k}"]`);
      if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 120); }
      handleKey(k, false);
    });

    document.addEventListener('click', e => {
      const key = e.target.closest('.k');
      if (key) { handleKey(key.dataset.k, true); return; }
      const s = e.target.closest('[data-say]');
      if (s) say(s.dataset.say);
      const slow = e.target.closest('[data-say-slow]');
      if (slow) say(slow.dataset.saySlow, true);
    });

    /* ---------- Górny pasek ---------- */
    function updateTopbar() {
      $('#starCount').textContent = totalStars();
      $('#streakCount').textContent = currentStreak();
      $('#sfxBtn').textContent = state.sfx ? '🔔' : '🔕';
      $('#readBtn').textContent = state.read ? '🗣️' : '🤐';
      $('#readBtn').title = state.read ? 'Sówka czyta na głos' : 'Czytanie wyłączone';
    }
    $('#readBtn').addEventListener('click', () => {
      state.read = !state.read; save(); updateTopbar();
      if (state.read) speakSegs([{ lang: 'pl', text: 'Hu hu! Będę czytać na głos.' }]); else stopSpeak();
    });
    $('#sfxBtn').addEventListener('click', () => { state.sfx = !state.sfx; save(); updateTopbar(); });

    /* =====================================================================
       MAPA
       ===================================================================== */
    function renderMap() {
      kbHandler = null; arcadeOn = false; stopSpeak();
      document.body.classList.remove('in-level');
      updateTopbar();
      const tot = totalStars();
      const next = REWARDS.find(r => tot < r.at);
      const prevAt = [...REWARDS].reverse().find(r => tot >= r.at)?.at || 0;
      const pct = next ? Math.round((tot - prevAt) / (next.at - prevAt) * 100) : 100;
      const cur = LEVELS.findIndex((l, i) => unlocked(i) && !state.stars[l.id]);
      const known = ITEMS.filter(it => mastery(it) >= 4).length;

      let greet;
      if (tot === 0) greet = CONFIG.intro;
      else if (tot === MAX_STARS) greet = `Hoot hoot! Masz <b>wszystkie gwiazdki</b>! 🏆 Graj w powtórkę, żeby nie zapomnieć słówek.`;
      else if (cur >= 0) greet = `Witaj z powrotem! Dziś czeka na Ciebie <b>poziom ${cur + 1}: ${LEVELS[cur].en ? `<e>${LEVELS[cur].name}</e>` : LEVELS[cur].name}</b>. Dasz radę! 💪`;
      else greet = `Wszystkie poziomy odblokowane! Zagraj jeszcze raz tam, gdzie brakuje Ci gwiazdek ⭐.`;

      const node = (l, i) => {
        const s = state.stars[l.id] || 0, un = unlocked(i);
        const cls = (!un ? 'locked' : i === cur ? 'current' : s ? 'done' : '') + (l.arcade ? ' arcade' : '');
        return `<button class="node ${cls}" data-level="${i}" ${un ? '' : 'disabled'} style="--off:${[0, 1, 2, 1][i % 4]}">
          <span class="node-icon">${un ? l.icon : '🔒'}</span>
          <span class="node-body"><span class="node-num">Poziom ${i + 1}${l.arcade ? ' <span class="game-tag">• 🎮 gra</span>' : ''}</span><span class="node-name">${l.name}</span><span class="node-desc">${l.desc}</span></span>
          <span class="node-stars">${'★'.repeat(s)}<span class="off">${'★'.repeat(3 - s)}</span></span>
          ${i === cur ? '<span class="here">🦉 Tu jesteś!</span>' : ''}
        </button>`;
      };

      screen.innerHTML = `
        <section class="hero">
          <div class="owl-big">${owlSVG(tot === MAX_STARS ? 'happy' : '')}</div>
          <div class="bubble" id="mapBubble">${greet} ${sayMini('#mapBubble')}</div>
        </section>
        <div class="reward-bar">
          ${next ? `🎁 Następna nagroda dla Sówki: ${next.icon} <b>${next.name}</b> – jeszcze ${next.at - tot} ⭐` : '👑 Sówka ma już wszystkie nagrody!'}
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
        <h2 class="section-title">🗺️ Mapa przygody</h2>
        <div class="path">${LEVELS.map(node).join('<div class="path-dots"></div>')}</div>
        ${state.stars.write ? '<button class="btn soft btn-review" id="reviewBtn">🔁 Szybka powtórka (2 minuty)</button>' : ''}
        <h2 class="section-title">📒 Moje słówka</h2>
        <p class="muted">Zielone kropki pokazują, jak dobrze umiesz <b>napisać</b> słówko. Umiesz już: ${known} z ${ITEMS.length}.</p>
        <div class="words">${ITEMS.map(it => `
          <div class="word-row">
            <span class="w-emoji">${it.emoji}</span>
            <span class="w-text"><div class="w-en" lang="en">${it.en}</div><div class="w-pl">${it.pl}</div></span>
            <span class="dots">${[1, 2, 3, 4, 5].map(n => `<i class="${mastery(it) >= n ? 'on' : ''}"></i>`).join('')}</span>
            <button class="btn-audio xs" data-say="${it.en}" aria-label="Posłuchaj: ${it.en}">🔊</button>
          </div>`).join('')}
        </div>
        <button class="link-btn danger" id="resetBtn">Zacznij od nowa (dla rodzica)</button>
        ${CONFIG.audioCredit ? `<p class="credit">${CONFIG.audioCredit}</p>` : ''}`;

      screen.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => startLevel(+b.dataset.level)));
      $('#reviewBtn')?.addEventListener('click', () => startLevel(-1));
      $('#resetBtn').addEventListener('click', () => {
        if (confirm('Usunąć wszystkie gwiazdki i postępy w tej grze?')) {
          try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
          location.reload();
        }
      });
      window.scrollTo(0, 0);
    }

    /* =====================================================================
       POZIOMY
       ===================================================================== */
    let session = null;
    const REVIEW = { id: 'review', type: 'review', icon: '🔁', name: 'Szybka powtórka' };

    /* ---------- Scenki i zdania ---------- */
    const cap = s => s[0].toUpperCase() + s.slice(1);
    const scene = sc => ({ o: OBJ[sc[0]], f: FURN[sc[1]], p: sc[2], key: sc.join('-') });
    const qText = o => o.many ? `Where are the ${o.en}?` : `Where’s the ${o.en}?`;
    const aText = (o, f, p) => `${o.many ? 'They’re' : 'It’s'} ${PREP[p].en} the ${f.en}.`;
    const plWhere = (o, f, p) => `${cap(o.pl)} ${o.many ? 'są' : 'jest'} ${f.pl[p]}.`;
    const plQ = o => `Gdzie ${o.many ? 'są' : 'jest'} ${o.pl}?`;
    const words = s => s.replace(/[.?!]$/, '').split(' ');
    // przedmiot: emoji (dwa razy, gdy jest ich dużo) albo rysunek
    function drawObj(o, x, y, size) {
      const one = (e, cx, sz) => o.svg
        ? `<svg x="${cx - sz / 2}" y="${y - sz}" width="${sz}" height="${sz}" viewBox="0 0 64 64">${o.svg}</svg>`
        : `<text x="${cx}" y="${y - sz * 0.1}" font-size="${sz}" text-anchor="middle">${e}</text>`;
      if (!o.many) return one(o.e, x, size);
      const e2 = Array.isArray(o.e) ? o.e : [o.e, o.e], s2 = size * 0.82;
      return one(e2[0], x - s2 * 0.42, s2) + one(e2[1], x + s2 * 0.42, s2);
    }
    function sceneSVG(objKey, refKey, prep, cls = 'scene') {
      const f = FURN[refKey], o = OBJ[objKey];
      const [x, y, size] = f[prep];
      // kadr: mebel + wszystkie miejsca, gdzie może stać przedmiot (żeby scenka była duża)
      const pts = PREPS.filter(p => f[p]).map(p => f[p]);
      const x0 = Math.max(0, Math.min(f.box[0], ...pts.map(q => q[0] - q[2])) - 12);
      const x1 = Math.min(300, Math.max(f.box[0] + f.box[2], ...pts.map(q => q[0] + q[2])) + 12);
      const y0 = Math.min(110, Math.max(0, Math.min(f.box[1], ...pts.map(q => q[1] - q[2])) - 10));
      return `<svg class="${cls}" viewBox="${x0} ${y0} ${x1 - x0} ${200 - y0}" aria-hidden="true">
        <rect width="300" height="186" fill="#fef3c7"/><rect y="185" width="300" height="15" fill="#e7c9a0"/><path d="M0 185 h300" stroke="#c08a52" stroke-width="2"/>
        ${f.svg}${prep === 'in' ? drawObj(o, x, y, size) + (f.front || '') : (f.front || '') + drawObj(o, x, y, size)}</svg>`;
    }
    const objIcon = o => `<svg class="ico" viewBox="0 0 80 64" aria-hidden="true">${drawObj(o, 40, 60, 54)}</svg>`;
    const scenesFor = p => SCENES.filter(s => s[2] === p);
    // n scenek – po równo z każdym przyimkiem
    const mixScenes = n => shuffle(PREPS.flatMap(p => sample(scenesFor(p), Math.ceil(n / 4)))).slice(0, n).map(scene);
    function buildTask(sc, what) {
      const { o, f, p } = sc;
      if (what === 'q') return { kind: 'build', key: 'bq' + sc.key, sc, words: words(qText(o)), end: '?', extra: [o.many ? 'Where’s' : 'are'],
        promptHTML: `${sceneSVG(...sc.key.split('-'))}<div class="prompt-line">Ułóż pytanie: <b>${plQ(o)}</b></div>`, ask: 'Ułóż pytanie po angielsku – dotykaj słówek po kolei.' };
      return { kind: 'build', key: 'ba' + sc.key, sc, words: words(aText(o, f, p)), end: '.',
        extra: [o.many ? 'It’s' : 'They’re', PREP[pick(PREPS.filter(x => x !== p))].en.split(' ')[0]],
        promptHTML: `${sceneSVG(...sc.key.split('-'))}<div class="q-row"><span class="q-en" lang="en">${qText(o)}</span><button class="btn-audio sm" data-say="${qText(o)}" aria-label="Posłuchaj pytania">🔊</button></div>`,
        ask: 'Popatrz na obrazek i ułóż odpowiedź po angielsku.' };
    }
    const phraseBuild = ph => ({ kind: 'build', key: 'bp' + ph.en, words: words(ph.en), end: ph.en.slice(-1),
      promptHTML: `<div class="prompt-emoji">${ph.e}</div><div class="prompt-pl">${ph.pl}</div>`, ask: 'Ułóż to po angielsku ze słówek!' });

    function buildTasks(lvl) {
      const all = shuffle(ITEMS);
      const gaps = it => it.tricky || sample([...Array(it.en.length).keys()].slice(1).filter(i => it.en[i] !== ' '), 2).sort((a, b) => a - b);
      switch (lvl.type) {
        case 'learn': return ITEMS.map((it, i) => ({ kind: 'card', item: it, first: i === 0 }));
        case 'choose': return [
          ...all.map((it, i) => ({ kind: 'choose', item: it, dir: i % 2 ? 'en2pl' : 'pl2en' })),
          ...pickWeak(3).map(it => ({ kind: 'choose', item: it, dir: 'pl2en' }))];
        case 'catch': return [{ kind: 'catch', weight: 8 }];
        case 'balloons': return [{ kind: 'balloons', weight: 8 }];
        case 'fly': return [{ kind: 'fly', weight: 10 }];
        case 'tiles': return pickWeak(10).map((it, i) => ({ kind: 'tiles', item: it, first: i === 0 }));
        case 'gaps': return pickWeak(10).map((it, i) => ({ kind: 'gaps', item: it, hidden: gaps(it), first: i === 0 }));
        case 'write': return pickWeak(12).map(it => ({ kind: 'write', item: it, prompt: 'pl' }));
        case 'dictation': return pickWeak(10).map(it => ({ kind: 'write', item: it, prompt: 'audio' }));
        case 'prep': return mixScenes(12).map(sc => ({ kind: 'prep', key: 'p' + sc.key, sc }));
        case 'where': {
          const t = mixScenes(8).map(sc => ({ kind: 'where', key: 'w' + sc.key, sc }));
          const objs = sample(Object.values(OBJ).filter(o => o.many), 2).concat(sample(Object.values(OBJ).filter(o => !o.many), 2));
          const ia = shuffle(objs).map((o, i) => ({ kind: 'isare', key: 'ia' + o.en + i % 2, o, mode: i % 2 ? 'a' : 'q' }));
          return [ia[0], ia[1], ...t.slice(0, 3), ia[2], ...t.slice(3, 6), ia[3], ...t.slice(6)];
        }
        case 'build': return mixScenes(8).map((sc, i) => buildTask(sc, i % 2 ? 'a' : 'q'));
        case 'phrase': {
          const b = ['Have a nice day!', 'See you later.', 'It’s time for school!'].map(en => phraseBuild(PHRASES.find(p => p.en === en.replace('’', "'")) || PHRASES[0]));
          return [...shuffle(PHRASES).map(ph => ({ kind: 'phrase', key: 'ph' + ph.en, ph })), ...b];
        }
        case 'boss': return shuffle([
          ...pickWeak(6).map((it, i) => ({ kind: 'write', item: it, prompt: i % 3 === 2 ? 'audio' : 'pl' })),
          ...mixScenes(4).map((sc, i) => i < 2 ? { kind: 'where', key: 'w' + sc.key, sc } : i === 2 ? { kind: 'prep', key: 'p' + sc.key, sc } : buildTask(sc, 'a')),
          buildTask(scene(pick(SCENES)), 'q'),
          { kind: 'phrase', key: 'phb', ph: pick(PHRASES) }]);
        case 'review': return pickWeak(8).map((it, i) => ({ kind: 'write', item: it, prompt: i % 2 ? 'audio' : 'pl' }));
      }
    }

    /* ---------- „Przypomnij sobie” – teoria przed poziomami z nową wiedzą ---------- */
    const prepRow = (p, ref) => {
      const o = OBJ.ball, f = FURN[ref];
      return `<div class="th-row" style="--lc:${PREP[p].color}">${sceneSVG('ball', ref, p, 'scene sm')}
        <div><h3><e>${PREP[p].en}</e> = ${PREP[p].pl}</h3><p><e>The ball is ${PREP[p].en} the ${f.en}.</e></p><p>${plWhere(o, f, p)}</p></div></div>`;
    };
    const THEORY = {
      learn: () => ({ title: 'Mój pokój – My Bedroom', html: `
        <p class="th-p">Na sprawdzianie będą nazwy rzeczy w pokoju. Oto wszystkie słówka – za chwilę poznasz je po kolei, z wymową.</p>
        <div class="th-grid">${ITEMS.map(it => `<div>${it.emoji} <e>${it.en}</e><br><small class="no-read">${it.pl}</small></div>`).join('')}</div>
        <div class="th-tip">🦉 Sztuczka Sówki: mów każde słówko na głos i pokaż palcem tę rzecz w swoim pokoju! Tak zapamiętasz najszybciej.</div>` }),
      prep: () => ({ title: 'Gdzie to jest? in, on, under, next to', html: `
        <p class="th-p">Żeby powiedzieć, <b>gdzie coś leży</b>, używamy małych słówek. Popatrz, gdzie jest piłka ⚽.</p>
        ${prepRow('in', 'box')}${prepRow('on', 'box')}${prepRow('under', 'desk')}${prepRow('next', 'box')}
        <div class="th-tip">🦉 Sztuczka Sówki: <e>next to</e> to dwa słowa, a znaczą jedno – obok. <e>under</e> czytamy „ander”, a <e>on</e> to nie „on”, tylko „na”!</div>` }),
      where: () => ({ title: 'Where’s…? Where are…?', html: `
        <div class="th-row" style="--lc:#8b5cf6">${sceneSVG('clock', 'bookshelf', 'on', 'scene sm')}
          <div><h3>Jedna rzecz</h3><p>Pytamy: <e>Where’s the clock?</e></p><p>Odpowiadamy: <e>It’s on the bookshelf.</e></p><p>Gdzie jest zegar? Jest na półce.</p></div></div>
        <div class="th-row" style="--lc:#f97316">${sceneSVG('books', 'bed', 'on', 'scene sm')}
          <div><h3>Dużo rzeczy</h3><p>Pytamy: <e>Where are the books?</e></p><p>Odpowiadamy: <e>They’re on the bed.</e></p><p>Gdzie są książki? Są na łóżku.</p></div></div>
        <p class="th-p"><e>Where’s</e> to skrót od <e>Where is</e>, <e>It’s</e> – od <e>It is</e>, a <e>They’re</e> – od <e>They are</e>.</p>
        <div class="th-tip">🦉 Sztuczka Sówki: po polsku „jest” – po angielsku <e>is</e> i <e>It’s</e>. Po polsku „są” – po angielsku <e>are</e> i <e>They’re</e>. Słowo z <b>s</b> na końcu, jak <e>books</e>, <e>shoes</e>, <e>pens</e>, to dużo rzeczy!</div>` }),
      phrase: () => ({ title: 'Everyday English – zwroty na co dzień', html: `
        <p class="th-p">Z historyjki <e>Time for School!</e> – tak mówimy codziennie:</p>
        ${PHRASES.map(ph => `<div class="th-row" style="--lc:#0ea5e9"><div><h3>${ph.e} <e>${ph.en}</e></h3><p>${ph.pl}</p></div></div>`).join('')}
        <div class="th-tip">🦉 Sztuczka Sówki: <e>See you later</e> mówisz, gdy wychodzisz, a <e>Have a nice day</e> – gdy ktoś inny wychodzi i życzysz mu miłego dnia.</div>` })
    };
    THEORY.build = THEORY.where;

    function startLevel(idx, skipTheory) {
      stopSpeak();
      const lvl = idx < 0 ? REVIEW : LEVELS[idx];
      const tasks = buildTasks(lvl);
      session = { idx, lvl, tasks, base: tasks.reduce((s, t) => s + (t.weight || 1), 0), pos: 0, mistakes: 0, requeued: new Set() };
      document.body.classList.add('in-level');
      if (THEORY[lvl.id] && !skipTheory) return renderTheory();
      runLevel();
    }
    function renderTheory() {
      const th = THEORY[session.lvl.id]();
      screen.innerHTML = `
        <section class="level">
          <div class="level-top">
            <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
            <span style="flex:1"></span>
            <div class="level-badge">${session.lvl.icon}</div>
          </div>
          <div class="guide"><div class="owl-mini" id="owl">${owlSVG('happy')}</div><div class="bubble" id="bubble">Zanim zaczniemy – przypomnij sobie najważniejsze rzeczy! 📖</div></div>
          <div class="theory" id="theory"><h2 class="th-title">📖 ${th.title}</h2>${th.html}</div>
          <div class="theory-actions">
            <button class="btn soft" id="readTh" data-read="#theory">🔊 Przeczytaj mi</button>
            <button class="btn" id="goTh">Rozumiem – zaczynamy! →</button>
          </div>
        </section>`;
      $('#quitBtn').addEventListener('click', renderMap);
      $('#goTh').addEventListener('click', () => { stopSpeak(); runLevel(); });
      window.scrollTo(0, 0);
      if (state.read) speakHTML($('#theory').innerHTML, $('#readTh'));
    }
    function openTheory() {
      const th = THEORY[session.lvl.id]();
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `<div class="modal-card"><div class="theory" id="theoryM"><h2 class="th-title">📖 ${th.title}</h2>${th.html}</div>
        <div class="theory-actions"><button class="btn soft" data-read="#theoryM">🔊 Przeczytaj mi</button><button class="btn" id="closeTh">Wracam do zadania →</button></div></div>`;
      document.body.appendChild(m);
      const close = () => { stopSpeak(); m.remove(); };
      m.querySelector('#closeTh').addEventListener('click', close);
      m.addEventListener('click', e => { if (e.target === m) close(); });
    }
    function runLevel() {
      const lvl = session.lvl;
      screen.innerHTML = `
        <section class="level">
          <div class="level-top">
            <button class="icon-btn" id="quitBtn" aria-label="Wróć do mapy">✕</button>
            <div class="progress"><div class="progress-fill" id="progFill"></div></div>
            ${THEORY[lvl.id] ? '<button class="icon-btn" id="thBtn" aria-label="Przypomnij sobie" title="Przypomnij sobie">📖</button>' : ''}
            <div class="level-badge">${lvl.icon}</div>
          </div>
          <div class="guide"><div class="owl-mini" id="owl">${owlSVG()}</div><div class="bubble" id="bubble"></div>${sayMini('#bubble')}</div>
          <div class="task" id="task"></div>
        </section>`;
      $('#quitBtn').addEventListener('click', () => {
        if (session.pos === 0 || confirm('Przerwać poziom? Gwiazdki dostaniesz dopiero, gdy go skończysz.')) renderMap();
      });
      $('#thBtn')?.addEventListener('click', openTheory);
      window.scrollTo(0, 0);
      nextTask();
    }

    function nextTask() {
      kbHandler = null; arcadeOn = false;
      if (session.pos >= session.tasks.length) return finishLevel();
      $('#progFill').style.width = (session.pos / session.tasks.length * 100) + '%';
      const t = session.tasks[session.pos];
      RENDER[t.kind](t, $('#task'));
    }
    function taskDone(delay = 1000) {
      kbHandler = null;
      setTimeout(() => { session.pos++; nextTask(); }, delay);
    }
    // liczy błąd i dokłada to samo zadanie na koniec (raz), żeby je powtórzyć
    function markMistake(t) {
      session.mistakes++;
      if (t.kind === 'card' || t.kind === 'orderAll') return;
      const key = t.key || (t.item && t.kind + t.item.en + (t.dir || '') + (t.prompt || ''));
      if (!key || session.requeued.has(key)) return;
      session.requeued.add(key);
      session.tasks.push({ ...t, retry: true });
    }

    const RENDER = {
      /* --- karta do nauki --- */
      card(t, el) {
        const it = t.item, i = session.pos, n = session.tasks.length;
        el.innerHTML = `
          <div class="prompt-card learn-card" id="learnCard">
            <div class="count">${i + 1} / ${n}</div>
            <div class="big-emoji">${it.emoji}</div>
            <div class="word-en">${partsHTML(it)}</div>
            <div class="word-pl">${it.pl}</div>
            ${it.say ? `<div class="say-like no-read">czytamy: „${it.say}”</div>` : ''}
            ${hasSpeech ? `<div class="audio-row"><button class="btn-audio" data-say="${it.en}" aria-label="Posłuchaj">🔊</button><button class="btn-audio slow" data-say-slow="${it.en}" aria-label="Posłuchaj wolno">🐢</button></div>` : ''}
            <div class="tip">💡 ${it.tip}</div>
          </div>
          <button class="btn" id="nextBtn">${i + 1 < n ? 'Dalej ➜' : 'Gotowe! ✓'}</button>`;
        owlSay(t.first
          ? 'Poznaj słówka! Posłuchaj 🔊 i <b>powtórz na głos</b>. Żółwik 🐢 mówi wolniej.'
          : pick(['Powtórz za mną na głos!', 'Popatrz, jak się to pisze – kolorowe kawałki pomagają!', 'Przeczytaj podpowiedź – łatwiej zapamiętasz!']));
        // karta „poznaj”: słowo po angielsku, znaczenie i podpowiedź po polsku
        if (state.read) speakHTML($('#learnCard').innerHTML); else say(it.en);
        $('#nextBtn').addEventListener('click', () => { session.pos++; nextTask(); });
      },

      /* --- wybór z 4 odpowiedzi --- */
      choose(t, el) {
        const it = t.item;
        let correct = it, field = 'en', q, promptHTML, hint;
        if (t.dir === 'pl2en') {
          q = 'Jak to jest po angielsku?';
          promptHTML = `<div class="prompt-emoji">${it.emoji}</div><div class="prompt-pl">${it.pl}</div>`;
          hint = `💡 ${it.tip}`;
        } else if (t.dir === 'en2pl') {
          q = 'Co to znaczy po polsku?'; field = 'pl';
          promptHTML = `<div class="prompt-en" lang="en">${it.en}</div>${hasSpeech ? `<button class="btn-audio sm" data-say="${it.en}" aria-label="Posłuchaj">🔊</button>` : ''}`;
          hint = `💡 ${it.tip}`;
          say(it.en);
        } else {
          const d = t.dir === 'after' ? 1 : -1;
          correct = neighbor(it, d);
          q = d > 0 ? CONFIG.order.afterQ : CONFIG.order.beforeQ;
          promptHTML = CONFIG.order.promptHTML(it, d);
          hint = `Pomyśl: ${it.en} to ${it.pl}. A jaki dzień jest ${d > 0 ? 'potem' : 'wcześniej'}?`;
        }
        const opts = shuffle([correct, ...sample(ITEMS.filter(x => x !== correct), 3)]);
        el.innerHTML = `<div class="prompt-card">${promptHTML}</div>
          <div class="options">${opts.map((o, i) => `<button class="opt" data-i="${i}" ${field === 'en' ? 'lang="en"' : ''}>${o[field]}</button>`).join('')}</div>`;
        owlSay(q);
        let missed = false;
        el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          const o = opts[+b.dataset.i];
          if (o === correct) {
            b.classList.add('ok');
            el.querySelectorAll('.opt').forEach(x => x.disabled = true);
            sfx.good(); say(correct.en);
            owlSay(pick(PRAISE) + ` <e>${correct.en}</e> = ${correct.pl}`, 'happy');
            taskDone(1300);
          } else {
            b.classList.add('bad'); b.disabled = true;
            sfx.bad(); shakeEl(b);
            if (!missed) { missed = true; markMistake(t); }
            owlSay('Ups! Spróbuj jeszcze raz. ' + hint, 'sad');
          }
        }));
      },

      /* --- pociąg: ułóż po kolei --- */
      orderAll(t, el) {
        let expected = 0;
        const opts = shuffle(ITEMS);
        el.innerHTML = `<div class="train" id="train">
            <div class="wagon engine">🚂</div>
            ${ITEMS.map((_, i) => `<div class="wagon ${i === 0 ? 'next' : ''}" data-w="${i}">${i + 1}</div>`).join('')}
          </div>
          <div class="order-options">${opts.map((o, i) => `<button class="opt" data-i="${i}">${o.en}</button>`).join('')}</div>`;
        owlSay(CONFIG.order.start);
        el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          const o = opts[+b.dataset.i];
          if (o === ITEMS[expected]) {
            const w = el.querySelector(`[data-w="${expected}"]`);
            w.textContent = o.en; w.classList.remove('next'); w.classList.add('full');
            b.style.visibility = 'hidden';
            sfx.good(); say(o.en);
            expected++;
            const nw = el.querySelector(`[data-w="${expected}"]`);
            if (nw) nw.classList.add('next');
            if (expected === ITEMS.length) { owlSay('Cały pociąg gotowy! Tuu tuu! 🚂 ' + pick(PRAISE), 'happy'); taskDone(1600); }
            else owlSay(`<e>${o.en}</e> – ${o.pl} ✓. Co jest dalej?`, 'happy');
          } else {
            sfx.bad(); shakeEl(b); session.mistakes++;
            const prev = ITEMS[expected - 1];
            owlSay(expected === 0
              ? `To nie ten. Szukamy <b>${ITEMS[0].pl}</b> – pierwszego dnia.`
              : `To nie ten. Co jest po <e>${prev.en}</e> (${prev.pl})? Szukamy: <b>${ITEMS[expected].pl}</b>.`, 'sad');
          }
        }));
      },

      /* --- klocki z literami --- */
      tiles(t, el) {
        const it = t.item, word = it.en, n = word.length;
        const chars = word.replace(/ /g, '');
        let order;
        do { order = shuffle([...chars]); } while (order.join('') === chars && chars.length > 1);
        const tiles = order.map((c, id) => ({ c, id, used: false }));
        const slots = Array(n).fill(null), locked = Array(n).fill(false);
        // spacja w „toy chest” / „bedside table” stoi od razu na swoim miejscu
        [...word].forEach((c, i) => { if (c === ' ') { tiles.push({ c: ' ', id: tiles.length, used: true, space: true }); slots[i] = tiles.length - 1; locked[i] = true; } });
        let attempts = 0, busy = false;
        el.innerHTML = `<div class="prompt-card"><div class="prompt-emoji">${it.emoji}</div><div class="prompt-pl">${it.pl}</div>
            ${hasSpeech ? `<button class="btn-audio sm" data-say="${word}" aria-label="Posłuchaj">🔊</button>` : ''}</div>
          <div class="slots" id="slots" style="--n:${cols(word)}"></div>
          <div class="tiles" id="tiles"></div>`;
        owlSay(t.first ? 'Ułóż słowo z literek! Dotknij literkę, żeby ją wstawić. Dotknij w ramce, żeby ją zabrać.' : 'Ułóż to słowo z literek!');
        const slotsEl = $('#slots'), tilesEl = $('#tiles');
        function draw(bad = [], ok = false) {
          slotsEl.innerHTML = slots.map((id, i) => word[i] === ' ' ? '<span class="slot-break"></span>' : `<button class="slot ${id !== null ? 'filled' : ''} ${locked[i] ? 'locked' : ''} ${bad.includes(i) ? 'bad' : ''} ${ok ? 'ok' : ''}" data-slot="${i}">${id !== null ? tiles[id].c : ''}</button>`).join('');
          tilesEl.innerHTML = tiles.filter(tl => !tl.space).map(tl => `<button class="tile ${tl.used ? 'used' : ''}" data-tile="${tl.id}" ${tl.used ? 'disabled' : ''}>${tl.c}</button>`).join('');
        }
        slotsEl.addEventListener('click', e => {
          const b = e.target.closest('[data-slot]'); if (!b || busy) return;
          const i = +b.dataset.slot; if (locked[i] || slots[i] === null) return;
          tiles[slots[i]].used = false; slots[i] = null; draw();
        });
        tilesEl.addEventListener('click', e => {
          const b = e.target.closest('[data-tile]'); if (!b || busy) return;
          const tl = tiles[+b.dataset.tile]; const i = slots.indexOf(null);
          if (tl.used || i < 0) return;
          slots[i] = tl.id; tl.used = true; sfx.tap(); draw();
          if (!slots.includes(null)) check();
        });
        function check() {
          const built = slots.map(id => tiles[id].c).join('');
          if (built === word) {
            busy = true; draw([], true); sfx.good(); say(word);
            if (attempts === 0) changeMastery(it, 1);
            owlSay(pick(PRAISE) + ` <b>${partsHTML(it)}</b>`, 'happy');
            taskDone(1300);
            return;
          }
          attempts++;
          if (attempts === 1) markMistake(t);
          const bad = slots.map((id, i) => tiles[id].c !== word[i] ? i : -1).filter(i => i >= 0);
          busy = true; sfx.bad(); draw(bad);
          owlSay(attempts < 2 ? 'Prawie! Zielone zostają, czerwone wracają – popraw je.' : `Podpowiedź: ${it.tip}`, 'sad');
          setTimeout(() => {
            slots.forEach((id, i) => { if (tiles[id].c === word[i]) locked[i] = true; else { tiles[id].used = false; slots[i] = null; } });
            busy = false; draw();
          }, 900);
        }
        draw();
      },

      /* --- brakujące litery --- */
      gaps(t, el) {
        const it = t.item, word = it.en, hidden = t.hidden;
        const fill = {};
        let attempts = 0, locked = false, ghost = false, bad = [], ok = false;
        el.innerHTML = `<div class="prompt-card"><div class="prompt-emoji">${it.emoji}</div><div class="prompt-pl">${it.pl}</div>
            ${hasSpeech ? `<button class="btn-audio sm" data-say="${word}" aria-label="Posłuchaj">🔊</button>` : ''}</div>
          <div class="slots" id="slots" style="--n:${cols(word)}"></div>
          <div class="feedback" id="fb"></div>
          ${keyboardHTML()}`;
        owlSay(t.first ? 'Niektóre literki uciekły! Wpisz je na klawiaturze na dole.' : 'Wpisz brakujące literki!');
        const nextGap = () => hidden.find(i => !fill[i]);
        function draw() {
          const ng = nextGap();
          $('#slots').innerHTML = [...word].map((c, i) => hidden.includes(i)
            ? `<span class="slot gap ${i === ng && !locked ? 'active' : ''} ${bad.includes(i) ? 'bad' : ''} ${ok ? 'ok' : ''} ${!fill[i] && ghost ? 'ghost' : ''}">${fill[i] || (ghost ? c : '')}</span>`
            : c === ' ' ? '<span class="slot-break"></span>' : `<span class="slot fixed">${c}</span>`).join('');
        }
        function check() {
          locked = true;
          bad = hidden.filter(i => fill[i].toLowerCase() !== word[i].toLowerCase());
          if (!bad.length) {
            ok = true; draw(); sfx.good(); say(word);
            if (attempts === 0) changeMastery(it, 1);
            owlSay(pick(PRAISE) + ` <b>${partsHTML(it)}</b>`, 'happy');
            taskDone(1300);
            return;
          }
          attempts++;
          if (attempts === 1) markMistake(t);
          sfx.bad(); draw(); shakeEl($('#slots'));
          owlSay(attempts < 2 ? 'Czerwone literki są złe. Spróbuj jeszcze raz!' : 'Podpowiem Ci – wpisz jasne literki 👀', 'sad');
          setTimeout(() => {
            bad.forEach(i => delete fill[i]); bad = [];
            if (attempts >= 2) ghost = true;
            locked = false; draw();
          }, 900);
        }
        kbHandler = {
          type(ch) { if (locked) return; const i = nextGap(); if (i === undefined) return; fill[i] = ch; },
          back() { if (locked) return; const f = hidden.filter(i => fill[i]); if (f.length) delete fill[f[f.length - 1]]; },
          enter() { if (!locked && nextGap() === undefined) check(); },
          refresh() { draw(); setShift(nextGap() === 0); if (!locked && nextGap() === undefined) check(); }
        };
        kbHandler.refresh();
      },

      /* --- pisanie całego słowa (z polskiego, ze słuchu, jutro/wczoraj) --- */
      write(t, el) {
        const it = t.item;
        const mode = t.prompt === 'audio' && !hasSpeech ? 'pl' : t.prompt;
        const target = mode === 'after' ? neighbor(it, 1) : mode === 'before' ? neighbor(it, -1) : it;
        const word = target.en;
        let q, promptHTML;
        if (mode === 'pl') {
          q = pick(['Napisz po angielsku:', 'Jak to napisać po angielsku?', 'Twoja kolej – napisz to słowo!']);
          promptHTML = `<div class="prompt-emoji">${it.emoji}</div><div class="prompt-pl">${it.pl}</div>`;
        } else if (mode === 'audio') {
          q = 'Posłuchaj i napisz, co słyszysz. 🐢 mówi wolniej.';
          promptHTML = `<div class="audio-row"><button class="btn-audio" data-say="${word}" aria-label="Posłuchaj">🔊</button><button class="btn-audio slow" data-say-slow="${word}" aria-label="Posłuchaj wolno">🐢</button></div>
            <button class="link-btn" id="hintBtn">Nie wiem, co to – podpowiedz 🙈</button>
            <div class="hint-text" id="hintText" hidden>${target.emoji} ${target.pl}</div>`;
          setTimeout(() => say(word), 400);
        } else {
          const d = mode === 'after' ? 1 : -1;
          q = (d > 0 ? CONFIG.order.afterQ : CONFIG.order.beforeQ) + ' Napisz po angielsku.';
          promptHTML = CONFIG.order.writePromptHTML(it, d);
        }
        el.innerHTML = `<div class="prompt-card">${promptHTML}</div>
          <div class="answer-box" id="ansBox"></div>
          <div class="feedback" id="fb"></div>
          ${keyboardHTML()}`;
        owlSay(q);
        $('#hintBtn')?.addEventListener('click', e => { $('#hintText').hidden = false; e.target.remove(); });

        const st = { value: '', attempts: 0, copy: false, locked: false };
        const box = $('#ansBox'), fb = $('#fb');
        kbHandler = {
          type(ch) { if (!st.locked && st.value.length < word.length + 4) st.value += ch; },
          back() { if (!st.locked) st.value = st.value.slice(0, -1); },
          enter() { if (!st.locked && st.value) check(); },
          refresh() {
            box.innerHTML = st.value
              ? `<span>${st.value}</span><span class="caret"></span>`
              : `<span class="placeholder">${st.copy ? 'przepisz słowo…' : 'pisz na klawiaturze…'}</span>`;
            if (st.value === '') setShift(CONFIG.capitalize !== false);
          }
        };
        kbHandler.refresh();

        function check() {
          const v = st.value.trim();
          if (v.toLowerCase() === word.toLowerCase()) {
            st.locked = true;
            box.classList.add('ok'); box.innerHTML = partsHTML(target);
            sfx.good(); say(word);
            if (!st.copy && st.attempts === 0) changeMastery(target, 1);
            const capNote = v !== word ? `<small>${CONFIG.capitalNote}</small>` : '';
            owlSay((st.copy ? 'Dobrze przepisane! Zapamiętaj je 🧠' : pick(PRAISE)) + capNote, 'happy');
            taskDone(capNote ? 2600 : 1200);
            return;
          }
          st.attempts++;
          sfx.bad(); shakeEl(box);
          if (st.attempts === 1 && !st.copy) { markMistake(t); changeMastery(target, -1); }
          if (st.copy) {
            owlSay(`Przepisz dokładnie, literka po literce: <b>${word}</b>`, 'sad');
            st.value = ''; kbHandler.refresh();
            return;
          }
          if (st.attempts === 1) {
            const m = lcsMatched(v, word);
            fb.innerHTML = `<div class="compare">${[...v].map((c, i) => `<span class="${m.has(i) ? 'c-ok' : 'c-bad'}">${c}</span>`).join('')}</div>
              Zielone literki są dobrze. Słowo ma <b>${word.length}</b> ${letters(word.length)} i zaczyna się na <b>${word[0]}</b>.`;
            owlSay('Prawie! Popraw i spróbuj jeszcze raz 💪', 'sad');
          } else {
            st.copy = true; st.value = '';
            fb.innerHTML = `<div class="reveal">${partsHTML(target)}</div>`;
            owlSay('Nic nie szkodzi! Zobacz, jak to się pisze, i <b>przepisz</b> to słowo. Tak najlepiej zapamiętasz!', 'sad');
            say(word); kbHandler.refresh();
          }
        }
      }
    };

    /* =====================================================================
       ZADANIA Z ROZDZIAŁU „MY BEDROOM”: przyimki, pytania, zdania, zwroty
       ===================================================================== */
    // wspólny wybór odpowiedzi: opts – teksty, correct – dobry tekst, onOk/onBad – reakcje
    function chooseFrom(el, opts, correct, onOk, onBad, cls = '') {
      const box = document.createElement('div');
      box.className = 'options ' + cls;
      box.innerHTML = opts.map((o, i) => `<button class="opt" data-i="${i}" lang="en">${o}</button>`).join('');
      el.appendChild(box);
      box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const o = opts[+b.dataset.i];
        if (o === correct) {
          b.classList.add('ok'); box.querySelectorAll('.opt').forEach(x => x.disabled = true);
          sfx.good(); onOk(b);
        } else {
          b.classList.add('bad'); b.disabled = true; sfx.bad(); shakeEl(b); onBad(o);
        }
      }));
    }
    const fillBlank = text => { const b = $('#task .blank'); if (b) { b.textContent = text; b.classList.add('filled'); } };

    Object.assign(RENDER, {
      /* --- 📍 in / on / under / next to --- */
      prep(t, el) {
        const { o, f, p } = t.sc;
        el.innerHTML = `<div class="prompt-card">${sceneSVG(...t.sc.key.split('-'))}
            <div class="prompt-line" lang="en">The ${o.en} ${o.many ? 'are' : 'is'} <span class="blank">___</span> the ${f.en}.</div>
            <div class="prompt-sub">${o.pl} • ${f.name}</div></div>`;
        owlSay(`Gdzie ${o.many ? 'są' : 'jest'} ${o.pl}? Wybierz słówko: <e>in, on, under</e> albo <e>next to</e>.`);
        let missed = false;
        chooseFrom(el, PREPS.map(x => PREP[x].en), PREP[p].en, () => {
          fillBlank(PREP[p].en);
          say(`The ${o.en} ${o.many ? 'are' : 'is'} ${PREP[p].en} the ${f.en}.`);
          owlSay(`${pick(PRAISE)} <e>${PREP[p].en}</e> = ${PREP[p].pl}. ${plWhere(o, f, p)}`, 'happy');
          taskDone(2200);
        }, bad => {
          if (!missed) { missed = true; markMistake(t); }
          const k = PREPS.find(x => PREP[x].en === bad);
          owlSay(`<e>${bad}</e> to „${PREP[k].pl}”. Popatrz jeszcze raz: w środku, na, pod czy obok?`, 'sad');
        }, 'two');
      },

      /* --- ❓ Where’s…? Where are…? – wybierz odpowiedź --- */
      where(t, el) {
        const { o, f, p } = t.sc;
        const correct = aText(o, f, p);
        const otherP = pick(PREPS.filter(x => x !== p && (x !== 'in' || f.in)));
        const otherF = pick(Object.keys(FURN).filter(k => k !== 'box' && FURN[k] !== f && FURN[k][p]));
        const wrongPron = `${o.many ? 'It’s' : 'They’re'} ${PREP[p].en} the ${f.en}.`;
        const opts = shuffle([correct, aText(o, f, otherP), wrongPron, aText(o, FURN[otherF], p)]);
        el.innerHTML = `<div class="prompt-card">${sceneSVG(...t.sc.key.split('-'))}
            <div class="q-row"><span class="q-en" lang="en">${qText(o)}</span><button class="btn-audio sm" data-say="${qText(o)}" aria-label="Posłuchaj pytania">🔊</button></div></div>`;
        owlSay('Przeczytaj pytanie, popatrz na obrazek i wybierz dobrą odpowiedź.');
        let missed = false;
        chooseFrom(el, opts, correct, () => {
          say(correct);
          owlSay(`${pick(PRAISE)} ${plWhere(o, f, p)}`, 'happy');
          taskDone(2200);
        }, bad => {
          if (!missed) { missed = true; markMistake(t); }
          if (bad === wrongPron) owlSay(o.many ? `<e>${o.en}</e> to kilka rzeczy – mówimy <e>They’re</e>.` : `<e>${o.en}</e> to jedna rzecz – mówimy <e>It’s</e>.`, 'sad');
          else if (bad.includes(` the ${f.en}.`)) owlSay('Popatrz dokładnie, gdzie to jest: w środku, na, pod czy obok?', 'sad');
          else owlSay(`Popatrz, przy jakim meblu to jest. To <e>${f.en}</e> – ${f.name}.`, 'sad');
        }, 'sent');
      },

      /* --- Where’s czy Where are? It’s czy They’re? --- */
      isare(t, el) {
        const o = t.o, q = t.mode === 'q';
        const opts = q ? ['Where’s', 'Where are'] : ['It’s', 'They’re'];
        const correct = q ? (o.many ? 'Where are' : 'Where’s') : (o.many ? 'They’re' : 'It’s');
        el.innerHTML = `<div class="prompt-card"><div class="obj-big">${objIcon(o)}</div>
            ${q ? `<div class="q-en" lang="en"><span class="blank">___</span> the ${o.en}?</div>`
                : `<div class="q-en" lang="en">${qText(o)}</div><div class="prompt-line" lang="en"><span class="blank">___</span> on the bed.</div>`}
            <div class="prompt-sub">${o.pl}</div></div>`;
        owlSay(q ? `Chcesz zapytać: „${plQ(o)}” Jak zaczniesz pytanie?` : `Jak odpowiesz? ${o.many ? 'Są' : 'Jest'} na łóżku.`);
        let missed = false;
        chooseFrom(el, opts, correct, () => {
          fillBlank(correct);
          say(q ? qText(o) : `${correct} on the bed.`);
          owlSay(`${pick(PRAISE)} ${o.many ? 'Dużo rzeczy – <e>are</e>, <e>They’re</e>.' : 'Jedna rzecz – <e>is</e>, <e>It’s</e>.'}`, 'happy');
          taskDone(1900);
        }, () => {
          if (!missed) { missed = true; markMistake(t); }
          owlSay(o.many ? `Po polsku „są” – bo <e>${o.en}</e> to kilka rzeczy. „Są” to <e>are</e>.` : `Po polsku „jest” – bo <e>${o.en}</e> to jedna rzecz. „Jest” to <e>is</e>.`, 'sad');
        }, 'two');
      },

      /* --- 🧱 Ułóż zdanie ze słówek --- */
      build(t, el) {
        const target = t.words;
        const tiles = shuffle([...target, ...(t.extra || [])]).map((w, id) => ({ w, id, used: false }));
        let line = [], attempts = 0, busy = false, hintWord = null;
        el.innerHTML = `<div class="prompt-card">${t.promptHTML}</div>
          <div class="sent-line" id="line"></div>
          <div class="word-tiles" id="wt"></div>`;
        owlSay(t.ask);
        const lineEl = $('#line'), wtEl = $('#wt');
        function draw(bad = []) {
          lineEl.innerHTML = line.map((id, i) => `<button class="wtile inline ${bad.includes(i) ? 'bad' : ''}" data-l="${i}" lang="en">${tiles[id].w}</button>`).join('')
            + Array(Math.max(0, target.length - line.length)).fill('<span class="ph"></span>').join('')
            + `<span class="end">${t.end}</span>`;
          wtEl.innerHTML = tiles.map(tl => `<button class="wtile ${tl.used ? 'used' : ''} ${hintWord && !tl.used && tl.w === hintWord ? 'hint' : ''}" data-t="${tl.id}" lang="en" ${tl.used ? 'disabled' : ''}>${tl.w}</button>`).join('');
        }
        lineEl.addEventListener('click', e => {
          const b = e.target.closest('[data-l]'); if (!b || busy) return;
          const i = +b.dataset.l;
          line.splice(i).forEach(id => { tiles[id].used = false; });
          updHint(); draw();
        });
        wtEl.addEventListener('click', e => {
          const b = e.target.closest('[data-t]'); if (!b || busy) return;
          const tl = tiles[+b.dataset.t]; if (tl.used) return;
          line.push(tl.id); tl.used = true; sfx.tap(); updHint(); draw();
          if (line.length === target.length) check();
        });
        function updHint() { hintWord = attempts >= 2 && line.length < target.length ? target[line.length] : null; }
        function check() {
          const built = line.map(id => tiles[id].w);
          const sentence = target.join(' ') + t.end;
          if (built.join(' ') === target.join(' ')) {
            busy = true; lineEl.classList.add('ok'); sfx.good(); say(sentence);
            owlSay(`${pick(PRAISE)} <e>${sentence}</e>${t.sc ? ' ' + plWhere(t.sc.o, t.sc.f, t.sc.p) : ''}`, 'happy');
            taskDone(2400);
            return;
          }
          attempts++;
          if (attempts === 1) markMistake(t);
          const firstBad = built.findIndex((w, i) => w !== target[i]);
          const bad = built.map((w, i) => i >= firstBad ? i : -1).filter(i => i >= 0);
          busy = true; sfx.bad(); draw(bad); shakeEl(lineEl);
          owlSay(attempts < 2 ? 'Prawie! Czerwone słówka wracają – popraw je.' : 'Podpowiem Ci – świecące słówko jest następne 👀', 'sad');
          setTimeout(() => {
            line.splice(firstBad).forEach(id => { tiles[id].used = false; });
            busy = false; updHint(); draw();
          }, 1000);
        }
        draw();
      },

      /* --- 👋 Everyday English: co powiesz? --- */
      phrase(t, el) {
        const ph = t.ph;
        const opts = shuffle([ph, ...sample(PHRASES.filter(x => x !== ph), 3)]).map(x => x.en);
        el.innerHTML = `<div class="prompt-card"><div class="prompt-emoji">${ph.e}</div><div class="situation">${ph.sit}</div></div>`;
        owlSay('Co powiesz po angielsku? Wybierz zwrot.');
        let missed = false;
        chooseFrom(el, opts, ph.en, () => {
          say(ph.en);
          owlSay(`${pick(PRAISE)} <e>${ph.en}</e> – ${ph.pl}`, 'happy');
          taskDone(2000);
        }, bad => {
          if (!missed) { missed = true; markMistake(t); }
          const w = PHRASES.find(x => x.en === bad);
          owlSay(`<e>${bad}</e> znaczy „${w.pl}”. Spróbuj jeszcze raz!`, 'sad');
        }, 'sent');
      }
    });

    /* =====================================================================
       GRY ZRĘCZNOŚCIOWE (wplecione między poziomy nauki)
       ===================================================================== */
    const keys = {};
    let arcadeOn = false;
    document.addEventListener('keydown', e => { if (arcadeOn && /^Arrow/.test(e.key)) { keys[e.key] = true; e.preventDefault(); } });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function arenaHTML() {
      return `<div class="arena-hud"><span class="lives" id="lives"></span><div class="arena-target" id="target"></div><span class="score" id="score"></span></div>
        <div class="arena" id="arena"></div>`;
    }
    function setLives(n) { $('#lives').textContent = '❤️'.repeat(Math.max(0, n)) + '🤍'.repeat(3 - Math.max(0, n)); }
    function arenaOverlay(arena, title, text, label, onClick) {
      const o = document.createElement('div');
      o.className = 'arena-overlay';
      o.innerHTML = `<div class="ov-card"><div class="ov-title">${title}</div><p>${text}</p><button class="btn green">${label}</button></div>`;
      o.addEventListener('pointerdown', e => e.stopPropagation());
      arena.appendChild(o);
      o.querySelector('button').addEventListener('click', () => { o.remove(); onClick(); });
    }
    function gameOver(arena, ctl, play) {
      ctl.stop();
      arenaOverlay(arena, '💔 Koniec serduszek', 'Nic nie szkodzi! Spróbuj jeszcze raz – już wiesz więcej.', 'Jeszcze raz 🔁', play);
    }
    function gameLoop(arena, step) {
      const token = session;
      let last = performance.now();
      const ctl = { stopped: false, stop() { this.stopped = true; arcadeOn = false; } };
      arcadeOn = true;
      function frame(now) {
        if (ctl.stopped || session !== token || !arena.isConnected) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        step(dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      return ctl;
    }
    function ent(arena, cls, html) {
      const d = document.createElement('div');
      d.className = 'ent ' + cls; d.innerHTML = html;
      arena.appendChild(d);
      return d;
    }
    const place = (d, x, y) => { d.style.transform = `translate(${x}px, ${y}px)`; };
    function floatText(arena, x, y, text) { const f = ent(arena, 'float-text', `<span>${text}</span>`); place(f, x, y); setTimeout(() => f.remove(), 900); }
    const clearEnts = arena => arena.querySelectorAll('.ent').forEach(n => n.remove());
    function cycler(list) { let q = []; return () => { if (!q.length) q = shuffle(list); return q.pop(); }; }
    function bounce(el) { el.classList.remove('jump'); void el.offsetWidth; el.classList.add('jump'); }

    Object.assign(RENDER, {
      /* --- 🧺 Łap słówka: Sówka z koszykiem łapie spadające słowa --- */
      catch(t, el) {
        const GOAL = 8;
        el.innerHTML = arenaHTML();
        const arena = $('#arena');
        setLives(3); $('#score').textContent = `0/${GOAL}`; $('#target').innerHTML = '🧺 Łap słówka';
        owlSay('Gra zręcznościowa! 🎮 Pomóż mi łapać słówka do koszyka!');
        arenaOverlay(arena, '🧺 Łap słówka', 'Przesuwaj palcem Sówkę w lewo i w prawo. Łap tylko to angielskie słowo, które pasuje do polskiego u góry!<br><small>Na komputerze: myszka albo strzałki ← →</small>', 'Start ▶', play);

        function play() {
          clearEnts(arena);
          const W = arena.clientWidth, H = arena.clientHeight;
          let lives = 3, score = 0, px = W / 2, tx = W / 2, spawnT = 0.4, target, drops = [];
          const nextItem = cycler(ITEMS);
          const player = ent(arena, 'player', `<div>${owlSVG()}<div class="basket">🧺</div></div>`);
          const PW = player.offsetWidth, PH = player.offsetHeight;
          setLives(lives); upd();
          function upd() { $('#score').textContent = `${score}/${GOAL}`; }
          function newTarget() {
            target = nextItem();
            drops.forEach(d => d.el.remove()); drops = [];
            $('#target').innerHTML = `Złap: <b>${target.emoji} ${target.pl}</b>`;
          }
          newTarget();
          const move = e => { tx = e.clientX - arena.getBoundingClientRect().left; };
          arena.onpointerdown = move;
          arena.onpointermove = move;
          function spawn() {
            const want = !drops.some(d => d.item === target) ? Math.random() < 0.75 : Math.random() < 0.2;
            const item = want ? target : pick(ITEMS.filter(x => x !== target));
            const e = ent(arena, 'drop', item.en);
            const w = e.offsetWidth, h = e.offsetHeight;
            drops.push({ el: e, item, w, h, x: w / 2 + Math.random() * (W - w), y: -h });
          }
          const ctl = gameLoop(arena, dt => {
            if (keys.ArrowLeft) tx -= 420 * dt;
            if (keys.ArrowRight) tx += 420 * dt;
            tx = Math.max(PW / 2, Math.min(W - PW / 2, tx));
            px += (tx - px) * Math.min(1, dt * 14);
            place(player, px - PW / 2, H - PH - 4);
            spawnT -= dt;
            if (spawnT <= 0) { spawn(); spawnT = Math.max(0.75, 1.3 - score * 0.07); }
            const speed = H / Math.max(3.4, 5.2 - score * 0.25);
            const catchY = H - PH + 14;
            for (const d of [...drops]) {
              d.y += speed * dt;
              place(d.el, d.x - d.w / 2, d.y);
              const bottom = d.y + d.h;
              if (bottom >= catchY && bottom <= catchY + 34 && Math.abs(d.x - px) < (PW + d.w) / 2 - 16) caught(d);
              else if (d.y > H) { d.el.remove(); drops.splice(drops.indexOf(d), 1); }
            }
          });
          function caught(d) {
            d.el.remove(); drops.splice(drops.indexOf(d), 1);
            if (d.item === target) {
              score++; upd(); sfx.good(); say(d.item.en);
              floatText(arena, px - 20, H - PH - 50, '+1 ⭐');
              bounce(player.firstElementChild);
              if (score >= GOAL) { ctl.stop(); owlSay('Wszystkie złapane! ' + pick(PRAISE), 'happy'); taskDone(1500); return; }
              owlSay(`${pick(PRAISE)} <e>${d.item.en}</e> = ${d.item.pl}`, 'happy');
              newTarget();
            } else {
              lives--; session.mistakes++; setLives(lives); sfx.bad(); shakeEl(arena);
              owlSay(`Ups! To było <e>${d.item.en}</e> = ${d.item.pl}. Szukamy: <b>${target.pl}</b>`, 'sad');
              if (lives <= 0) gameOver(arena, ctl, play);
            }
          }
        }
      },

      /* --- 🎈 Balonowe słuchanie: usłysz słowo i przebij właściwy balon --- */
      balloons(t, el) {
        const GOAL = 8;
        const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];
        el.innerHTML = arenaHTML();
        const arena = $('#arena');
        setLives(3); $('#score').textContent = `0/${GOAL}`; $('#target').innerHTML = '🎈 Balony';
        owlSay('Gra zręcznościowa! 🎮 Słuchaj uważnie i przebijaj balony!');
        arenaOverlay(arena, '🎈 Balonowe słuchanie',
          hasSpeech ? 'Posłuchaj słowa 🔊 i szybko dotknij balon z tym słowem, zanim odleci! Przycisk 🔊 u góry powtarza słowo.'
                    : 'Dotknij balon z angielskim słowem, które pasuje do polskiego u góry, zanim odleci!',
          'Start ▶', play);

        function play() {
          clearEnts(arena);
          const W = arena.clientWidth, H = arena.clientHeight;
          let lives = 3, score = 0, spawnT = 0, time = 0, target, bs = [];
          const nextItem = cycler(ITEMS);
          setLives(lives); upd();
          function upd() { $('#score').textContent = `${score}/${GOAL}`; }
          function newTarget() {
            target = nextItem();
            $('#target').innerHTML = hasSpeech
              ? `<button class="btn-audio sm" data-say="${target.en}" aria-label="Posłuchaj">🔊</button> Przebij to słowo!`
              : `Przebij: <b>${target.emoji} ${target.pl}</b>`;
            say(target.en);
          }
          newTarget();
          function spawn() {
            if (bs.length >= 5) return;
            const item = !bs.some(b => b.item === target) ? target : pick(ITEMS.filter(x => x !== target));
            const e = ent(arena, 'balloon', `<div class="bal" style="--c:${pick(COLORS)}">${item.en}</div>`);
            const b = { el: e, item, x: 6 + Math.random() * (W - 112), y: H + 10, ph: Math.random() * 6, alive: true };
            bs.push(b);
            e.addEventListener('pointerdown', ev => { ev.stopPropagation(); hit(b); });
          }
          const ctl = gameLoop(arena, dt => {
            time += dt; spawnT -= dt;
            if (spawnT <= 0) { spawn(); spawnT = Math.max(0.6, 1.1 - score * 0.05); }
            const speed = H / Math.max(4.5, 7 - score * 0.25);
            for (const b of [...bs]) {
              b.y -= speed * dt;
              place(b.el, b.x + Math.sin(time * 1.6 + b.ph) * 14, b.y);
              if (b.y < -140) { b.el.remove(); bs.splice(bs.indexOf(b), 1); }
            }
          });
          function hit(b) {
            if (!b.alive || ctl.stopped) return;
            b.alive = false; bs.splice(bs.indexOf(b), 1);
            if (b.item === target) {
              b.el.classList.add('popped'); setTimeout(() => b.el.remove(), 300);
              score++; upd(); sfx.good();
              floatText(arena, b.x + 30, b.y + 20, '+1 ⭐');
              if (score >= GOAL) { ctl.stop(); owlSay('Wszystkie balony przebite! ' + pick(PRAISE), 'happy'); taskDone(1500); return; }
              owlSay(`${pick(PRAISE)} <e>${b.item.en}</e> = ${b.item.pl}`, 'happy');
              setTimeout(() => { if (!ctl.stopped) newTarget(); }, 600);
            } else {
              b.el.classList.add('wrong'); setTimeout(() => b.el.remove(), 450);
              lives--; session.mistakes++; setLives(lives); sfx.bad();
              owlSay(`To był <e>${b.item.en}</e> – ${b.item.pl}. Posłuchaj jeszcze raz!`, 'sad');
              setTimeout(() => say(target.en), 700);
              if (lives <= 0) gameOver(arena, ctl, play);
            }
          }
        }
      },

      /* --- 🦉 Lot Sówki: leć przez literki po kolei i ułóż słowo --- */
      fly(t, el) {
        const WORDS = 3;
        el.innerHTML = arenaHTML();
        const arena = $('#arena');
        arena.classList.add('sky');
        setLives(3); $('#target').innerHTML = '🦉 Lot Sówki';
        owlSay('Gra zręcznościowa! 🎮 Poprowadź mnie przez literki!');
        arenaOverlay(arena, '🦉 Lot Sówki', 'Przesuwaj palcem w górę i w dół. Wlatuj w literki, które <b>po kolei</b> tworzą słowo z góry ekranu!<br><small>Na komputerze: myszka albo strzałki ↑ ↓</small>', 'Start ▶', play);

        function play() {
          clearEnts(arena);
          const W = arena.clientWidth, H = arena.clientHeight;
          const words = pickWeak(ITEMS.length).filter(it => !it.en.includes(' ')).slice(0, WORDS);
          let wi = 0, li = 0, lives = 3, wordErr = 0, col = null, wait = 0.8;
          const OX = Math.max(48, W * 0.18);
          let oy = H / 2, ty = H / 2;
          const clouds = [0, 1, 2].map(i => ({ el: ent(arena, 'cloud', '☁️'), x: Math.random() * W, y: 20 + i * H / 3 + Math.random() * 40, v: 25 + Math.random() * 25 }));
          const owl = ent(arena, 'flyer', `<div>${owlSVG()}</div>`);
          const OW = owl.offsetWidth;
          setLives(lives); draw();
          const word = () => words[wi].en;
          function draw() {
            const w = words[Math.min(wi, words.length - 1)];
            $('#target').innerHTML = `<span>${w.emoji} ${w.pl}</span><span class="spell">${[...w.en].map((c, i) =>
              `<span class="${i < li ? 'got' : i === li ? 'now' : ''}">${i < li ? c : '_'}</span>`).join('')}</span>`;
            $('#score').textContent = `${Math.min(wi + 1, WORDS)}/${WORDS}`;
          }
          const move = e => { ty = e.clientY - arena.getBoundingClientRect().top; };
          arena.onpointerdown = move;
          arena.onpointermove = move;
          function spawnCol() {
            const need = word()[li];
            let wrong;
            do { wrong = pick([...'abcdefghiklmnoprstuwy']); } while (wrong === need.toLowerCase());
            if (need !== need.toLowerCase()) wrong = wrong.toUpperCase();
            const lanes = shuffle([0.2, 0.5, 0.8]);
            col = { x: W + 40, balls: shuffle([{ c: need, ok: true }, { c: wrong, ok: false }]).map((b, i) => ({ ...b, y: lanes[i] * H, el: ent(arena, 'ball', b.c) })) };
          }
          const ctl = gameLoop(arena, dt => {
            if (keys.ArrowUp) ty -= 380 * dt;
            if (keys.ArrowDown) ty += 380 * dt;
            ty = Math.max(32, Math.min(H - 32, ty));
            oy += (ty - oy) * Math.min(1, dt * 10);
            place(owl, OX - OW / 2, oy - OW / 2);
            for (const c of clouds) { c.x -= c.v * dt; if (c.x < -60) c.x = W + 20; place(c.el, c.x, c.y); }
            if (!col) { wait -= dt; if (wait <= 0) spawnCol(); return; }
            col.x -= W / Math.max(2.2, 3.0 - wi * 0.3) * dt;
            for (const b of col.balls) place(b.el, col.x - 31, b.y - 31);
            for (const b of col.balls) if (Math.abs(col.x - OX) < 40 && Math.abs(b.y - oy) < 42) { hitBall(b); return; }
            if (col.x < -40) {
              col.balls.forEach(b => b.el.remove()); col = null; wait = 0.3;
              owlSay('Literka uciekła! Leć do tej, która pasuje 😉');
            }
          });
          function hitBall(b) {
            const c = col; col = null;
            c.balls.forEach(x => { x.el.classList.add(x === b ? (b.ok ? 'got' : 'bad') : 'fade'); setTimeout(() => x.el.remove(), 350); });
            if (b.ok) {
              li++; sfx.good(); bounce(owl.firstElementChild);
              if (li >= word().length) {
                const w = words[wi];
                draw(); say(w.en);
                if (!wordErr) changeMastery(w, 1);
                owlSay(`${pick(PRAISE)} Ułożone: <b>${partsHTML(w)}</b>`, 'happy');
                wi++; li = 0; wordErr = 0;
                if (wi >= words.length) { ctl.stop(); taskDone(1800); return; }
                wait = 1.6; setTimeout(() => { if (!ctl.stopped) draw(); }, 1300);
                return;
              }
              draw(); wait = 0.35;
            } else {
              lives--; wordErr++; session.mistakes++; setLives(lives); sfx.bad(); shakeEl(owl.firstElementChild);
              owlSay(li ? `To nie „${b.c}”! Jaka literka jest po „${word().slice(0, li)}”?` : `To nie „${b.c}”! Na jaką literę zaczyna się to słowo?`, 'sad');
              wait = 0.6;
              if (lives <= 0) gameOver(arena, ctl, play);
            }
          }
        }
      }
    });

    /* ---------- Koniec poziomu ---------- */
    function finishLevel() {
      kbHandler = null;
      const { lvl, mistakes, base, idx } = session;
      const r = mistakes / base;
      const stars = lvl.type === 'learn' ? 3 : r <= 0.1 ? 3 : r <= 0.3 ? 2 : 1;
      const oldAcc = accessories();
      if (lvl.type !== 'review') state.stars[lvl.id] = Math.max(state.stars[lvl.id] || 0, stars);
      bumpStreak(); save();
      if (window.Odznaki) Odznaki.sprawdz();
      const newRewards = REWARDS.filter(rw => !oldAcc.includes(rw.id) && accessories().includes(rw.id));
      const isReview = lvl.type === 'review';
      const hasNext = !isReview && idx + 1 < LEVELS.length;
      const title = isReview ? 'Powtórka zrobiona!' : stars === 3 ? 'Mistrzostwo!' : stars === 2 ? 'Świetnie!' : 'Udało się!';
      const msg = mistakes === 0 ? 'Zero błędów! Hoot hoot! 🦉'
        : `Błędy: ${mistakes}. ${!isReview && stars < 3 ? 'Zagraj jeszcze raz, żeby zdobyć 3 gwiazdki!' : 'Ćwicz dalej, a będzie jeszcze lepiej!'}`;

      screen.innerHTML = `
        <section class="result">
          <div class="owl-big">${owlSVG('happy')}</div>
          <h2>${title}</h2>
          ${isReview ? '' : `<div class="result-stars">${[0, 1, 2].map(i => `<span class="rs ${i < stars ? 'on' : ''}" style="--d:${0.2 + i * 0.3}s">★</span>`).join('')}</div>`}
          <p>${msg}</p>
          ${newRewards.map(rw => `<div class="reward-pop">🎁 Sówka dostała nagrodę: ${rw.icon} ${rw.name}!</div>`).join('')}
          <div class="result-actions">
            ${hasNext ? `<button class="btn green" id="nextLvl">Następny poziom ➜</button>` : ''}
            <button class="btn ${hasNext ? 'soft' : ''}" id="again">Zagraj jeszcze raz 🔁</button>
            <button class="btn soft" id="toMap">Mapa przygody 🗺️</button>
          </div>
        </section>`;
      sfx.win();
      if (stars >= 2 || newRewards.length) confetti();
      $('#nextLvl')?.addEventListener('click', () => startLevel(idx + 1));
      $('#again').addEventListener('click', () => startLevel(idx, true));
      $('#toMap').addEventListener('click', renderMap);
      window.scrollTo(0, 0);
    }

    renderMap();
  </script>
</body>
</html>
