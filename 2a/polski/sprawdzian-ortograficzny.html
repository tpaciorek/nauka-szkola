<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprawdzian ortograficzny - Klasa 2a</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(rgba(99, 102, 241, 0.12) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .page-shell {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 800;
            color: #4338ca;
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #c7d2fe;
            box-shadow: 0 12px 26px rgba(79, 70, 229, 0.14);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            background: white;
            box-shadow: 0 16px 32px rgba(79, 70, 229, 0.2);
        }

        .nav-link.active {
            background: #e0e7ff;
            border-color: #818cf8;
        }

        .sentence-wrapper {
            line-height: 2.1;
        }

        .question-select {
            min-width: 76px;
        }

        @media (max-width: 640px) {
            .nav-link {
                width: 100%;
            }

            .sentence-wrapper {
                line-height: 1.9;
            }

            .question-select {
                min-width: 68px;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 text-slate-800">

    <div class="page-shell">
        <nav class="nav-bar" aria-label="Nawigacja">
            <a class="nav-link" href="../../index.html">🏠 Strona główna</a>
            <a class="nav-link" href="../index.html">← Klasa 2a</a>
            <a class="nav-link" href="./index.html">📖 Polski</a>
            <a class="nav-link active" href="./sprawdzian-ortograficzny.html">📝 Sprawdzian ortograficzny</a>
        </nav>

        <header class="bg-indigo-600 text-white p-6 shadow-md rounded-3xl mb-8 max-w-5xl mx-auto flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-white/15 flex items-center justify-center text-3xl">📝</div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Sprawdzian ortograficzny</h1>
                <p class="text-indigo-100 text-sm md:text-base mt-1">
                    Klasa 2a • trening ortograficzny z 10 losowymi zdaniami i podsumowaniem odpowiedzi.
                </p>
            </div>
        </header>

        <main id="app" class="max-w-4xl mx-auto px-0 md:px-4"></main>
    </div>

    <script>
        const quizData = [
          {
            title: "Kartkówka 1",
            questions: [
              [{t: "Wiał bardzo "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny wiatr, gdy spacerowaliśmy po parku."}],
              [{t: "W ten weekend planujemy poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ać w góry."}],
              [{t: "Na parkingu przed galerią stały nowoczesne samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ody."}],
              [{t: "Mówią, że w tym starym, opuszczonym młynie straszy du"}, {o: ["ch", "h"], a: "ch"}, {t: "."}],
              [{t: "Zastanawiam się, kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry "}, {o: ["ch", "h"], a: "h"}, {t: "erb należy do naszej rodziny."}],
              [{t: "Zatrzymaliśmy się na nocleg w małym, ale przytulnym "}, {o: ["ch", "h"], a: "h"}, {t: "otelu."}],
              [{t: "To był niezwykle ważny moment "}, {o: ["ch", "h"], a: "h"}, {t: "istoryczny dla całego kraju."}],
              [{t: "Podczas podróży spotkaliśmy r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " interesujących ludzi."}],
              [{t: "Na obrazie w muzeum namalowany był polski "}, {o: ["ch", "h"], a: "h"}, {t: "usa"}, {o: ["rz", "ż"], a: "rz"}, {t: "."}],
              [{t: "Główny bo"}, {o: ["ch", "h"], a: "h"}, {t: "ater tej książki jest bardzo odważny."}]
            ]
          },
          {
            title: "Kartkówka 2",
            questions: [
              [{t: "Zimą ten "}, {o: ["ch", "h"], a: "h"}, {t: "otel bywa bardzo "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny."}],
              [{t: "Gdzie postanowiliście się uda"}, {o: ["ć", "c"], a: "ć"}, {t: " na tegoroczne wakacje?"}],
              [{t: "Prawdziwy bo"}, {o: ["ch", "h"], a: "h"}, {t: "ater nigdy nie odmawia pomocy słabszym."}],
              [{t: "Kt"}, {o: ["ó", "u"], a: "ó"}, {t: "rędy poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ały tamte ciężarowe samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ody?"}],
              [{o: ["Ch", "H"], a: "H"}, {t: "istoryczny du"}, {o: ["ch", "h"], a: "ch"}, {t: " dawnej epoki wciąż unosi się nad tym miastem."}],
              [{t: "Na ścianie wisiał stary miecz oraz zbroja "}, {o: ["ch", "h"], a: "h"}, {t: "usa"}, {o: ["rz", "ż"], a: "rz"}, {t: "a."}],
              [{t: "Próbowaliśmy r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " sposobów, żeby naprawić ten sprzęt."}],
              [{t: "Koniecznie musisz poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ać zobaczyć ten zamek!"}],
              [{t: "Kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ód na tym parkingu jest twój?"}],
              [{t: "Biała zjawa rozpłynęła się w powietrzu jak prawdziwy du"}, {o: ["ch", "h"], a: "ch"}, {t: "."}]
            ]
          },
          {
            title: "Kartkówka 3",
            questions: [
              [{t: "W "}, {o: ["ch", "h"], a: "h"}, {t: "otelu zorganizowano wiele r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " atrakcji dla dzieci."}],
              [{o: ["Ch", "H"], a: "H"}, {t: "usarze to duma polskiego wojska, często widoczni na starych "}, {o: ["ch", "h"], a: "h"}, {t: "erbach."}],
              [{t: "Wypiliśmy "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny sok z lodem i postanowiliśmy poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ać w dalszą drogę."}],
              [{t: "Przez wypadek wszystkie samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ody utknęły w gigantycznym korku."}],
              [{t: "Kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry z twoich kolegów naprawdę wierzy w du"}, {o: ["ch", "h"], a: "ch"}, {t: "y?"}],
              [{t: "Nasz bo"}, {o: ["ch", "h"], a: "h"}, {t: "ater postanowił uda"}, {o: ["ć", "c"], a: "ć"}, {t: " się w niebezpieczną misję."}],
              [{t: "Ten średniowieczny zamek ma niesamowity, "}, {o: ["ch", "h"], a: "h"}, {t: "istoryczny charakter."}],
              [{t: "Nad główną bramą obronną wyrzeźbiony był piękny "}, {o: ["ch", "h"], a: "h"}, {t: "erb miasta."}],
              [{t: "Podczas objazdu po kraju spaliśmy w r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " "}, {o: ["ch", "h"], a: "h"}, {t: "otelach."}],
              [{t: "Poranek był niezwykle "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny i mglisty."}]
            ]
          },
          {
            title: "Kartkówka 4",
            questions: [
              [{t: "Filmowy bo"}, {o: ["ch", "h"], a: "h"}, {t: "ater pokonał potwora bez użycia magii."}],
              [{t: "Postanowiliśmy poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ać do sąsiedniego miasta, by obejrzeć słynny "}, {o: ["ch", "h"], a: "h"}, {t: "otel."}],
              [{o: ["Ch", "H"], a: "H"}, {t: "istoryczny strój, który nosił "}, {o: ["ch", "h"], a: "h"}, {t: "usa"}, {o: ["rz", "ż"], a: "rz"}, {t: ", ważył kilkadziesiąt kilogramów."}],
              [{t: "Wydawało mi się, że widzę du"}, {o: ["ch", "h"], a: "ch"}, {t: "a, kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry przemknął przez ciemny korytarz."}],
              [{t: "R"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ne luksusowe samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ody brały udział w pokazie."}],
              [{o: ["Ch", "H"], a: "Ch"}, {t: "łodny napój to najlepsze rozwiązanie na letnie upały."}],
              [{t: "Na starej pieczęci widniał zniszczony już "}, {o: ["ch", "h"], a: "h"}, {t: "erb królewski."}],
              [{t: "Musisz się tam uda"}, {o: ["ć", "c"], a: "ć"}, {t: ", aby wysłuchać r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " legend o tej okolicy."}],
              [{t: "Kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry "}, {o: ["ch", "h"], a: "h"}, {t: "otel z tej listy ma basen?"}],
              [{t: "Babcia opowiadała nam, jak du"}, {o: ["ch", "h"], a: "ch"}, {t: "y rzekomo spacerowały po strychu."}]
            ]
          },
          {
            title: "Kartkówka 5",
            questions: [
              [{t: "Dwa samo"}, {o: ["ch", "h"], a: "ch"}, {t: "ody zderzyły się na skrzyżowaniu wczoraj po południu."}],
              [{t: "Kiedy robi się "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny dzień, zawsze zakładam gruby szalik."}],
              [{t: "Czy to jest ten "}, {o: ["ch", "h"], a: "h"}, {t: "erb, kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry przynieśliście z antykwariatu?"}],
              [{t: "Każda opowieść o tym bo"}, {o: ["ch", "h"], a: "h"}, {t: "aterze ma prawdziwy, "}, {o: ["ch", "h"], a: "h"}, {t: "istoryczny rodowód."}],
              [{t: "W opuszczonym "}, {o: ["ch", "h"], a: "h"}, {t: "otelu rzekomo błąka się du"}, {o: ["ch", "h"], a: "ch"}, {t: " pierwszego właściciela."}],
              [{t: "Odważny "}, {o: ["ch", "h"], a: "h"}, {t: "usa"}, {o: ["rz", "ż"], a: "rz"}, {t: " siedział na pięknym, karym koniu."}],
              [{t: "Chcemy jeszcze poje"}, {o: ["ch", "h"], a: "ch"}, {t: "ać w kilka r"}, {o: ["ó", "u"], a: "ó"}, {o: ["ż", "rz"], a: "ż"}, {t: "ny"}, {o: ["ch", "h"], a: "ch"}, {t: " miejsc podczas tych wakacji."}],
              [{t: "Zastanawiam się, kt"}, {o: ["ó", "u"], a: "ó"}, {t: "ry du"}, {o: ["ch", "h"], a: "ch"}, {t: " z tych opowieści jest najstraszniejszy."}],
              [{t: "Zdecydowaliśmy uda"}, {o: ["ć", "c"], a: "ć"}, {t: " się na spacer, mimo że wiał "}, {o: ["ch", "h"], a: "ch"}, {t: "łodny wiatr."}],
              [{t: "Ten zabytkowy "}, {o: ["ch", "h"], a: "h"}, {t: "otel posiada swój własny, unikalny "}, {o: ["ch", "h"], a: "h"}, {t: "erb malowany na fasadzie."}]
            ]
          }
        ];

        const state = {
            gameState: 'start',
            selectedQuestions: [],
            currentIndex: 0,
            answers: {}
        };

        const app = document.getElementById('app');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startGame() {
            const allQuestions = quizData.flatMap((tab) => tab.questions);
            const shuffled = shuffleArray(allQuestions);

            state.selectedQuestions = shuffled.slice(0, 10);
            state.currentIndex = 0;
            state.answers = {};
            state.gameState = 'playing';

            render();
            scrollToTop();
        }

        function handleSelect(partIndex, value) {
            state.answers[`${state.currentIndex}-${partIndex}`] = value;
            render();
        }

        function handleNext() {
            if (state.currentIndex < state.selectedQuestions.length - 1) {
                state.currentIndex += 1;
            } else {
                state.gameState = 'summary';
            }

            render();
            scrollToTop();
        }

        function restartQuiz() {
            state.gameState = 'start';
            state.selectedQuestions = [];
            state.currentIndex = 0;
            state.answers = {};

            render();
            scrollToTop();
        }

        function getSummaryData() {
            let totalBlanks = 0;
            let correctBlanks = 0;

            state.selectedQuestions.forEach((question, qIdx) => {
                question.forEach((part, bIdx) => {
                    if (part.o) {
                        totalBlanks += 1;
                        if (state.answers[`${qIdx}-${bIdx}`] === part.a) {
                            correctBlanks += 1;
                        }
                    }
                });
            });

            const percentage = totalBlanks ? Math.round((correctBlanks / totalBlanks) * 100) : 0;
            return { totalBlanks, correctBlanks, percentage };
        }

        function getResultMessage(percentage) {
            if (percentage === 100) {
                return 'Mistrz ortografii! Wszystkie odpowiedzi są poprawne.';
            }
            if (percentage >= 80) {
                return 'Świetny wynik! Znasz już bardzo dobrze te zasady ortograficzne.';
            }
            if (percentage >= 60) {
                return 'Bardzo dobrze! Jeszcze trochę ćwiczeń i będzie perfekcyjnie.';
            }
            return 'To dobra próba. Przejrzyj poprawne odpowiedzi i spróbuj jeszcze raz.';
        }

        function renderStart() {
            const questionCount = quizData.reduce((sum, test) => sum + test.questions.length, 0);

            app.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10 text-center border border-slate-100 mt-6">
                    <div class="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner text-5xl">
                        ▶️
                    </div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-4">Gotowy na sprawdzian?</h2>
                    <p class="text-slate-500 text-lg mb-6 max-w-2xl mx-auto leading-relaxed">
                        W bazie przygotowano ${questionCount} zdań ćwiczących trudności ortograficzne.
                        Po kliknięciu przycisku wylosujesz 10 zdań w mieszanej kolejności i rozwiążesz swój własny
                        sprawdzian ortograficzny.
                    </p>

                    <div class="max-w-2xl mx-auto bg-indigo-50 border border-indigo-100 rounded-2xl p-5 text-left mb-8">
                        <h3 class="text-xl font-bold text-indigo-700 mb-3">Jak wykonać zadanie?</h3>
                        <ul class="space-y-2 text-slate-600 leading-relaxed">
                            <li>• W każdym zdaniu wybierz poprawne litery z list rozwijanych.</li>
                            <li>• Przygotowano zadania z ch/h, ó/u, rz/ż oraz końcówkami wyrazów.</li>
                            <li>• Po 10 zdaniach zobaczysz wynik procentowy i poprawne odpowiedzi.</li>
                        </ul>
                    </div>

                    <button
                        type="button"
                        data-action="start"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-4 px-10 rounded-full shadow-lg transform hover:scale-105 transition-all inline-flex items-center gap-3"
                    >
                        <span class="text-2xl">📝</span>
                        <span>Losuj 10 zdań</span>
                    </button>
                </div>
            `;
        }

        function renderPlaying() {
            const currentQuestion = state.selectedQuestions[state.currentIndex];
            const blanks = currentQuestion
                .map((part, idx) => (part.o ? idx : null))
                .filter((idx) => idx !== null);
            const allAnswered = blanks.every((idx) => state.answers[`${state.currentIndex}-${idx}`]);

            app.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-slate-100 max-w-3xl mx-auto mt-4">
                    <div class="flex justify-between items-center mb-8 border-b border-slate-100 pb-4 gap-4 flex-wrap">
                        <span class="text-slate-500 font-semibold uppercase tracking-wider text-sm">
                            Pytanie ${state.currentIndex + 1} z ${state.selectedQuestions.length}
                        </span>
                        <div class="flex gap-1 flex-wrap justify-end">
                            ${Array.from({ length: state.selectedQuestions.length }, (_, i) => `
                                <div class="h-2 w-5 sm:w-8 rounded-full ${i === state.currentIndex ? 'bg-indigo-600' : i < state.currentIndex ? 'bg-indigo-200' : 'bg-slate-200'}"></div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="text-xl sm:text-2xl font-medium text-slate-700 break-words mb-10 text-center py-4 sentence-wrapper">
                        ${currentQuestion.map((part, bIdx) => {
                            if (part.t) {
                                return `<span>${part.t}</span>`;
                            }

                            const ansKey = `${state.currentIndex}-${bIdx}`;
                            const userAnswer = state.answers[ansKey] || '';
                            const selectClass = userAnswer
                                ? 'border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-2 focus:ring-indigo-200'
                                : 'border-slate-300 bg-white text-slate-400 focus:border-indigo-500 focus:text-indigo-700';

                            return `
                                <span class="inline-block align-middle mx-1 my-1">
                                    <select
                                        data-blank-index="${bIdx}"
                                        class="question-select px-3 py-2 rounded-xl border-2 font-bold focus:outline-none transition-colors appearance-none cursor-pointer text-center shadow-sm text-lg sm:text-xl ${selectClass}"
                                    >
                                        <option value="" disabled ${userAnswer === '' ? 'selected' : ''}>?</option>
                                        ${part.o.map((opt) => `<option value="${opt}" ${userAnswer === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                                    </select>
                                </span>
                            `;
                        }).join('')}
                    </div>

                    <div class="text-center text-slate-500 mb-8">
                        Wybierz odpowiedzi we wszystkich polach, aby przejść dalej.
                    </div>

                    <div class="flex justify-center mt-8">
                        <button
                            type="button"
                            data-action="next"
                            ${allAnswered ? '' : 'disabled'}
                            class="flex items-center gap-2 px-8 py-4 rounded-2xl font-bold text-lg transition-all shadow-md w-full sm:w-auto justify-center ${allAnswered ? 'bg-indigo-600 hover:bg-indigo-700 text-white transform hover:scale-105' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                        >
                            ${state.currentIndex < state.selectedQuestions.length - 1
                                ? '<span>Dalej →</span>'
                                : '<span>Zakończ i sprawdź</span>'}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSummary() {
            const { totalBlanks, correctBlanks, percentage } = getSummaryData();
            const resultMessage = getResultMessage(percentage);

            app.innerHTML = `
                <div class="space-y-8 mt-4">
                    <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100 text-center max-w-2xl mx-auto">
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">Twój wynik</h2>
                        <div class="text-6xl font-black my-6 bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600">
                            ${percentage}%
                        </div>
                        <div class="text-xl text-slate-600 mb-3">
                            Poprawne odpowiedzi: <span class="font-bold text-slate-800">${correctBlanks} z ${totalBlanks}</span>
                        </div>
                        <p class="text-slate-500 max-w-xl mx-auto leading-relaxed mb-8">${resultMessage}</p>
                        <button
                            type="button"
                            data-action="restart"
                            class="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-bold py-3 px-8 rounded-full shadow-sm transition-all inline-flex items-center gap-2"
                        >
                            <span>🔁</span>
                            <span>Losuj kolejne 10 zdań</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-slate-100">
                        <h3 class="text-xl font-bold text-slate-700 mb-6 flex items-center gap-2 border-b pb-4">
                            <span class="text-2xl">📋</span>
                            <span>Podsumowanie Twoich odpowiedzi</span>
                        </h3>
                        <div class="space-y-6">
                            ${state.selectedQuestions.map((question, qIdx) => `
                                <div class="flex flex-col sm:flex-row gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                    <div class="font-bold text-indigo-400 mt-1 min-w-[30px]">${qIdx + 1}.</div>
                                    <div class="text-lg leading-loose flex-1 font-medium text-slate-700 break-words">
                                        ${question.map((part, bIdx) => {
                                            if (part.t) {
                                                return `<span>${part.t}</span>`;
                                            }

                                            const ansKey = `${qIdx}-${bIdx}`;
                                            const userAnswer = state.answers[ansKey] || '—';
                                            const isCorrect = state.answers[ansKey] === part.a;

                                            return `
                                                <span class="mx-1 inline-flex items-center flex-wrap gap-1 align-middle">
                                                    <span class="px-2 py-0.5 rounded-md border-2 font-bold shadow-sm ${isCorrect ? 'border-green-500 bg-green-100 text-green-700' : 'border-red-500 bg-red-100 text-red-700'}">
                                                        ${userAnswer}
                                                    </span>
                                                    ${!isCorrect ? `
                                                        <span class="inline-flex items-center border border-green-300 bg-green-50 text-green-700 px-2 py-0.5 rounded-md text-sm font-bold shadow-sm">
                                                            ✓ ${part.a}
                                                        </span>
                                                    ` : ''}
                                                </span>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            if (state.gameState === 'start') {
                renderStart();
                return;
            }

            if (state.gameState === 'playing') {
                renderPlaying();
                return;
            }

            renderSummary();
        }

        app.addEventListener('click', (event) => {
            const actionButton = event.target.closest('[data-action]');

            if (!actionButton) {
                return;
            }

            const { action } = actionButton.dataset;

            if (action === 'start') {
                startGame();
            } else if (action === 'next' && !actionButton.disabled) {
                handleNext();
            } else if (action === 'restart') {
                restartQuiz();
            }
        });

        app.addEventListener('change', (event) => {
            const select = event.target.closest('select[data-blank-index]');

            if (!select) {
                return;
            }

            handleSelect(Number(select.dataset.blankIndex), select.value);
        });

        render();
    </script>
</body>
</html>
