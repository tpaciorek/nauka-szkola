<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyktando ortograficzne - Klasa 2a</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(rgba(99, 102, 241, 0.12) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .page-shell {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 800;
            color: #4338ca;
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #c7d2fe;
            box-shadow: 0 12px 26px rgba(79, 70, 229, 0.14);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            background: white;
            box-shadow: 0 16px 32px rgba(79, 70, 229, 0.2);
        }

        .nav-link.active {
            background: #e0e7ff;
            border-color: #818cf8;
        }

        .sentence-wrapper {
            line-height: 2.3;
        }

        .word-gap {
            display: inline-flex;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            vertical-align: middle;
            gap: 0.16rem;
            padding: 0.35rem 0.5rem;
            margin: 0 0.15rem;
            border-radius: 1rem;
            border: 2px solid #c7d2fe;
            background: #eef2ff;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.08);
        }

        .word-gap-part {
            font-weight: 800;
            color: #312e81;
        }

        .question-select {
            min-width: 76px;
            max-width: 92px;
        }

        @media (max-width: 640px) {
            .nav-link {
                width: 100%;
            }

            .sentence-wrapper {
                line-height: 2;
            }

            .word-gap {
                gap: 0.12rem;
                padding: 0.28rem 0.4rem;
            }

            .question-select {
                min-width: 62px;
                max-width: 78px;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 text-slate-800">

    <div class="page-shell">
        <nav class="nav-bar" aria-label="Nawigacja">
            <a class="nav-link" href="../../index.html">🏠 Strona główna</a>
            <a class="nav-link" href="../index.html">← Klasa 2a</a>
            <a class="nav-link" href="./index.html">📖 Polski</a>
            <a class="nav-link" href="./sprawdzian-ortograficzny.html">📝 Sprawdzian ortograficzny</a>
            <a class="nav-link active" href="./dyktando-ortograficzne.html">✍️ Dyktando ortograficzne</a>
            <a class="nav-link" href="./test-z-lektury-detektyw-pozytywka.html">🔎 Test z lektury</a>
        </nav>

        <header class="bg-indigo-600 text-white p-6 shadow-md rounded-3xl mb-8 max-w-5xl mx-auto flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-white/15 flex items-center justify-center text-3xl">✍️</div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Dyktando ortograficzne</h1>
                <p class="text-indigo-100 text-sm md:text-base mt-1">
                    Klasa 2a • wybierz poprawną literę, sprawdź odpowiedź od razu i przejdź do kolejnego zdania.
                </p>
            </div>
        </header>

        <main id="app" class="max-w-4xl mx-auto px-0 md:px-4"></main>
    </div>

    <script>
        const QUESTIONS_PER_ROUND = 10;

        const questionBank = [
            { id: 1, sentenceStart: "Po deszczu ", wordParts: ["powiet", "e"], sentenceEnd: " było świeże.", options: ["rz", "ż"], correct: "rz", word: "powietrze" },
            { id: 2, sentenceStart: "Przez okno wpadało chłodne ", wordParts: ["powiet", "e"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "powietrze" },
            { id: 3, sentenceStart: "W górach ", wordParts: ["powiet", "e"], sentenceEnd: " jest bardzo czyste.", options: ["rz", "ż"], correct: "rz", word: "powietrze" },
            { id: 4, sentenceStart: "Latem ciepłe ", wordParts: ["powiet", "e"], sentenceEnd: " pachniało łąką.", options: ["rz", "ż"], correct: "rz", word: "powietrze" },
            { id: 5, sentenceStart: "Na dworze unosiło się wilgotne ", wordParts: ["powiet", "e"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "powietrze" },

            { id: 8, sentenceStart: "Wiatr przeganiał ", wordParts: ["chmu", "yska"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "chmurzyska" },
            { id: 9, sentenceStart: "Z daleka nadciągały ", wordParts: ["", "murzyska"], sentenceEnd: ".", options: ["ch", "h"], correct: "ch", word: "chmurzyska" },
            { id: 10, sentenceStart: "Burzowe ", wordParts: ["chmu", "yska"], sentenceEnd: " wyglądały groźnie.", options: ["rz", "ż"], correct: "rz", word: "chmurzyska" },

            { id: 11, sentenceStart: "Chmury mogą ", wordParts: ["p", "ysłonić"], sentenceEnd: " księżyc.", options: ["rz", "sz"], correct: "rz", word: "przysłonić" },
            { id: 12, sentenceStart: "Firanka może ", wordParts: ["p", "ysłonić"], sentenceEnd: " okno.", options: ["rz", "sz"], correct: "rz", word: "przysłonić" },
            { id: 13, sentenceStart: "Gałąź może ", wordParts: ["przysł", "nić"], sentenceEnd: " lampę.", options: ["o", "ó"], correct: "o", word: "przysłonić" },
            { id: 14, sentenceStart: "Kapelusz może ", wordParts: ["przysł", "nić"], sentenceEnd: " oczy.", options: ["o", "ó"], correct: "o", word: "przysłonić" },

            { id: 15, sentenceStart: "Za szkołą rosły wysokie ", wordParts: ["d", "ewa"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "drzewa" },
            { id: 16, sentenceStart: "Jesienią ", wordParts: ["d", "ewa"], sentenceEnd: " gubią liście.", options: ["rz", "ż"], correct: "rz", word: "drzewa" },
            { id: 17, sentenceStart: "Przy drodze stało wysokie ", wordParts: ["d", "ewa"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "drzewa" },
            { id: 18, sentenceStart: "Pod szkołą szumiały ", wordParts: ["d", "ewa"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "drzewa" },

            { id: 19, sentenceStart: "Ty bardzo ", wordParts: ["dob", "e"], sentenceEnd: " czytasz.", options: ["rz", "sz", "ż"], correct: "rz", word: "dobrze" },
            { id: 20, sentenceStart: "To ", wordParts: ["dob", "e"], sentenceEnd: ", że pomagasz mamie.", options: ["rz", "sz", "ż"], correct: "rz", word: "dobrze" },
            { id: 21, sentenceStart: "Zosia czuła się dziś ", wordParts: ["dob", "e"], sentenceEnd: ".", options: ["rz", "sz", "ż"], correct: "rz", word: "dobrze" },
            { id: 22, sentenceStart: "Pani powiedziała, że pracowaliśmy ", wordParts: ["dob", "e"], sentenceEnd: ".", options: ["rz", "sz", "ż"], correct: "rz", word: "dobrze" },

            { id: 23, sentenceStart: "Wieczorem przyszła ", wordParts: ["bu", "a"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "burza" },
            { id: 24, sentenceStart: "Silna ", wordParts: ["bu", "a"], sentenceEnd: " zerwała liście.", options: ["rz", "ż"], correct: "rz", word: "burza" },
            { id: 25, sentenceStart: "Letnia ", wordParts: ["bu", "a"], sentenceEnd: " szybko minęła.", options: ["rz", "ż"], correct: "rz", word: "burza" },
            { id: 26, sentenceStart: "Przed domem szalała głośna ", wordParts: ["bu", "a"], sentenceEnd: ".", options: ["rz", "ż"], correct: "rz", word: "burza" },

            { id: 27, sentenceStart: "To były bardzo ", wordParts: ["ci", "żkie"], sentenceEnd: " walizki.", options: ["ę", "en"], correct: "ę", word: "ciężkie" },
            { id: 28, sentenceStart: "Plecaki dzieci były ", wordParts: ["ci", "żkie"], sentenceEnd: ".", options: ["ę", "en"], correct: "ę", word: "ciężkie" },
            { id: 29, sentenceStart: "Mama niosła ", wordParts: ["ci", "żkie"], sentenceEnd: " zakupy.", options: ["ę", "en"], correct: "ę", word: "ciężkie" },
            { id: 30, sentenceStart: "Na półce stały ", wordParts: ["ci", "żkie"], sentenceEnd: " książki.", options: ["ę", "en"], correct: "ę", word: "ciężkie" },

            { id: 31, sentenceStart: "", wordParts: ["Mo", "e"], sentenceEnd: " jutro pojedziemy do babci.", options: ["ż", "rz"], correct: "ż", word: "może" },
            { id: 32, sentenceStart: "Kasia ", wordParts: ["mo", "e"], sentenceEnd: " już sama czytać.", options: ["ż", "rz"], correct: "ż", word: "może" },
            { id: 33, sentenceStart: "Tata ", wordParts: ["mo", "e"], sentenceEnd: " wróci później.", options: ["ż", "rz"], correct: "ż", word: "może" },
            { id: 34, sentenceStart: "To ", wordParts: ["mo", "e"], sentenceEnd: " być prawda.", options: ["ż", "rz"], correct: "ż", word: "może" },

            { id: 35, sentenceStart: "Rano ", wordParts: ["sł", "ńce"], sentenceEnd: " świeciło jasno.", options: ["o", "ó"], correct: "o", word: "słońce" },
            { id: 36, sentenceStart: "Ciepłe ", wordParts: ["sł", "ńce"], sentenceEnd: " ogrzało ławkę.", options: ["o", "ó"], correct: "o", word: "słońce" },
            { id: 37, sentenceStart: "Za chmurami schowało się ", wordParts: ["sł", "ńce"], sentenceEnd: ".", options: ["o", "ó"], correct: "o", word: "słońce" },
            { id: 38, sentenceStart: "Latem ", wordParts: ["sł", "ńce"], sentenceEnd: " mocno grzeje.", options: ["o", "ó"], correct: "o", word: "słońce" },

            { id: 39, sentenceStart: "Nagle zaczął padać ", wordParts: ["de", "cz"], sentenceEnd: ".", options: ["sz", "s"], correct: "sz", word: "deszcz" },
            { id: 40, sentenceStart: "Mocny ", wordParts: ["de", "cz"], sentenceEnd: " stukał o dach.", options: ["sz", "s"], correct: "sz", word: "deszcz" },
            { id: 41, sentenceStart: "Przez cały dzień padał ", wordParts: ["de", "cz"], sentenceEnd: ".", options: ["sz", "s"], correct: "sz", word: "deszcz" },
            { id: 42, sentenceStart: "Jesienny ", wordParts: ["de", "cz"], sentenceEnd: " zmoczył drogę.", options: ["sz", "s"], correct: "sz", word: "deszcz" },

            { id: 43, sentenceStart: "Jutro ", wordParts: ["b", "dzie"], sentenceEnd: " ciepło.", options: ["ę", "en"], correct: "ę", word: "będzie" },
            { id: 44, sentenceStart: "Po południu ", wordParts: ["b", "dzie"], sentenceEnd: " trening.", options: ["ę", "en"], correct: "ę", word: "będzie" },
            { id: 45, sentenceStart: "W klasie ", wordParts: ["b", "dzie"], sentenceEnd: " cisza.", options: ["ę", "en"], correct: "ę", word: "będzie" },
            { id: 46, sentenceStart: "Za chwilę ", wordParts: ["b", "dzie"], sentenceEnd: " przerwa.", options: ["ę", "en"], correct: "ę", word: "będzie" },

            { id: 47, sentenceStart: "Dzieci ", wordParts: ["zacz", "ły"], sentenceEnd: " śpiewać.", options: ["ę", "en"], correct: "ę", word: "zaczęły" },
            { id: 48, sentenceStart: "Krople deszczu ", wordParts: ["zacz", "ły"], sentenceEnd: " spadać z nieba.", options: ["ę", "en"], correct: "ę", word: "zaczęły" },
            { id: 49, sentenceStart: "Ptaki ", wordParts: ["zacz", "ły"], sentenceEnd: " budować gniazda.", options: ["ę", "en"], correct: "ę", word: "zaczęły" },
            { id: 50, sentenceStart: "Gwiazdy ", wordParts: ["zacz", "ły"], sentenceEnd: " świecić.", options: ["ę", "en"], correct: "ę", word: "zaczęły" }
        ];

        const uniqueWords = [...new Set(questionBank.map((question) => question.word.toLowerCase()))];

        const state = {
            gameState: 'idle',
            currentQuestions: [],
            currentIndex: 0,
            selectedValue: '',
            showFeedback: false,
            history: [],
            score: 0
        };

        const app = document.getElementById('app');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderWordBlock(question, middleContent, wrapperClass = '') {
            return `
                <span class="word-gap ${wrapperClass}">
                    <span class="word-gap-part">${question.wordParts[0]}</span>
                    ${middleContent}
                    <span class="word-gap-part">${question.wordParts[1]}</span>
                </span>
            `;
        }

        function startQuiz() {
            const shuffled = shuffleArray(questionBank);
            const roundLength = Math.min(QUESTIONS_PER_ROUND, questionBank.length);

            state.currentQuestions = shuffled.slice(0, roundLength).map((question) => ({
                ...question,
                options: shuffleArray(question.options)
            }));

            state.currentIndex = 0;
            state.score = 0;
            state.history = [];
            state.selectedValue = '';
            state.showFeedback = false;
            state.gameState = 'playing';

            render();
            scrollToTop();
        }

        function selectAnswer(value) {
            if (!state.showFeedback) {
                state.selectedValue = value;
                render();
            }
        }

        function checkAnswer() {
            if (!state.selectedValue) {
                return;
            }

            const currentQuestion = state.currentQuestions[state.currentIndex];
            const isCorrect = state.selectedValue === currentQuestion.correct;

            if (isCorrect) {
                state.score += 1;
            }

            state.history.push({
                ...currentQuestion,
                userAnswer: state.selectedValue,
                isCorrect
            });

            state.showFeedback = true;
            render();
        }

        function nextQuestion() {
            if (state.currentIndex < state.currentQuestions.length - 1) {
                state.currentIndex += 1;
                state.selectedValue = '';
                state.showFeedback = false;
                render();
                scrollToTop();
                return;
            }

            state.gameState = 'finished';
            render();
            scrollToTop();
        }

        function renderIdle() {
            app.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl max-w-3xl mx-auto p-8 md:p-10 text-center border border-slate-100 mt-6">
                    <div class="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner text-5xl">
                        ✍️
                    </div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-4">Gotowy na kolejne dyktando?</h2>
                    <p class="text-slate-500 text-lg mb-6 max-w-2xl mx-auto leading-relaxed">
                        Rozwiązuj zdania krok po kroku. W każdym zadaniu wybierzesz poprawną literę do luki,
                        od razu sprawdzisz swoją odpowiedź i przejdziesz dalej.
                    </p>

                    <div class="max-w-2xl mx-auto bg-indigo-50 border border-indigo-100 rounded-2xl p-5 text-left mb-8 space-y-4">
                        <div>
                            <h3 class="text-xl font-bold text-indigo-700 mb-3">Jak działa to dyktando?</h3>
                            <ul class="space-y-2 text-slate-600 leading-relaxed">
                                <li>• Za każdym razem losowanych jest <strong>${QUESTIONS_PER_ROUND} zdań</strong> z bazy <strong>${questionBank.length}</strong> przykładów.</li>
                                <li>• Po każdej odpowiedzi od razu zobaczysz, czy wybór był poprawny.</li>
                                <li>• Na końcu sprawdzisz wynik i pełne podsumowanie wszystkich odpowiedzi.</li>
                            </ul>
                        </div>

                        <div>
                            <h4 class="text-lg font-bold text-indigo-700 mb-3">Słówka do ćwiczenia:</h4>
                            <div class="flex flex-wrap gap-2">
                                ${uniqueWords.map((word) => `
                                    <span class="bg-white border border-indigo-200 text-indigo-800 font-semibold px-3 py-1.5 rounded-full shadow-sm">
                                        ${word}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <button
                        type="button"
                        data-action="start"
                        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-2xl transition-all inline-flex items-center justify-center gap-3 text-xl shadow-lg shadow-indigo-200 transform hover:scale-105"
                    >
                        <span class="text-2xl">▶️</span>
                        <span>Rozpocznij dyktando</span>
                    </button>
                </div>
            `;
        }

        function renderPlaying() {
            const question = state.currentQuestions[state.currentIndex];
            const totalQuestions = state.currentQuestions.length;
            const progress = Math.round((state.currentIndex / totalQuestions) * 100);
            const answerState = state.history[state.currentIndex];
            const isCorrect = answerState ? answerState.isCorrect : false;

            const wrapperClass = state.showFeedback
                ? (isCorrect ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50')
                : 'border-indigo-200 bg-indigo-50';

            const selectClass = state.showFeedback
                ? (isCorrect
                    ? 'bg-green-100 text-green-900 border border-green-300'
                    : 'bg-red-100 text-red-900 border border-red-300')
                : 'bg-white text-indigo-700 border border-indigo-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 shadow-sm';

            const selectMarkup = `
                <select
                    data-action="select"
                    class="question-select px-3 py-2 text-2xl font-bold rounded-lg outline-none transition-all appearance-none text-center cursor-pointer ${selectClass}"
                    ${state.showFeedback ? 'disabled' : ''}
                >
                    <option value="" disabled ${state.selectedValue === '' ? 'selected' : ''}>-</option>
                    ${question.options.map((option) => `<option value="${option}" ${state.selectedValue === option ? 'selected' : ''}>${option}</option>`).join('')}
                </select>
            `;

            app.innerHTML = `
                <div class="w-full max-w-2xl mx-auto">
                    <div class="mb-8">
                        <div class="flex justify-between text-sm font-bold text-slate-500 mb-2 px-1 gap-3 flex-wrap">
                            <span>Pytanie ${state.currentIndex + 1} z ${totalQuestions}</span>
                            <span>Ukończono ${progress}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                            <div class="bg-indigo-600 h-3 rounded-full transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                        <div class="bg-indigo-50 border-b border-indigo-100 p-6 flex justify-center">
                            <h2 class="text-xl font-bold text-indigo-900 text-center">Uzupełnij brakującą część słowa</h2>
                        </div>

                        <div class="p-8 md:p-12">
                            <div class="text-2xl md:text-3xl font-medium text-slate-800 text-center mb-12 sentence-wrapper">
                                <span>${question.sentenceStart}</span>
                                ${renderWordBlock(question, selectMarkup, wrapperClass)}
                                <span>${question.sentenceEnd}</span>
                            </div>

                            <div class="flex flex-col items-center min-h-[160px] justify-center">
                                ${!state.showFeedback ? `
                                    <button
                                        type="button"
                                        data-action="check"
                                        ${state.selectedValue ? '' : 'disabled'}
                                        class="py-4 px-10 rounded-xl font-bold text-xl transition-all shadow-lg flex items-center justify-center gap-3 w-full sm:w-auto ${state.selectedValue ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200 cursor-pointer transform hover:scale-105' : 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'}"
                                    >
                                        <span class="text-2xl">✔️</span>
                                        <span>Sprawdź odpowiedź</span>
                                    </button>
                                ` : `
                                    <div class="w-full flex flex-col items-center animate-in fade-in zoom-in duration-300">
                                        <div class="flex flex-col sm:flex-row items-center gap-4 px-6 py-4 rounded-xl w-full mb-6 border-2 ${isCorrect ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}">
                                            ${isCorrect ? `
                                                <div class="text-3xl shrink-0">✅</div>
                                                <span class="font-bold text-lg text-center sm:text-left">Świetnie! Poprawna odpowiedź.</span>
                                            ` : `
                                                <div class="text-3xl shrink-0">❌</div>
                                                <div class="text-lg text-center sm:text-left">
                                                    Niestety to błąd. Poprawna forma to:<br class="sm:hidden" />
                                                    <span class="font-bold text-red-900 bg-red-100 px-2 py-1 rounded ml-1">${question.word}</span>
                                                    <span class="ml-1">(luka: ${question.correct})</span>
                                                </div>
                                            `}
                                        </div>

                                        <button
                                            type="button"
                                            data-action="next"
                                            class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-lg shadow-slate-300 flex items-center justify-center gap-3 text-xl w-full sm:w-auto transform hover:scale-105"
                                        >
                                            <span>${state.currentIndex < totalQuestions - 1 ? 'Następne zdanie' : 'Zobacz podsumowanie'}</span>
                                            <span class="text-2xl">➡️</span>
                                        </button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinished() {
            const totalQuestions = state.currentQuestions.length;
            const scoreClass = state.score >= 8 ? 'text-green-500' : state.score >= 5 ? 'text-amber-500' : 'text-red-500';

            app.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-8 mt-4">
                    <div class="bg-white rounded-3xl shadow-lg p-8 md:p-12 text-center border border-slate-100">
                        <div class="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl text-indigo-600">🏆</div>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">Koniec dyktanda!</h2>
                        <p class="text-slate-600 text-lg mb-8">Oto Twój wynik dla tej dziesiątki zdań.</p>

                        <div class="text-7xl font-black mb-10 ${scoreClass}">${state.score} / ${totalQuestions}</div>

                        <button
                            type="button"
                            data-action="restart"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl transition-all inline-flex items-center justify-center gap-3 mx-auto text-xl shadow-lg shadow-indigo-200 hover:scale-105"
                        >
                            <span class="text-2xl">🔁</span>
                            <span>Losuj nowe zdania</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-3xl shadow-lg p-6 md:p-10 border border-slate-100">
                        <h3 class="text-2xl font-bold text-slate-800 mb-8 border-b pb-4">Szczegółowe podsumowanie:</h3>
                        <div class="space-y-4">
                            ${state.history.map((answer) => `
                                <div class="p-5 rounded-2xl border-l-8 flex items-start gap-4 ${answer.isCorrect ? 'bg-green-50/50 border-green-400' : 'bg-red-50/50 border-red-400'}">
                                    <div class="mt-1 shrink-0 text-2xl">${answer.isCorrect ? '✅' : '❌'}</div>
                                    <div>
                                        <div class="text-lg text-slate-700 leading-relaxed sentence-wrapper">
                                            <span>${answer.sentenceStart}</span>
                                            ${renderWordBlock(
                                                answer,
                                                `<span class="font-bold px-2 py-1 rounded ${answer.isCorrect ? 'bg-green-200 text-green-900' : 'bg-red-200 text-red-900 line-through'}">${answer.userAnswer}</span>`,
                                                answer.isCorrect ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'
                                            )}
                                            <span>${answer.sentenceEnd}</span>
                                        </div>
                                        ${!answer.isCorrect ? `
                                            <div class="mt-2 text-sm text-red-800 bg-red-100 inline-block px-3 py-1.5 rounded-lg font-medium">
                                                Poprawnie: <span class="font-bold underline">${answer.word}</span>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            if (state.gameState === 'idle') {
                renderIdle();
                return;
            }

            if (state.gameState === 'playing') {
                renderPlaying();
                return;
            }

            renderFinished();
        }

        app.addEventListener('click', (event) => {
            const actionButton = event.target.closest('[data-action]');

            if (!actionButton) {
                return;
            }

            const { action } = actionButton.dataset;

            if (action === 'start') {
                startQuiz();
            } else if (action === 'check' && !actionButton.disabled) {
                checkAnswer();
            } else if (action === 'next') {
                nextQuestion();
            } else if (action === 'restart') {
                startQuiz();
            }
        });

        app.addEventListener('change', (event) => {
            const select = event.target.closest('select[data-action="select"]');

            if (!select) {
                return;
            }

            selectAnswer(select.value);
        });

        render();
    </script>
</body>
</html>
